      operationId: Send Data Message
      description: |-
        A bot can send a message to other bots.

        The message can be sent to bots subscribed on the specific data stream address.

        Location bots can send messages to other location bots in the same location and organizational bots.

        Organizational bots can send messages to other organizational bots in the same organization and to location bots in this organization.

        The location IDs and the bot instance IDs (appInstanceId) are specified in the request body.
      tags:
