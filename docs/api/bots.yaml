  /cloud/appstore/appInstance:
    post:
      summary: Purchase a New Bot Instance
      operationId: Purchase a New Bot Instance
      description: |-
        Each connected bot instance gets a unique ID to separate it from the other bot instances.

        User can only set permissions for devices that are marked compatible with the bot.

        <b>Development</b>

        When purchasing a bot, developer and active beta testers always obtain instances with 'development=true', whereas other users obtain an instances with 'development=false'.

        The bot instances with 'development=true' always run the latest version of the bot, the developer's version, if any.
        The bot instances with 'development=false' always run the currently available public version of the bot.

        <b>End Time</b>

        Bot with 'development = true' only runs for a limited period of time. The stopping time is set by the endDate attribute.
        After this time, the bot will change its status to 2 (inactive).
        The owner can restart his bot instance by changing its status to 1 (active).
        In this case, endDate is recalculated automatically (by default this is the current date plus 24 hours).

        ### Bot Instance Status

        | Status |    Name    | Description                   |
        |:------:|:----------:|:------------------------------|
        |   0    | Incomplete | Bot is not configured yet     | 
        |   1    |   Active   | Bot is configured and working |
        |   2    |  Inactive  | Bot is temporary turned off   |
      tags:
        - End-User Bot Shop APIs
      security:
        - userApiKey: []
        - adminApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the app
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Assign the bot instance to the specific user location
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Assign the bot instance to the specific organization
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  appInstanceId:
                    type: integer
              example:
                resultCode: 0
                appInstanceId: 3965

    put:
      summary: Configure a Bot Instance
      operationId: Configure a Bot Instance
      description: |-
        The API is for changing the status or/and altering the access or communication parameters.

        <b>Tip:</b> the request body is optional - <u>there is no need for it</u> if you update nothing but Status, End Date, Development.

        <b>Access block</b>

        The access block should only contain the parameters that need to be updated for the specified bot instance.
        By default, the bot instance is allowed access to all locations and compatible devices that are required by the bot and which the user has.
        If you need to prevent the bot from accessing the specified object (device, location, or call center), add this object id in the access block with the parameter 'excluded = true'.
        If you need to enable access to an object (previously excluded from the access list), add the object id into the access block with the parameter 'excluded = false'.

        <b>Tip:</b> If you do not need to change the current access configuration, just do not include the access block in the request body.

        <b>Communications block</b>

        By default, the bot instance uses all the communication channels allowed in the bot definition.
        If you need to disable some communication channels,
        simply add an element with the corresponding category to the communications block and set the flag to "false" for those channels that you want to disable
        (do not forget to specify "true" for those channels that should not be disabled for the category).

        <b>Tip:</b> If you do not need to change the current communication channels, just do not include the communications block in the request body.
      tags:
        - End-User Bot Shop APIs
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Bot instance ID
          required: true
          schema:
            type: integer
        - name: status
          in: query
          description: New bot instance status
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              app:
                nickname: User-defined Nickname Here
                timezone: US/Eastern
                access:
                  - category: 1
                    locationId: 123
                  - category: 2
                  - category: 4
                    deviceId: ABC123456DEF7890
                    excluded: true
                  - category: 4
                    deviceId: SMARTPLUG01
                communications:
                  - category: 0
                    email: true
                    push: true
                    sms: false
                    msg: false
                  - category: 2
                    email: true
                    push: true
                    sms: false
                    msg: false
            schema:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    nickname:
                      type: string
                    timezone:
                      type: string
                    access:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: integer
                          locationId:
                            type: integer
                          deviceId:
                            type: string
                          excluded:
                            type: boolean
                        required:
                          - category
                          - deviceId
                    communications:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: integer
                          email:
                            type: boolean
                          push:
                            type: boolean
                          sms:
                            type: boolean
                          msg:
                            type: boolean
                        required:
                          - category
                          - email
                          - push
                          - sms
                          - msg
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Bot Instances
      operationId: Get Bot Instances
      description: |-
        The list of bot instances owned by a location or organization.

        Each item of the list includes the attributes of the bot instance and the attributes of the parent bot (marketing name, bundle, version, etc):

        | Attribute Name | Meaning                                                                                                                                                                 |
        |:--------------:|:------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
        |     active     | Indicates whether the bot instance may be triggered at its current state. This depends on the values of the attributes 'status', 'development', 'published', 'endDate'. |
        |  development   | Indicated whether the bot instance runs the latest version of the bot. The attribute value is 'true' if the bot instance is owned by developer or beta tester.          |
        |    endDate     | The date when the bot instance can be automatically paused. This only happens if 'development=true' and the latest bot version is not published yet.                    |
        |   published    | Indicates whether the parent bot version has been published.                                                                                                            |
        |    version     | The release number of the parent bot version.                                                                                                                           |
        |     bundle     | The bundle ID of the parent bot.                                                                                                                                        |
        |      name      | The marketing name of the parent bot.                                                                                                                                   | 


        Parameters of bot instances include an access list and communication channels.
        Items in the access list can contain the attribute "excluded", which means that they are allowed by the bot, but not allowed by the bot instance.
      tags:
        - End-User Bot Shop APIs
      security:
        - userApiKey: []
        - adminApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Get specific bot instance by ID
          schema:
            type: integer
        - name: bundle
          in: query
          description: Filter by the bot bundle ID
