openapi: 3.1.1
info:
  title: 'IoT Software Suite: Bot API'
  version: '57'
  description: |-
    The Bot Server is a real-time data analytics framework that allows software developers to create new bots,
    features, and services on top of any Internet-connected product.

    There are 3 parts to this API documentation:

    * Developers can create, publish, and manage their own bots.
    * End Users can discover, purchase, and use bots available from a Bot Shop.
    * Care Daily engineers can use proprietary Bot Server APIs to implement the proprietary BotEngine Python Framework, which is used by developers.

    The BotEngine is single monolithic framework, written in Python,
    that provides all the capabilities for the Bot Lab to develop and run bots locally,
    the ability for developers to manage their bots on a remote Bot Shop,
    and even the capability to act like an end user to search, purchase, and manage their own bot instances.

    This document is confidential Care Daily Company.

servers:
  - url: https://app.peoplepowerco.com/
    description: US production
  - url: https://eu.caredaily.ai/
    description: EU production
  - url: https://sboxall.peoplepowerco.com/
    description: Sandbox

paths:
  /cloud/developer/teams:
    post:
      summary: Create Developers Team
      operationId: Create Developers Team
      description: Create a new team containing the caller as the only team member (developer).
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      requestBody:
        content:
          application/json:
            example:
              name: PPC Team
              description: Care Daily development team
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Developer Teams
      operationId: Get Developer Teams
      description: |-
        Regular users can only see the teams they are members of.
        System configuration administrators can see all existing teams.
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: query
          description: Filter by development team name
          schema:
            type: string
        - name: userId
          in: query
          description: Filter by development team member user ID
          schema:
            type: integer
        - name: bundle
          in: query
          description: Filter by bot bundle ID to which the development team is assigned
          schema:
            type: string
      responses:
        '200':
          description: Developer Teams
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  teams:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              user:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  email:
                                    type: string
                              role:
                                type: integer
                              roleName:
                                type: string
                            required:
                              - user
                              - role
                              - roleName
                        bots:
                          type: array
                          items:
                            type: string
              example:
                resultCode: 0
                teams:
                  - id: 123
                    name: PPC Team
                    description: Care Daily development team
                    members:
                      - user:
                          id: 1526
                          email: developer@caredaily.ai
                        role: 1
                        roleName: Developer
                      - user:
                          id: 5261
                          email: tester@caredaily.ai
                        role: 3
                        roleName: Tester
                    bots:
                      - com.ppc.PresenceFamily
                      - com.test.FamilyRelease


  /cloud/developer/teams/{teamName}:
    post:
      summary: Add a Developer
      operationId: Add a Developer
      description: >-
        Any team member (except of testers) can add a new member of that team.
        System configuration administrators can add any user to any development team.
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: path
          description: Existing developer team name
          required: true
          schema:
            type: string
        - name: username
          in: query
          description: User to include to the team, either username or user ID is required
          schema:
            type: string
        - name: userId
          in: query
          description: User ID to include to the team
          schema:
            type: integer
        - name: tester
          in: query
          description: Add beta-tester. Default is 'false' (developer).
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    delete:
      summary: Remove a Developer
      operationId: Remove a Developer
      description: >-
        Any member (except of testers) of existing team can remove any other member of that team.
        System configuration administrators can remove any member of any team.
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: path
          description: Existing developer team name
          required: true
          schema:
            type: string
        - name: username
          in: query
          description: User to include to the team, either username or user ID is required
          schema:
            type: string
        - name: userId
          in: query
          description: User ID to remove from the team
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/developer/teams/{teamName}/secrets:
    put:
      summary: Put a Developers Team Secret
      operationId: Put Developers Team Secret
      description: >-
        Create or update a developers team named secret value.
        The value will be stored encrypted and be available for team bot instances.
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: path
          required: true
          description: Developer team name
          schema:
            type: string
        - name: secretName
          in: query
          required: true
          description: Secret value name, maximum 50 characters.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              secretValue: ABC123
            schema:
              type: object
              properties:
                secretValue:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Developers Team Secret Names
      operationId: Get Developers Team Secret Names
      description: List all existing secret names
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: path
          required: true
          description: Developer team name
          schema:
            type: string
      responses:
        '200':
          description: Secret names
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  secretNames:
                    type: array
                    items:
                      type: string
              example:
                resultCode: 0
                secretNames:
                  - 'ABC123'
                  - 'DEF456'

    delete:
      summary: Delete a Developers Team Secret
      operationId: Delete Developers Team Secret
      description: Delete an existing secret value.
      tags:
        - Developer Teams
      security:
        - userApiKey: []
      parameters:
        - name: teamName
          in: path
          required: true
          description: Developer team name
          schema:
            type: string
        - name: secretName
          in: query
          required: true
          description: Secret value name, maximum 50 characters.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/developer/apps:
    put:
      summary: Create or Update Bot
      operationId: Create or Update Bot
      description: ''
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot, i.e. ai.caredaily.MyBot
          required: true
          schema:
            type: string
        - name: developerTeam
          in: query
          description: >-
            The name of developer team to involve into development.
            The parameter is required for a new bot
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              app:
                category: L,E
                type: 0
                executionPlace: 0
                serviceName: PaidService
                core: 1
                marketing:
                  - lang: en
                    name: My First Bot
                    author: Your Company
                    copyright: Copyright 2016 Your Company
                    description: This is an example of how to run a bot
                    marketingUrl: https://marketingurl.com
                    supportUrl: https://myurl.com/support
                    videoUrl: https://youtube.com/?s=myvideo
                    privacyUrl: https://myurl.com/privacy
                    keywords: 100,characters,total,comma,separated
            schema:
              type: object
              properties:
                app:
                  type: object
                  properties:
                    category:
                      type: string
                    type:
                      type: integer
                    executionPlace:
                      type: integer
                    serviceName:
                      type: string
                    core:
                      type: integer
                    marketing:
                      type: array
                      items:
                        type: object
                        properties:
                          lang:
                            type: string
                          name:
                            type: string
                          author:
                            type: string
                          copyright:
                            type: string
                          description:
                            type: string
                          marketingUrl:
                            type: string
                          supportUrl:
                            type: string
                          videoUrl:
                            type: string
                          privacyUrl:
                            type: string
                          keywords:
                            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Developer Bots
      operationId: Get Developer Bots
      description: ''
      security:
        - userApiKey: []
      tags:
        - Bot Development
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID to filter by
          schema:
            type: string
      responses:
        '200':
          description: Bots
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  apps:
                    type: array
                    items:
                      type: object
                      properties:
                        appId:
                          type: integer
                        bundle:
                          type: string
                        developerTeam:
                          type: string
                        category:
                          type: string
                        type:
                          type: integer
                        executionPlace:
                          type: integer
                        core:
                          type: integer
                        marketing:
                          type: array
                          items:
                            type: object
                            properties:
                              lang:
                                type: string
                              name:
                                type: string
                              author:
                                type: string
                              copyright:
                                type: string
                              description:
                                type: string
                              whatsnew:
                                type: string
                              marketingUrl:
                                type: string
                              supportUrl:
                                type: string
                              videoUrl:
                                type: string
                              privacyUrl:
                                type: string
                              keywords:
                                type: string
              example:
                resultCode: 0
                apps:
                  - appId: 2342
                    bundle: ai.caredaily.MyBot
                    developerTeam: developer team name
                    category: L,E
                    type: 0
                    executionPlace: 0
                    core: 1
                    marketing:
                      - lang: en
                        name: My First Bot
                        author: Your Company
                        copyright: Copyright 2015 Your Company
                        description: |-
                          This is an example of how to run bots.
                          Lines can be separated manually.

                          4,000 characters maximum
                        whatsnew: |-
                          This is where we describe what's new with this specific version of the bot

                          4,000 characters maximum
                        marketingUrl: https://marketingurl.com
                        supportUrl: https://myurl.com/support
                        videoUrl: https://youtube.com/?s=myvideo
                        privacyUrl: https://myurl.com/privacy
                        keywords: 100,characters,total,comma,separated


  /cloud/developer/objects/{name}:
    put:
      summary: Upload Bot Object
      operationId: Upload Bot Object
      description: |-
        Each bot can contain a publicly available icon and/or other images.
        These will be displayed in the Bot Shop.

        For all images and icons, the PNG format is recommended. You should avoid using interlaced PNGs.

        The standard bit depth for icons and images is 24 bits.

        The standard size for icons is 1024 x 1024 px.
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: name
          in: path
          description: Object name. Use "icon" for icons.
          required: true
          schema:
            type: string
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot, i.e. ai.caredaily.MyBot
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/developer/messageTopics:
    put:
      summary: Update Message Topics
      operationId: Update Message Topics
      description: |-
        Bot developers can create message topics and add/remove them to their bots.
        
        Create message topics if they don't exist and update the list of topics for the specified bot.
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              topics:
                - topicId: welcome
                  name:
                    en: Welcome
                    es: Bienvenido
            schema:
              type: object
              properties:
                topics:
                  type: array
                  items:
                    type: object
                    properties:
                      topicId:
                        type: string
                      name:
                        type: object
                        additionalProperties:
                          type: string
                        description: Multilingual string map
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/developer/versions:
    get:
      summary: Get Bot Versions
      operationId: Get Bot Versions
      description: The fields of the 'function' block are described in the 'Bot Code' section below.
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter versions by statuses. Multiple values can be provided
          schema:
            type: integer
        - name: version
          in: query
          description: If specified, only this version of the bot will be returned
          schema:
            type: string
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  versionsCount:
                    type: integer
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        version:
                          type: string
                        runtime:
                          type: integer
                        status:
                          type: integer
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                        statusChangeDate:
                          type: string
                        statusChangeDateMs:
                          type: integer
                        codeUploadDate:
                          type: string
                        codeUploadDateMs:
                          type: integer
                        function:
                          type: object
                          properties:
                            memory:
                              type: integer
                            timeout:
                              type: integer
                            name:
                              type: string
                            startDate:
                              type: string
                            startDateMs:
                              type: integer
                        mlFunction:
                          type: object
                          properties:
                            memory:
                              type: integer
                            timeout:
                              type: integer
                            name:
                              type: string
                            startDate:
                              type: string
                            startDateMs:
                              type: integer
                        whatsnew:
                          type: object
                          additionalProperties:
                            type: string
                          description: Multilingual string map
                        maxPurchaseOccurrence:
                          type: integer
                        goalRule:
                          type: boolean
                        trigger:
                          type: integer
                        schedules:
                          type: object
                          additionalProperties:
                            type: string
                          description: Trigger CRON schedules as ID/expression string map
                        deviceTypes:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              reason:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Multilingual string map
                            required:
                              - id
                              - reason
                        access:
                          type: array
                          items:
                            type: object
                            properties:
                              category:
                                type: integer
                              reason:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Multilingual string map
                            required:
                              - category
                              - reason
                        dataStreams:
                          type: array
                          items:
                            type: object
                            properties:
                              address:
                                type: string
                            required:
                              - address
                        communications:
                          type: array
                          items:
                            type: object
                            properties:
                              category:
                                type: integer
                              email:
                                type: boolean
                              push:
                                type: boolean
                              sms:
                                type: boolean
                              msg:
                                type: boolean
                            required:
                              - category
                              - email
                              - push
                              - sms
                              - msg
                      required:
                        - version
                        - runtime
                        - status
                        - creationDate
                        - creationDateMs
                        - statusChangeDate
                        - statusChangeDateMs
                        - whatsnew
                        - maxPurchaseOccurrence
              example:
                resultCode: 0
                versionsCount: 10
                versions:
                  - id: 12543
                    version: 1.0.2
                    runtime: 1
                    status: 1
                    creationDate: '2015-09-01T12:12:12Z'
                    creationDateMs: 1441125566000
                    statusChangeDate: 2015-09-25T12:12Z
                    statusChangeDateMs: 1443199175421
                    codeUploadDate: '2015-09-25T12:12:11Z'
                    codeUploadDateMs: 1443199174421
                    function:
                      memory: 704
                      timeout: 600
                      name: bot-sbox-521-3627:2
                      startDate: '2025-03-08T11:33:46.446Z'
                      startDateMs: 1741433626446
                    mlFunction:
                      memory: 10240
                      timeout: 900
                      name: bot-sbox-521-3627:1
                      startDate: '2025-03-08T11:33:46.446Z'
                      startDateMs: 1741433626446
                    whatsnew:
                      en: What's new with this specific version
                    maxPurchaseOccurrence: 1
                    goalRule: true
                    trigger: 11
                    schedules:
                      ID1: 0 0 5 * * *
                      WeeklyEmail: 0 0 12 ? * FRI *
                    deviceTypes:
                      - id: 24
                        reason:
                          en: Why we need to access this device
                      - id: 25
                        reason:
                          en: Why we need to access this device
                    access:
                      - category: 1
                        reason:
                          en: Why we need to access location data
                      - category: 2
                        reason:
                          en: Why we need to access device files
                    dataStreams:
                      - address: organization.ppc
                      - address: temperatureChange
                      - address: user.mode
                    communications:
                      - category: 0
                        email: true
                        push: true
                        sms: false
                        msg: false
                      - category: 1
                        email: false
                        push: false
                        sms: false
                        msg: false
                      - category: 2
                        email: true
                        push: true
                        sms: false
                        msg: false
                      - category: 3
                        email: false
                        push: false
                        sms: false
                        msg: false
                      - category: 4
                        email: false
                        push: false
                        sms: false
                        msg: false
                  - version: 1.0.0
                    runtime: 1
                    status: 4
                    creationDate: '2015-09-01T12:12:12-07:00'
                    creationDateMs: 1441125566000
                    statusChangeDate: '2015-09-25T12:12:12-07:00'
                    statusChangeDateMs: 1443199175421
                    whatsnew:
                      en: |-
                        My First Version
                        - Brief
                        - description
                        - of what's new.
                    maxPurchaseOccurrence: 1
                  - version: 0.0.5
                    runtime: 1
                    status: 7
                    creationDate: '2015-09-01T12:12:12-07:00'
                    creationDateMs: 1441125566000
                    statusChangeDate: '2015-09-25T12:12:12-07:00'
                    statusChangeDateMs: 1443199175421
                    whatsnew:
                      en: |
                        Beta Version
                        - Brief
                        - description
                        - of what's new.

    put:
      summary: Update the Latest Version
      operationId: Update the Latest Version
      description: |-
        Only the latest version can be changed in the status of "Waiting for upload" or "Privately Available".
        If the bot does not have a version in this state, it will be created.

        To do anything with a bot that is already publicly available, you must submit a new version to replace it or contact support@caredaily.ai.
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot, i.e. ai.caredaily.MyBot
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              version:
                version: 1.0.2
                whatsnew:
                  en: What's new with this specific version
                trigger: 11
                schedules:
                  ID1: 0 0 5 * * *
                  WeeklyEmail: 0 0 12 ? * FRI *
                maxPurchaseOccurrence: 2
                goalRule: true
