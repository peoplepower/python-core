  - name: Bot Question APIs
    description: |-
      Queue up a question to ask the user. When a question is answered, the bot should be triggered to execute.
  
      Each question has a key, which is the responsibility of the bot developer to make unique.
      Each bot type shares the same keys, and different bot types can user the same key name without overlapping.
      We use a keys for each unique question, because the question can be phrased in different ways but essentially mean the same thing.
      The bot developer might want to update the way the question is asked, without losing information.
      
      The full questions and answers should be permanently stored in the user's account in a way that will allow Care Daily to later leverage that data to perform targeted advertising for this user.
      
      Only return answers for questions that were asked by this type of bot (not the bot instance, but the type of app).
      One type of bot may have multiple instances in the user's account, and all of them can share access to the same questions since it's all the same bot.
      
      Questions should have the ability to allow users to see, anonymously, other user's answers with the "public" flag.
      This is designed to increase engagement, where people will answer a question just to see how they fit in with everyone else.
      
      ### Collection
      
      Collections of questions are common to all instances of the bot.
      Each bot instance can create or update such collections and associate the questions to collections.
      
      | Name             | Type       | Description                                    |
      |------------------|------------|------------------------------------------------|
      | name             | string     | A unique name for referencing this collection. |
      | mlName           | string map | Multiligual name of the collection.            |
      | description      | string     | The title of the collection.                   |
      | mlDescription    | string map | Multilingual title of the collection.          |
      | icon             | string     | Icon to show next to the collection, if any.   |
      | iconFont         | string     | Icon font. |
      | weight           | integer    | The weight of the collection                   |
      | media            | string     | Media object to display for the collection.    |
      | mediaContentType | string     | The content type of the media object.          |

      ### Question
  
      | Name           | Type         | Description                                                                                                                                                                                                                             |
      |----------------|--------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
      | id             | integer      | Question ID assigned by the system                                                                                                                                                                                                      |
      | key            | string       | Unique key to identify this context of this question later, regardless of the description or language of the question itself.                                                                                                           |
      | appInstanceId  | integer      | The bot instance ID, that asks the question.                                                                                                                                                                                            |
      | creationDateMs | milliseconds | Creation timestamp                                                                                                                                                                                                                      |
      | question       | string       | The actual text of the question to ask.                                                                                                                                                                                                 |
      | placeholder    | string       | A placeholder for this question.                                                                                                                                                                                                        |
      | editable       | boolean      | If the message is editable, then that means it will show up in a place in the bot where the user can reconfigure the question later. This is typically used by bots to enable a UI for settings to configure the bot through questions. |
      | responseType   | integer      | The type of question (see below)                                                                                                                                                                                                        |
      | displayType    | integer      | Application-layer display type for each type of question (for example, yes/no vs. on/off switch, or a slider that shows integers vs. a slider that shows minutes:seconds)                                                               |
      | deviceId       | string       | Name of the device ID referenced by this question, if any.                                                                                                                                                                              |
      | icon           | string       | Icon to show next to the question, if any.                                                                                                                                                                                              |
      | iconFont       | string       | Icon font.                                                                                                                                                                                                                              |
      | media          | string       | Reference to some kind of S3 media to play/associate with the question.                                                                                                                                                                 |
      | defaultAnswer  | string       | Pre-populated default values for question responses, or force-change the user's response.                                                                                                                                               |
      | answerFormat   | string       | Regular expression to validate answer format in UI.                                                                                                                                                                                     |
      | slider         | structure    | See below                                                                                                                                                                                                                               |
      | sectionTitle   | string       | The title of a group of questions                                                                                                                                                                                                       |
      | sectionId      | integer      | The ID of a group of questions, and the order in which to display this group                                                                                                                                                            |
      | questionWeight | integer      | The position of a single question within a group. The higher the weight, the lower down on the list the question appears relative to other questions                                                                                    |
      | status         | integer      | Question status                                                                                                                                                                                                                         |
      | answerStatus   | integer      | The same as status (used for backward compatibility)                                                                                                                                                                                    |
      | answer         | string       | User's answer (see below)                                                                                                                                                                                                               |
      | answerDate     | string       | When the user has answered this question.                                                                                                                                                                                               |
      | answerModified | boolean      | Indicate if the original answer has been modified by other user.                                                                                                                                                                        |
      | collectionName | string       | The name of collection the question belongs to (can be null).                                                                                                                                                                           |

      ### Question statuses
  
      | Status | Description                                      |
      |:------:|--------------------------------------------------|
      |   0    | Replaced by a new question (of the same key)     |
      |   2    | Available, waiting for an answer                 |
      |   3    | Skipped, the user is going to answer it later    |
      |   4    | Answered                                         |
      |   5    | No answer, the user is not going to answer on it |

      ### Response Types

      <table>
      <tr><th>ID</th><th>Name</th><th>Description</th></tr>
      <tr><td>1</td><td>Boolean<br/>0 = False<br/>1 = True</td>
      <td><b>0</b> = On/Off Switch - default.<br/>
      <b>1</b> = Yes/No.<br/>
      <b>2</b> = Single 'Yes' button only, the question's default value is applied to the button's text. Used to trigger bot actions from the UI.<br/>
      <b>3</b> = Thumbs-up / Thumbs-down<br/><br/>
      The answer is a 0 or 1.</td></tr>
      <tr><td>2</td><td>Multiple choice - Single select</td>
      <td><b>0</b> = Radio buttons - default.<br/>
      A list of radio buttons. Requires the "responses" array to list the possible responses.
      Users can only select one response. Available for anonymous aggregated public reporting.<br/><br/>
      <b>1</b> = Drop-down list / Picker.<br/>
      A drop down list. Same as radio buttons, but can contain more items.<br/><br/>
      <b>2</b> = Slider.<br/>
      Slider UI view with predefined stops as an options.<br/><br/>
      <b>3</b> = Modal Bottom Action Sheet.<br/>
      Multiple-choice buttons that slide up from the bottom of the screen.<br/><br/>
      The answer is the ID of the response option.</td></tr>
      <tr><td>4</td><td>Multiple choice - Multiple select</td>
      <td>A list of checkbox options. Requires the "responses" array to list the possible responses.
      Users can select multiple responses. Available for anonymous aggregated public reporting.<br/><br/>
      The answer is a bitmask of selected choices.</td></tr>
      <tr><td>6</td><td>Day of the week</td><td>Day of the week input.
      The UI can optimize itself for selecting days of the week [Sun][XXX][Tue][Wed][Thu][XXX][Sat].<br/><br/>
      <b>0</b> = Select multiple days simultaneously.<br/>
      <b>1</b> = Pick a single day only.<br/><br/>
      The answer is a bitmasked value, days can be logically-OR'd together to specify multiple days of the week, ranging from SUN=0x1 to SAT=0x40.</td></tr>
      <tr><td>7</td><td>Slider</td>
      <td><b>0</b> = Integer select - default.<br/>
      Slider, with a defined minimum and maximum.<br>
      By default, minimum = 0 and maximum = 100.<br/>
      <b>1</b> = Floating point select.<br/>
      <b>2</b> = Minutes:Seconds.<br/><br/>
      Answer is the number selected. For time, the answer is in integer seconds.</td></tr>
      <tr><td>8</td><td>Time in seconds since midnight</td>
      <td><b>0</b> = hours:minutes:seconds (am|pm) - default.<br/>
      This accesses the native UI method of declaring a time.<br/>
      <b>1</b> = hours:minutes (am|pm).<br/><br/>
      The answer is in integer seconds since midnight.</td></tr>
      <tr><td>9</td><td>Date and Time in ISO 8601</td>
      <td><b>0</b> = Date and time.<br/>
      <b>1</b> = Date only.<br/><br/>
      The answer is in ISO 8601 format, `YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]`</td></tr>
      <tr><td>10</td><td>Text box</td>
      <td>Open-ended question.<br/>
      For example, if you were to ask, "Who just walked by the camera?"<br/><br/>
      The answer is a string of text.</td></tr>
      </table>

      ### Response Options

      | Name | Type    | Description                                                                |
      |------|---------|----------------------------------------------------------------------------|
      | id   | integer | ID number for types of questions that feature a list of options            |
      | text | string  | String for an option on a type of question that features a list of options |

      ### Slider Structure

      | Name      | Description                                  |
      |-----------|----------------------------------------------|
      | min       | Slider question minimum value                |
      | max       | Slider question maximum value                |
      | inc       | Slider question incremental slider value     |
      | minDesc   | Description of slider question minimum value |
      | maxDesc   | Description of slider question maximum value |
      | unitsDesc | Description of slider question UOM           |

      ### User's Answer Values

      * Boolean: 0 = No, 1 = Yes
      * Multi-choice Single-select: ID of the radio button
      * Multi-choice Multi-select: Bitmask representing response options
      * Slider value
      * Text entered by the user

      Days of the week are represented by a bitmask:

      | Value | Name | Bit |
      | :---: | ---- | --- |
      | 1 | Sunday | 0 |
      | 2 | Monday | 1 |
      | 4 | Tuesday | 2 |
      | 8 | Wednesday | 3 |
      | 16 | Thursday | 4 |
      | 32 | Friday | 5 |
      | 64 | Saturday | 6 |

