  /analytic/devices/{deviceId}/parameters:
    get:
      summary: Get Current or Historical Parameters
      operationId: Get Current or Historical Parameters
      description: |-
        Historical measurements should never be accessed directly by a user's bot.
        For large data values and machine learning bot should submit an [asynchronous data request](#tag/Bot-Server-APIs/operation/Submit%20Data%20Request).

        But we do make the historical measurement API available for the Python BotEngine Framework to fast-forward through months of data when a bot is initialized.
        
        By leaving the `startDate`, `endDate`, or `rowCount` empty, this API call will return only the current measurements.

        When executing on the cloud, measurements that have been captured since the last time the bot ran from each permissible device should be passed into the bot via the command line.

        The bot is expected to cache the latest parameters values for each device,
        and the developer will access these values through normal method calls to get the current measurements.
      tags:
        - Bot Device APIs
      security:
        - botApiKey: []
      parameters:
        - name: deviceId
          in: path
          description: Device ID to extract parameters from
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: >-
            Start time in milliseconds to begin receiving measurements.
            If not set, only latest measurements will be returned.
          schema:
            type: string
        - name: endDate
          in: query
          description: End time in milliseconds to stop receiving measurements, default is the current time
          schema:
            type: string
        - name: paramName
          in: query
          description: One or more  parameter names
          schema:
            type: string
        - name: index
          in: query
          description: Only obtain measurements for parameters with this index number
          schema:
            type: string
        - name: lastRows
          in: query
          description: Receive only last N measurements
          schema:
            type: integer
      responses:
        '200':
          description: Device Parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  measures:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        index:
                          type: string
                        value:
                          type: string
                        time:
                          type: integer
                      required:
                        - name
                        - index
                        - value
                        - time
              example:
