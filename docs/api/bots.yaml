                      en: Why we need to access this device
                access:
                  - category: 1
                    reason:
                      en: Why we need to access location data
                  - category: 2
                    reason:
                      en: Why we need to access device files
                dataStreams:
                  - address: organization.ppc
                  - address: temperatureChange
                  - address: user.mode
                communications:
                  - category: 0
                    email: true
                    push: true
                    sms: false
                    msg: false
                  - category: 1
                    email: false
                    push: false
                    sms: false
                    msg: false
                  - category: 2
                    email: true
                    push: true
                    sms: false
                    msg: false
                  - category: 3
                    email: false
                    push: false
                    sms: false
                    msg: false
                  - category: 4
                    email: false
                    push: false
                    sms: false
                    msg: false
            schema:
              type: object
              properties:
                version:
                  type: object
                  properties:
                    version:
                      type: string
                    whatsnew:
                      type: object
                      additionalProperties:
                        type: string
                      description: Multilingual string map
                    trigger:
                      type: integer
                    schedules:
                      type: object
                      additionalProperties:
                        type: string
                      description: CRON scedules ID/expression string map
                    maxPurchaseOccurrence:
                      type: integer
                    goalRule:
                      type: boolean
                    triggerParameters:
                      type: array
                      items:
                        type: string
                    deviceTypes:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          reason:
                            type: object
                            additionalProperties:
                              type: string
                            description: Multilingual string map
                        required:
                          - id
                          - reason
                    access:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: integer
                          reason:
                            type: object
                            additionalProperties:
                              type: string
                            description: Multilingual string map
                        required:
                          - category
                          - reason
                    dataStreams:
                      type: array
                      items:
                        type: object
                        properties:
                          address:
                            type: string
                        required:
                          - address
                    communications:
                      type: array
                      items:
                        type: object
                        properties:
                          category:
                            type: integer
                          email:
                            type: boolean
                          push:
                            type: boolean
                          sms:
                            type: boolean
                          msg:
                            type: boolean
                        required:
                          - category
                          - email
                          - push
                          - sms
                          - msg
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  appVersionId:
                    type: integer
              example:
                resultCode: 0
                appVersionId: 123

    delete:
      summary: Delete Bot Versions
