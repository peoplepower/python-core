tags:
  - name: Developer Teams
    description: |-
      Development teams are a way of collaboratively developing bots. A team's name is unique and can be used as a key.
  
      Types of the development team members: 
  
      | Type | Description |
      | ---- | ----------- |
      | Developer | + Can add new team members.<br/>+ Can update bot configuration.<br/>+ Can see and purchase the latest bot version. |
      | Tester | - Cannot add new team members.<br/>- Cannot update bot configuration.<br/>+ Can see and purchase the latest bot version. |

  - name: Bot Development
    description: |-
      The process for creating and managing a new bot is:

      1. Create the bot - each bot is in its own directory with a unique bundle ID in reverse-domain notation (i.e. com.ppc.MyBot)
      2. Add a new bot version. Define when the bot should execute, what devices it requires, what permissions it needs, what's new in this version, etc. This is done in the version.json file.
      3. Upload an icon.
      4. Generate and upload the bot code - it's immediately Privately Available in your developer account.
      5. Submit for review. The bot is reviewed and made publicly available if accepted.
      6. Get statistics and crash logs on how your bot is running.

      ### Bot Categories
  
      | Bot Category | Description |
      |:------------:|:------------|
      |      E       | Energy      |
      |      S       | Security    |
      |      C       | Care        |
      |      L       | Lifestyle   |
      |      H       | Health      |
      |      W       | Wellness    |
    
      ### Bot Type
      
      The type of the bot.
      Depending on the type, the bot is available for purchase either for locations or organizations.
      
      | Type | Description |
      |:----:|:------------|
      |  0   | Can be assigned to locations in organizations |
      |  1   | Can only be purchased by organization administrators for their organizations |
    
      ### Execution Place
      
      The place where the bot will be running.
      
      | Value | Meaning       |
      |:-----:|:--------------|
      |   0   | Cloud only    |
      |   1   | Edge only     |
      |   2   | Cloud or edge |
    
      ### Core Class
      
      | Value | Meaning                                     |
      |:-----:|:--------------------------------------------|
      |   0   | No requirements (default)                   |
      |   1   | Provides Core functionality (core positive) |
      |  -1   | Requires Core functionality (core negative) |
    
      ### Marketing Information
      
      | Field        | Description                                                                     |
      |:-------------|:--------------------------------------------------------------------------------|
      | name         | Short bot name                                                                  |
      | author       | Your or your company name                                                       |
      | copyright    | Copyright info                                                                  |
      | description  | Long bot description. Lines can be separated manually. 4,000 characters maximum |
      | marketingUrl | Marketing URL                                                                   |
      | supportUrl   | Support URL                                                                     |
      | videoUrl     | Video URL                                                                       |
      | privacyUrl   | Privacy URL                                                                     |
      | keywords     | 100 characters total comma separated keywords                                   |
    
      ### Developers Deleting Their Bots
      
      To delete a bot you've developed, contact support@caredaily.ai.
      We need to determine what to do about any existing instances of the bot.

      ### Bot Execution Triggers

      A bot trigger is a bit mask, where each bit is related to specific functionality:

      |  Hex  |  Dec | Bit | Description            | Details |
      |:-----:|-----:|:---:|:-----------------------|:------- |
      | 0x000 |    0 |     | Reset                  | Execute the bot when a new instance created or it was inactive and then activated. |
      | 0x001 |    1 |  0  | Schedule               | Execute the bot based on a 'schedule'. |
      | 0x002 |    2 |  1  | Location event         | Execute the bot when the Location changes state, such as 'HOME', 'AWAY', etc.<br>The bot has to subscribe on this trigger value. |
      | 0x004 |    4 |  2  | Device Alert           | Execute the bot when the specified device sends an alert.<br>The bot has to subscribe on this trigger value. |
      | 0x008 |    8 |  3  | Device Measurements    | Execute the bot when the specified device receives a new measurement. You can optionally include a paramNameTrigger, and separately you can optionally include comma-separated parameter values to trigger on.<br>The bot has to subscribe on this trigger value. |
      | 0x010 |   16 |  4  | Question answer        | Execute the bot when a user answers a question. |
      | 0x020 |   32 |  5  | Device Files           | Execute the bot when a new file is uploaded by the device.<br>The bot has to subscribe on this trigger value. |
      | 0x040 |   64 |  6  | Countdown Timer        | The countdown timer can be requested by the bot to be executed in N seconds or at specified time. The bot must not specify it in own definition, but it will receive this trigger value in input data to indicate how it was triggered. |
      | 0x080 |  128 |  7  | Device Configuration   | Execute the bot when a device added, removed or configured.<br>The bot has to subscribe on this trigger value. |
      | 0x100 |  256 |  8  | Data Stream            | Bots, rules and other applications can send data to data stream.<br>The bot has to subscribe on specific data stream channel. |
      | 0x200 |  512 |  9  | Survey Answers         | An organization survey has been answered. |
      | 0x400 | 1024 | 10  | Location Configuration | Execute the bot when a user or a space added or removed on a location.<br>The bot has to subscribe on this trigger value. |
      | 0x800 | 2048 | 11  | Data request           | Execute the bot when a data request completed. |
      | 0x1000| 4096 | 12  | Messages               | New messages created on a location or needs to be rescheduled. |

      ### Access Resources

      | Access Category | Description                         |
      |:---------------:|:------------------------------------|
      |        1        | Locations                           |
      |        2        | Device files                        |
      |        3        | Professional monitoring call center |
      |        4        | Devices (in device types)           |
      |        5        | Challenges                          |
      |        6        | Rules                               |

      ### Communications

      | Communications Category | Description        |
      |:-----------------------:|:-------------------|
      |            0            | Location Users     |
      |            1            | Specific Address   |
      |            2            | Organization Users |

      ### Max Purchase Occurrence

      The developer can set how many instances of the bot can be purchased for a location or an organization.
      According to the specifics of the bot, the limit can be set to 0, 1, or any other positive number. Default is 1.

