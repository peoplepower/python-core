  /cloud/developer/executionHistory:
    get:
      summary: Get Execution History
      operationId: Get Execution History
      description: |-
        For each execution event, the statistics includes the request date, execution time in millis, and the result code (see the table below).
        
        | Result code | Meaning                  | Possible causes                                                                                                               |
        |:-----------:|--------------------------|-------------------------------------------------------------------------------------------------------------------------------|
        |      0      | Successful execution     |                                                                                                                               |
        |      1      | Bot error                | Program bug or run-time error                                                                                                 |
        |      2      | Execution timeout        | Program was terminated by a timeout                                                                                           |
        |     -1      | Internal server error    | Network issues, the runtime service is unavailable or denies the access.                                                      |
        |     -2      | Request processing error | Misconfigured input, or parsing error for the returned data from the bot.                                                     |
        |     -3      | Request timeout          | Read response timeout. In the development environment, the limit is 300 seconds, in a production environment, it can be less. |
        
        The API returns the execution history of a bot within specified date range.

        The result is always ordered by execution's request date.
        The order can be chronological or in anti-chronological (newest first).

        The execution history, even filtered by parameters and limited by dates, can be very large.
        The actual number of execution history events that match the request parameters is displayed in the 'executionsCount' field of the response.
        The number of execution history events returned never exceeds 500 (the 'executionDisplayed' field of the response).
        The maximum number of displayed events can be set using the 'rowCount' parameter. By default, rowCount=200.
      tags:
        - Execution Statistics and Logs
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Return data for the specific bot instance
          schema:
            type: string
        - name: bundle
          in: query
          description: >-
            Bot bundle ID.
            Returns data for the public or latest version of bot depending on the 'developer' parameter value.
            The parameter is required if the bot instance ID is not specified.
          schema:
            type: string
        - name: developer
          in: query
          description: >-
            'True' means the developer version, 'false' (default) means public version.
            The parameter is ignored if the bot instance ID is specified.
          schema:
            type: boolean
        - name: flow
          in: query
          description: Filter by the execution flow.
          schema:
            type: string
        - name: trigger
          in: query
          description: Filter by trigger.
          schema:
            type: string
        - name: errorsOnly
          in: query
          description: If true then only failed executions are returned.
          schema:
            type: boolean
        - name: startDate
          in: query
          description: Execution history start date.
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: Execution history end date.
          required: true
          schema:
            type: string
        - name: rowCount
          in: query
          description: The maximun number of the records to display, default is 200.
          schema:
            type: string
        - name: sortOrder
          in: query
          description: asc (oldest executions first) or desc (newest executions first).
          schema:
            type: string
      responses:
        '200':
          description: Execution History
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  version:
                    type: string
                  appVersionId:
                    type: integer
                  executionsCount:
                    type: integer
                  executionsDisplayed:
                    type: integer
                  executions:
                    type: array
                    items:
                      type: object
                      properties:
                        requestDate:
                          type: string
                        requestDateMs:
                          type: integer
                        resultCode:
                          type: integer
                        appInstanceId:
                          type: integer
                        flow:
                          type: integer
                        triggers:
                          type: integer
                        functionName:
                          type: string
                        functionStartDate:
                          type: string
                        locationId:
                          type: integer
                        server:
                          type: string
                        eventsCount:
                          type: integer
                        eventDate:
                          type: string
                        eventDateMs:
                          type: integer
                        executionTimeMs:
                          type: integer
                        logData:
                          type: string
              example:
                resultCode: 0
                version: 1.0.6
                appVersionId: 586
                executionsCount: 152
                executionsDisplayed: 1
                executions:
                  - requestDate: '2023-06-16T00:46:29.058Z'
                    requestDateMs: 1686876389058
                    resultCode: 1
                    appInstanceId: 1167
                    flow: 0
                    triggers: 1
                    functionName: bot__com-ppc-Lighting__277_586
                    functionStartDate: '2017-11-17T21:05:03Z'
                    locationId: 235495
                    server: B2
                    eventsCount: 0
                    eventDate: '2023-06-16T00:46:29.052Z'
                    eventDateMs: 1686876389052
                    executionTimeMs: 20
                    logData: |-
                      Logs: []

                      Tracebacks: [Traceback (most recent call last):
                      ,   File "./lambda.py", line 30, in lambda


