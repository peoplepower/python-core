  /cloud/appstore/stream:
    post:
      summary: Send Message to Bots
      operationId: Send Message to Bots
      description: |-
        Applications can send a message to bots.

        The message can be sent to bots subscribed on the specific data stream address.

        End users can send messages to bots on their locations or to organizational bots.

        Organization administrators can send messages to organizational bots in the same organization and to bots on locations in this organization.

        Specific location IDs and the bot instance IDs (appInstanceId) can be specified in the request body.
      tags:
        - End-User Bot Shop APIs
      security:
        - userApiKey: []
        - adminApiKey: []
      parameters:
        - name: scope
          in: query
          description: |-
            Bitmask to feed location and/or organization bots:<br>
            1 - location<br>
            2 - organization
          required: true
          schema:
            type: integer
        - name: address
          in: query
          description: Data stream address
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Trigger bots of this location. Mandatory for end users.
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Trigger bots of locations of the specific organization or organizational bots. Used by an administrator.
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              locations:
                - 34122
                - 15689
              bots:
                - 567
                - 893
              feed:
                key0: value0
                key1: value1
            schema:
              type: object
              properties:
                locations:
                  type: array
                  description: Location IDs in the requested organization, where to send this message
                  items:
                    type: integer
                bots:
                  type: array
                  description: Specific bot instance IDs, where to send this message directly
                  items:
                    type: integer
                feed:
                  type: object
                  description: Data feed, flexible object structure
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


