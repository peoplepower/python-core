              example:
                resultCode: 0
                secretValue: Secret


  /analytic/variables/{name}:
    get:
      summary: Get a Variable
      operationId: Get a Variable
      description: |-
        One of the basic functions any bot has to do is persist data across multiple executions of the bot.
        Each iteration of the bot is actually a new execution, so variables should be loaded at the beginning of execution and saved at the end.
  
        Variables are to an instance of a bot, as user properties are to an instance of a user, as device properties are to an instance of a device.
        Even if the user or organization has multiple instances of this bot, this bot's variables will be stored separately from the other bot's variables.
  
        Variables could have binary values up to 16M.
        
        The API returns a value of specified variable.

        If the variable doesn't exist the API returns the status 204 (No Content).
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      parameters:
        - name: name
          in: path
          description: Name of the variable to return
          required: true
          schema:
            type: string
        - name: shared
          in: query
          description: Shared variable
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              example: |
                Binary content
        '204':
          description: The variable doesn't exist
        '400':
          description: Bad Request
        '500':
          description: Internal Server Error

    post:
      summary: Save a Variable
      operationId: Save a Variable
      description: |-
        The API saves the value of specified variable.

        If the variable doesn't yet exist it will be created.
        The previous value of the variable, if any, will be replaced by the new value.

        If the value to save is empty then this variable will be removed (acts like Delete Variable API),
        so the next calls to the Get Variable Value API will return status 204 (No Content).
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      parameters:
        - name: name
          in: path
          description: Name of the variable to save
          required: true
          schema:
            type: string
        - name: shared
          in: query
          description: Shared variable
          schema:
            type: boolean
        - name: Content-MD5
          in: header
          description: MD5 digest of the variable value in hex format, optional
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    delete:
      summary: Delete a Variable
      operationId: Delete a Variable
      description: >-
        The API deletes the specified variable, if any.
        The next calls to the Get Variable Value API for this variable will return status 204 (No Content).
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      parameters:
        - name: name
          in: path
          description: Name of the variable to delete.
          required: true
          schema:
            type: string
        - name: shared
          in: query
          description: Shared variable
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /analytic/variables:
    post:
      summary: Save Variables
      operationId: Save Variables
      description: |-
