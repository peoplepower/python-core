  /analytic/openai:
    post:
      summary: Send a request to Open AI
      operationId: Send a request to openai
      description: |-
        Send asynchronous request to Open AI API to obtain a model response for the given chat conversation.
        
        The response from CharGPT is delivered to the bot in a data stream message to the 'openai' address.
        The data stream message looks like:

        >
            {
                "address" : "openai",
                "scope" : 1,
                "feed" : {
                    "id" : "chatcmpl-86GKbsl3bP5YmmxutIY8aS5c5o5gK",
                    "object" : "chat.completion",
                    "created" : 1696503437,
                    "model" : "gpt-3.5-turbo-0613",
                    "choices" : [
                      {
                        "index" : 0,
                        "message" : {
