  /analytic/voiceCall:
    post:
      summary: Outbound Voice Call
      operationId: Outbound Voice Call
      description: |-
        This API initiates outbound voice call.
        
        ### Answers

        Each digit pressed by the callee for each step is recorded in the format `stepId:digit`.
        The entire sequence of digits is sent to the calling bot as two comma-separated strings: `answerKey1:digit1,answerKey2:digit2,...` for steps with answer keys and `stepId1:digit1,stepId2:digit2,...` for the whole call.

        The bot will be triggeed with a data stream event with the address `VOICE`.
        The bot's feed will be like this:

        ```
            {
                "address": "VOICE",
                "feed": {
                    "callUuid": "CON-ca298d06-db01-49b4-b995-5f17d5fbff84",
                    "status": 2,
                    "direction": 0, // 0 = outbound, 1 = inbound
                    "userId": 82129,
                    "startTime": 1680904100000,
                    "endTime": 1680904126000,
                    "answers": "de4f281d-0221-4b58-a7fc-797532790e6e:1,RESOLUTION_OPTIONS:1",
                    "log": "0:3,1:1,2:3,3:1"
                }
            }
        ```

        ### Call Statuses

        | Status | Description |
        |:------:|-------------|
        |   0    | Created     |
        |   1    | Started     |
        |   2    | Completed   |
        |   3    | Failed      |

        ### BargeIn

        If the callee hears some phrase (question or answer options) not for the first time,
        they should be allowed to press the button until the end of the audio message.
        Vonage uses the "bargeIn" parameter for this purpose.

        In the presented format, we hide this parameter and use the delimiter '//' instead.
        For example, in the text `"Are you okay? // Press 1 if yes, or press 2 if no"`,
        the part before '//' will be processed with bargeIn=false and the rest of the phrase will be processed with bargeIn=true.

        Please note that the final text of the conversation (not awaiting the user's response)
        must always be handled with bargeIn=false or Vonage won't sound it at all.
      tags:
        - Bot Notification APIs
      security:
        - botApiKey: []
      parameters:
        - name: userId
          in: query
          description: User ID, multiple values supported
          required: true
          schema:
            type: integer
        - name: callTime
          in: query
          description: Scheduled call start time in milliseconds
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              model:
                settings:
                  language: en-US
                  voice: 5
                  timeout: 12
                phrases:
                  Q1: How do you feel today?
                  Q2: How did you feel yesterday?
                  OPTS: Press 1 if well, press 2 if not so good.
                  OOPS: You pressed a wrong key.
                  BYE: >-
                    It appears you may have left the conversation.
                    But no worries, we will call back another time to complete the survey or you can call back anytime to do so.
                startStepId: 0
                steps:
                  - id: 0
                    answerKey: 25a278a3-c6a6-457e-a91e-1f0c8cd29c9a
                    text: >-
                      Hello! I would like to ask you a few questions about how you feel.
                      Press 1 if you are ready to answer, otherwise press any other key
                    timeoutAlerts:
                      - >-
                        Looks like you're busy right now. Let me call you back
                        later!
                    mishitAlerts: []
                    actions:
                      - digits: '1'
                        nextStepId: 1
                  - id: 1
                    answerKey: RESOLUTION_OPTION
                    text: 'First question: {Q1} // {OPTS}'
                    timeoutAlerts:
                      - >-
                        It is taking you longer than usual to answer the
                        question, let me repeat it for you. {Q1} // {OPTS}
                      - '{BYE}'
                    mishitAlerts:
                      - '{OOPS} Let me repeat the options: {OPTS}'
                      - '{OOPS} Let me repeat the question: {Q1} // {OPTS}'
                      - >-
                        {OOPS} Looks like you're having trouble answering my questions. That's all right. Let me call you back later!
                    actions:
                      - digits: '12'
                        nextStepId: 2
                  - id: 2
                    text: 'Last question: {Q2} // {OPTS}'
                    timeoutAlerts:
                      - >-
                        It is taking you longer than usual to answer the question, let me repeat it for you. {Q2} // {OPTS}
                      - '{BYE}'
                    mishitAlerts:
                      - '{OOPS} Let me repeat the options: {OPTS}'
                      - '{OOPS} Let me repeat the question: {Q2} // {OPTS}'
                      - >-
                        {OOPS} Looks like you're having trouble answering my questions.
                        That's all right. Let me call you back later!
                    actions:
                      - digits: '12'
                        nextStepId: 3
                  - id: 3
                    text: I appreciate your time in answering these questions!
            schema:
              type: object
              properties:
                model:
                  type: object
                  properties:
                    settings:
                      type: object
                      description: The voice parameters and the timeout value.
                      properties:
                        language:
                          type: string
                          description: |-
                            Text-to-speech language.
                            Default is `en-US`.<br>
                            Possible values are listed in the [Text-To-Speech guide](https://developer.vonage.com/en/voice/voice-api/concepts/text-to-speech#supported-languages).
                        voice:
                          type: integer
                          description: |-
                            Voice style.
                            Default is 0.<br>
                            Possible values are listed in the [Text-To-Speech guide](https://developer.vonage.com/en/voice/voice-api/concepts/text-to-speech#supported-languages">).
                        timeout:
                          type: integer
                          description: The amount of time in seconds of inactivity on the called party before the called party hears an alert (`timeoutAlerts`) or the call is terminated.
                    phrases:
                      type: object
                      additionalProperties:
                        type: string
                      description: |-
                        A dictionary for common phrases. Optional.<br>
                        Each phrase is a key-value pair.<br>
                        The phrase value can be included in any text element of the steps through a `token` - the phrase key enclosed in curly braces.
                    startStepId:
                      type: integer
                      description: The ID of the first step to process.
                    steps:
                      type: array
                      description: Each step includes the text to be spoken and options for handling user input.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: The unique ID of the step
                          answerKey:
                            type: string
                            description: >-
                              Optional string to report the call answers in the format `answerKey1:digit1,answerKey2:digit2,...` to the bot.
                          text:
                            type: string
                            description: The text that will be spoken when the survey moves to this step.
                          timeoutAlerts:
                            type: array
                            description: >-
                              Phrases that the callee will hear at the end of the next idle time interval (specified by the `timeout` parameter in the settings) in this step.
                              The call ends immediately after the last phrase is spoken.
                              If the array is empty, the call will be automatically terminated after the first timeout.
                            items:
                              type: string
                          mishitAlerts:
                            type: array
                            description: >-
                              The phrases that the callee will hear after the next press of a button that is not associated with any of the actions of the step.
                              The call ends after the last phrase is spoken.
                              If the array is empty, the call will be automatically terminated after the first press of a button that is not associated with any of the step's actions.
                            items:
                              type: string
                          actions:
                            type: array
                            description: Phone keys that the called party should press in response and how they will be handled.
                            items:
                              type: object
                              properties:
                                digits:
                                  type: string
                                  description: >-
                                    A string containing the numbers 0 through 9, or the characters * or #, without delimiters.<br>The action will be selected if the callee presses any of these digits on the phone keypad.
                                nextStepId:
                                  type: integer
                                  description: The ID of the next step
                              required:
                                - digits
                                - nextStepId
                        required:
                          - id
                          - answerKey
                          - text
                          - timeoutAlerts
                          - mishitAlerts
                          - actions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /analytic/voiceCallAnswer:
    post:
      responses:
      summary: Set Inbound Voice Call Model
      operationId: Set Inbound Voice Call Model
      description: |-
        When a user makes an inbound voice call, the cloud generates an answer scenarion based on an existing Outbound Voice Call Model without triggering bots.
        This voice call model can be configured for each user at the bot's location. Otherwise, the cloud will use a system default model.

        See the model format description in the Outbound Voice Calls section.
      tags:
        - Bot Notification APIs
      security:
        - botApiKey: []
      parameters:
        - name: userId
          in: query
          description: User ID, support for multiple values.
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              model:
                settings:
                  language: en-US
                  voice: 5
                  timeout: 9
                startStepId: 0
                steps:
                  - id: 0
                    answerKey: 25a278a3-c6a6-457e-a91e-1f0c8cd29c9a
                    text: >-
                      Hello! Thank you for calling us! Press any digit if you need caregiver's help, press * if you want to leave feedback.
                    timeoutAlerts:
                      - >-
                        Looks like you need help. We will send you a nurse as
                        soon as possible!
                    mishitAlerts: []
                    actions:
                      - digits: '1234567890'
                        nextStepId: 1
                      - digits: '*'
                        nextStepId: 2
                  - id: 1
                    text: We will send you a nurse as soon as possible!
                  - id: 2
                    text: >-
                      Press 1 if you are satisfied with our care, press 2 if you have any suggestions on how to improve our work
                    timeoutAlerts: []
                    mishitAlerts: []
                    actions:
                      - digits: '12'
                        nextStepId: 3
                  - id: 3
                    text: Thank you for your feedback!
            schema:
              type: object
              properties:
                model:
                  type: object
                  properties:
                    settings:
                      type: object
                      properties:
                        language:
                          type: string
                        voice:
                          type: integer
                        timeout:
                          type: integer
                    startStepId:
                      type: integer
                    steps:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          answerKey:
                            type: string
                          text:
                            type: string
                          timeoutAlerts:
                            type: array
                            items:
                              type: string
                          mishitAlerts:
                            type: array
                            items: {}
                          actions:
                            type: array
                            items:
                              type: object
                              properties:
                                digits:
                                  type: string
                                nextStepId:
                                  type: integer
                              required:
                                - digits
                                - nextStepId
                        required:
