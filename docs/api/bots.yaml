  /cloud/developer/versionStatus:
    put:
      summary: Update Version Status
      operationId: Update Version Status
      description: |-
        ### Version Statuses
  
        | Status | Description           | Updatable | Triggered |
        |:------:|:----------------------|:---------:|:---------:|
        |   0    | Waiting for upload    |     +     |     -     |
        |   1    | Privately Available   |     +     |     +     |
        |   2    | Submitted for Review  |     -     |     +     |
        |   3    | Under Review          |     -     |     +     |
        |   4    | Publicly Available    |     -     |     +     |
        |   5    | Store/System Rejected |     +     |     -     |
        |   6    | Developer Rejected    |     +     |     -     |
        |   7    | Restorable            |     -     |     -     |
        |   8    | Archived              |     -     |     -     |
      
        ### Version Status Transition Diagram
        
        |  \  |  0  |  1  |  2  |  3  |  4  |  5  |  6  |  7  |  8  |
        |:--- |:--- |:--- |:--- |:--- |:--- |:--- |:--- |:--- |:--- |
        |**0**|     |`Dc` |     |     |     |     |     |     |     |
        |**1**|     |     | `D` |     |     | `S` | `D` |     |     |
        |**2**|     |     |     | `A` |     | `S` | `D` |     |     |
        |**3**|     |     |     |     | `A` |`AS` |     |     |     |
        |**4**|     |     |     |     |     |     |     |`AS` |     |
        |**5**|`Db` |     |     |     |     |     |     |     |     |
        |**6**|`Db` |     |     |     |     |     |     |     |     |
        |**7**|     |     |     |     |`AD` |     |     |     | `S` |
        |**8**|     |     |     |     |     |     |     |     |     |
        
        `D` - by Developer, `c` - by bot's code upload, `b` - by changing bot's configuration.
        
        `A` - by Bot Store Admin
        
        `S` - by the System (i.e, automatically, as a part of user actions):
     
        The latest version status can be changed only to "Submit for Review" or "Developer Rejected",
        depending on the current state of the latest version on the server.

        Only an administrator can set the bot version to status "Under Review", "Publicly Available", or "Bot Shop Rejected".
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot, i.e. ai.caredaily.MyBot
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: New version status
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/developer/upload:
    post:
      summary: Upload Bot Code
      operationId: Upload Bot Code
      description: |-
        This section describes the API for loading bot code to AWS Lambda and configuring runtime parameters.

        ### Runtime Index

        The runtime index specifies the execution evironment for the bot code.
        Next versions of Python will be added in the future.

        | Runtime | Execution environment |
        |:-------:|:----------------------|
        |    4    | Python 3.10           |
        |    5    | Python 3.11           |
        |    6    | Python 3.12           |
        |    7    | Python 3.13           |
        |    8    | Python 3.14           |

        ### Status

        Bot code can be uploaded only if the latest bot version has one of the following statuses:

        - 0 - Waiting for upload;
        - 1 - Privately Available;
        - 5 - Developer Rejected;
        - 6 - App Store Rejected.

        The deployment archive may be either ZIP or TAR archive. The archive contains .py and .pyc files.
        The .py files will be compiled to the .pyc files automatically.

        The deployment archive may contain the file 'structure.json' with the array field 'pip_install_remotely' inside.
        The Python packages listed in the array will be installed automatically.

        After successful upload, the status of the latest version will be switched to “Privately Available”.

        The upload is always performed asynchronously, and the API returns 'requestId' in the response body.
        The requestId can be used in the 'Get upload result' API.
      tags:
        - Bot Development
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot, i.e. ai.caredaily.MyBot
          required: true
          schema:
            type: string
        - name: runtime
          in: query
          description: >-
            Runtime environment index.
            Default is the latest Python version.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  requestId:
                    type: integer
              example:
                resultCode: 0
                requestId: 124


  /cloud/developer/upload/{requestId}:
    get:
      summary: Get Code Upload Result
