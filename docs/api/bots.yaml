  /cloud/developer/cloudwatchlog:
    put:
      summary: Enable/Disable CloudWatch Logging
      operationId: Enable/Disable CloudWatch Logging
      description: |-
        Enable/disable logging in AWS CloudWatch for a specific bot instance and flow.
  
        * Developer can enable logging for their bot instance at any time and for any period of time.
        * Developer can disable logging for their bot instance at any time.

        While logging is enabled, the bot's input contains two additional parameters: `cloudWatchLogGroup` and `cloudWatchLogStream`
        
        Logging status:

        | Value | Meaning          |
        |:-----:|------------------|
        |   1   | Logging enabled  |
        |   2   | Logging disabled |
      tags:
        - Execution Statistics and Logs
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Bot instance ID
          required: true
          schema:
            type: string
        - name: flow
          in: query
          description: Execution flow
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Logging status (1 to enable logging, 2 to disable logging)
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: Logging end date. Required, if status=1
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get CloudWatch Log Info
      operationId: Get CloudWatch Log Info
      description: ''
      tags:
        - Execution Statistics and Logs
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Bot instance ID
          required: true
          schema:
            type: string
        - name: flow
          in: query
          description: Execution flow
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CloudWatch Log Info
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  cloudWatchLog:
                    type: object
                    properties:
                      groupName:
                        type: string
                        description: |-
                          AWS CloudWatch Log Group name.
                          The log group is common for all instances of the bot.<br>
                          Format: /Bots/_cloudIndex_/_appId_
                      streamName:
                        type: string
                        description: |-
                          AWS CloudWatch Log Stream name. Each bot instance is assigned an individual log stream.<br>
                          Format: Id=_appInstanceId_;flow=_flow_
                      retentionInDays:
                        type: integer
                        description: The log group's retention setting
                      endDate:
                        type: string
                        description: Datetime after which logging automatically stops
                      lastEventDate:
                        type: string
                        description: The datetime of the most recent log event in the log stream
                      status:
                        type: integer
                        description: |-
                          1 - logging is on<br>
                          2 - logging is off
              example:
                resultCode: 0
                cloudWatchLog:
                  groupName: /Bots/SBOX/277/
                  streamName: Id=1167;flow=0
                  retentionInDays: 90
                  endDate: '2023-07-30T00:00:00Z'
                  lastEventDate: '2023-07-23T18:01:05.108Z'
                  status: 1


  /cloud/developer/cloudwatchlog/export:
    post:
      summary: Create an export task
      operationId: Create an export task
      description: |-
        Create the export task to export the log stream from AWS CloudWatch to S3 for a specific bot instance and flow.

        * Only developers can export log streams.
        * The developer must have admin access to the bot instance location.
      tags:
        - Execution Statistics and Logs
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Bot instance ID
          required: true
          schema:
            type: string
        - name: flow
          in: query
          description: Execution flow
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          description: Start date of log events to export
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: End date of log events to export
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  logExport:
                    type: object
                    properties:
                      appInstanceId:
                        type: integer
                      bundle:
                        type: string
                      startDate:
                        type: string
                      endDate:
                        type: string
                      statusCode:
                        type: string
                      taskId:
                        type: string
              example:
                resultCode: 0
                logExport:
                  appInstanceId: 12345
                  bundle: com.ppc.SomeBot
                  startDate: '2023-12-17T12:34:00'
                  endDate: '2023-12-18T12:34:00'
                  statusCode: SUBMITTED
                  taskId: 19efa208-4f61-49ba-8899-6edd8b4b3006

    get:
      summary: Get Export Status
      operationId: Get Export Status
      description: |-
        Inspect the status of an export task and obtain the pre-signed URL(s) to the exported files.

        * A large log stream can be exported to multiple files.
        * The export files are gziped.

        Possible status codes are:

        * CANCELLED
        * COMPLETED
        * FAILED
        * PENDING
        * PENDING_CANCEL
        * RUNNING
      tags:
        - Execution Statistics and Logs
      security:
        - userApiKey: []
      parameters:
        - name: taskId
          in: query
          description: An export task ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  logExport:
                    type: object
                    properties:
                      appInstanceId:
                        type: integer
                      bundle:
                        type: string
                      startDate:
                        type: string
                      endDate:
                        type: string
                      statusCode:
                        type: string
                      taskId:
                        type: string
                      files:
                        type: array
                        items:
                          type: string
              example:
                resultCode: 0
                logExport:
                  appInstanceId: 12345
                  bundle: com.ppc.SomeBot
                  startDate: '2023-12-17T12:34:00'
                  endDate: '2023-12-18T12:34:00'
                  statusCode: COMPLETED
                  taskId: 19efa208-4f61-49ba-8899-6edd8b4b3006
                  files:
                    - >-
                      https://s3.us-east-1.amazonaws.com/sbox.logs/Bots/10585/19efa208-4f61-49ba-8899-6edd8b4b3006/Id%3D10585%3Bflow%3D0/000000.gz?response-content-disposition=inline&X-Amz-Security-Token={security_token}&X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20231218T070632Z&X-Amz-SignedHeaders=host&X-Amz-Expires=43200&X-Amz-Credential={credential}&X-Amz-Signature={signature}


  /cloud/appstore/organizations/{organizationId}:
    post:
      summary: Add Bot to Organization
      operationId: Add Bot to Organization
      description: |-
        A bot must belong to one or more organizations and must be approved for purchasing by an organization administrator.
      
        There is a two steps association with organizations process for all bots:
        
        1. A bot developer proposes to use a bot in specific organization.
        2. An organization admin (with the editor privilege) approves or rejects it.
        
        A bot can be assigned on a location only if the location belongs to an organization, and the organization administrator has approved the bot.
        A bot can be assigned on an organization only if it is approved for this organization.
        
        | Approval Status | Name |
        | :-------------: | ---- |
        | 0 | Proposed |
        | 1 | Approved |
        | 2 | Rejected |
        
        A bot developer proposes to use a bot in specific organization.
      tags:
        - End-User Bot Shop APIs
      security:
        - userApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    put:
      summary: Approve Bot for Organization
      operationId: Approve Bot for Organization
      description: An organization admin (with the editor privilege) approves or rejects it.
      tags:
        - End-User Bot Shop APIs
      security:
        - adminApiKey: []
      parameters:
        - name: bundle
          in: query
          description: Globally unique bundle ID for the bot
          required: true
          schema:
            type: string
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: status
          in: query
          description: |-
            Approval status:<br>
            1 = approve<br>
            2 = reject
          required: true
          schema:
            type: integer
        - name: development
          in: query
          description: Is for testing purposes, default is 'false'
