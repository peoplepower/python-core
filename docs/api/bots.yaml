  /analytic/appkey:
    get:
      summary: Get Bot Key
      operationId: Get Bot Key
      description: |-
        For authentication all bot API's require an API key generated specifically for the running the bot.
        Each bot will receive the key inside the input parameter.
  
        However, it can be useful to call bot APIs manually.
        This API allows to obtain analytic API key using existing user API key for limited time.
      tags:
        - Bot Server APIs
      security:
        - userApiKey: []
        - adminApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: Bot instance ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Bot Key
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  key:
                    type: string
                    description: Bot API key. Use it in the ANALYTIC_API_KEY header in future API calls for this bot.
                  expiry:
                    type: integer
                    description: Expiration time | In seconds since UNIX epoch
              example:
                resultCode: 0
                key: aBc1d2f3fdsfsdf
                expiry: 1234567890


  /analytic/start:
    post:
      summary: Start Execution
      operationId: Start Execution
      description: |-
        Bots must always notify the server about they have started running.
        This is necessary in order to avoid parallel execution of the same bot instance.

        The bot input includes the numeric attribute 'startKey' which is a unique identifier of the launch.
        At the start, bot must call a dedicated 'Start' API with the startKey as a request parameter.

        Bot is allowed to continue only if the call to the 'Start' API returns the success code. Otherwise, bot must exit.

        It is important that bot passes two parameters into the request: 'awsRequestId' and 'logStreamName'. The parameter
        values should be taken from the properties 'aws_request_id' and 'log_stream_name', respectively, of the context object
        that is passed to the bot's function handler. See https://docs.aws.amazon.com/lambda/latest/dg/python-context-object.html

        The parameters allow to get information from the CloudWatch Logs about the bot completion status for the Data Requests or in case of 'Read timed out' error.
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      parameters:
        - name: startKey
          in: query
          description: Unique identifier of the launch
          required: true
          schema:
            type: integer
        - name: awsRequestId
          in: query
          description: The property 'aws_request_id' of the context object
          schema:
            type: string
        - name: logStreamName
          in: query
          description: The property 'log_stream_name' of the context object
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /analytic/execute:
    put:
      summary: Request Execution
      operationId: Request Execution
      description: |-
        Bots can request to execute themselves again in N seconds, without external triggers.
        In the BotEngine, this is transformed into a Timer system that multiplexes this single timer.
        
        This API allows to schedule bot's execution at specific time or in a number of seconds.

        The API can ignore the request, when the new time time is close to the previously scheduled time.

        Also the API can add some random value to the request timer time for even distribution of multiple bot executions.

        When the operation is successful, the API will return the scheduled execution time.
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      parameters:
        - name: in
          in: query
          description: Execute in N seconds
          schema:
            type: integer
        - name: at
          in: query
          description: Execute at a unix timestamp in milliseconds
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  timer:
                    type: integer
                    description: Scheduled execution time
              example:
                resultCode: 0
                timer: 1740348539000

    delete:
      summary: Cancel Execution
      operationId: Cancel Execution
      description: Cancel the scheduled one-time execution.
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


