  /deviceio/analytic:
    get:
      summary: Local Execution on a Computer
      operationId: Local Execution on a Computer
      description: |-
        Bots running on the developer's local computer will listen for incoming events.
        
        This HTTP GET is a 'long polling' request on **port 8443**.
        Typically, the client will open the GET request with a timeout of approximately 1-15 minutes.
        After the timeout, the GET request should be automatically reopen.

        The response is exactly what would be delivered to the bot directly through the command line, if it was running on the cloud,
        which should also be the same format for retrieving both current and historical data.
        Typically, you would expect only the "readings" block or the "alerts" block to appear in the response exclusive of one another.

        The API returns the analytic API key and the cloud API's host (including the port and the protocol).

        The server keeps all responses in a queue for 15 seconds.
        If the bot calls this API within this interval,
        set the `cleanTime` parameter to the timestamp of the previously received response to remove it from the queue and not receive the same response again.

        To call this API the developer have to complete absolutely same steps required for registering a normal app:

        1. Creates a bot and a new version.
        2. Purchase and configure a bot instance on own user account.
        3. Provide the bot instance ID as a parameter to this API.
      tags:
        - Bots Execution
      security:
        - userApiKey: []
      parameters:
        - name: appInstanceId
          in: query
          description: The bot instance ID
          required: true
          schema:
            type: integer
        - name: timeout
          in: query
          description: Long polling timeout in seconds
          schema:
            type: integer
        - name: cleanTime
          in: query
          description: Remove a response with this timestamp from the input queue
          schema:
            type: integer
        - name: clean
          in: query
          description: Set it to true to clean the first response from the input queue
          schema:
            type: boolean
      responses:
        '200':
          description: Bot's input
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  id:
                    type: integer
                    description: Bot instance ID
                  apiKey:
                    type: string
                    description: Bot API key
                  apiKeyExpiry:
                    type: integer
                  apiHost:
                    type: string
                    description: The API servers' endpoint
                  timer:
                    type: integer
                    description: Timer trigger time
                  services:
                    type: array
                    description: The location services data format is the same as for the execution on the cloud.
                    items:
                      type: object
                  inputs:
                    type: array
                    description: The input data format is the same as for the execution on the cloud.
                    items:
                      type: object
                    minItems: 1
                    maxItems: 1
              example:
                resultCode: 0
                id: 123456
                apiKey: ABC123456DEF7890
                apiHost: https://app.peoplepowerco.com
                inputs: []


  /cli:
    post:
      summary: Cloud Execution
      operationId: Cloud Execution
      description: |-
        The cloud is expected to run the bot from the command line.

        The following data should be passed into the BotEngine Python framework as we execute the bot,
        so the bot doesn't have to make further API calls to have all the information it needs to execute.

        Since this is just an example and the real execution takes place on a command line and not an HTTP API,
        just remember that each example parameter actually starts with --.  So, --json, --initialize, etc.

        Bot input elements has data according to the [Bot Execution Trigger](#tag/Bot-Development) values.

        Currently bot inputs for all triggers contain the `access` array and the `organization` object.
        Examples of their data structures can be found in the first element of the input array in the API's description.
        It is planned to not include these blocks to the input data for some triggers in the future.
      tags:
        - Bots Execution
      parameters:
        - name: json
          in: query
          description: >-
            --json = The example JSON that would be passed to the bot over the command line is shown below in the request body
          required: true
          schema:
            type: string
        - name: initialize
          in: query
          description: >-
            --initialize = Include this option if this bot instance should be initialized.
            Bot instances are initialized when they are first connected to a user's account.
