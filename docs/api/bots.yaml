  /analytic/ticket:
    post:
      summary: Submit Ticket
      operationId: Submit Ticket
      description: |-
        Publish a ticket to Zendesk.

        A ticket must have a type, a priority, a subject, and a comment.
        A bot has to include all required details to the subject and the comment fields.

        ### Ticket Types
  
        | Value | Description |
        |:-----:|-------------|
        |   1   | Problem     |
        |   2   | Incident    |
        |   3   | Question    |
        |   4   | Task        |
      
        ### Priority
        
        | Value | Description |
        |:-----:|-------------|
        |   1   | Low         |
        |   2   | Normal      |
        |   3   | High        |
        |   4   | Urgent      |
      tags:
        - Bot Notification APIs
      security:
        - botApiKey: []
      requestBody:
        content:
          application/json:
            example:
              brand: default
              lang: en
              template: comment.vm
              userId: 123
              ticket:
                type: 4
                priority: 2
                subject: New devices installation
                comment: >-
                  User John (id=123) added new devices on location 'John's home' (id=456). Please contact the user.
                data:
                  name0: value0
                  name1: value1
                customFields:
                  - id: Zendesk field ID
                    value:
                      name: value
            schema:
              type: object
              properties:
                brand:
                  type: string
                  description: The brand field is used to locate a corresponding Zendesk project/site and the comment template.
                lang:
                  type: string
                  description: The lang field is used to choose the corresponding comment template.
                template:
                  type: string
                  description: Comment template name
                userId:
                  type: integer
                  description: Ticket requester's user ID
                voipCall:
                  type: boolean
                  description: Add a link to initiate a VoIP call from VoIP capable devices
                ticket:
                  type: object
                  description: Support ticket
                  properties:
                    type:
                      type: integer
                    priority:
                      type: integer
                    subject:
                      type: string
                    comment:
                      type: string
                    data:
                      type: object
                      additionalProperties:
                        type: string
                      properties: Key/value string map
                    customFields:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          value:
                            type: object
                            properties:
                              name:
                                type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /analytic/tags:
    put:
      summary: Apply Tags
      operationId: Apply Tags
      description: |-
        Apply bot tags for locations, users, and devices.
        
        Tags are a way to categorize sets of locations, users, or devices.

        When tagging from a bot, the tag automatically has the bot ID applied by the API to avoid conflicts with other bots and when managing tags from the Maestro Command Center.

        Tags are not accessible from other bots, or by the end user. Tags are only accessible from the bot that created the tag, or the Maestro Command Center.
        All user tags always accessible from the Maestro Command Center, regardless of which bot they came from.

        ### Tag Types

        | ID  | Name     |
        |:---:|:---------|
        |  1  | User     |
        |  2  | Location |
        |  3  | Device   |

        ### Location Tag Categories

        | ID  | Name     |
        |:---:|:---------|
        |  0  | default  |
        |  1  | highlight |
      tags:
        - Bot Tag APIs
      security:
        - botApiKey: []
      requestBody:
        content:
          application/json:
            example:
              tags:
                - type: 1
                  tag: parent
                - type: 2
                  id: '456'
                  tag: apartment
                - type: 3
                  id: smart_plug_id
                  tag: automation
            schema:
              type: object
              properties:
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: integer
                        description: Tag type
                      tag:
                        type: string
                        description: Tab value
                      id:
                        type: string
                        description: Location, device, or user ID
                      category:
                        type: integer
                        description: Location tag category
                      priority:
                        type: integer
                        description: Location tag priority
                    required:
                      - type
                      - tag
                      - id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
              example:
                resultCode: '0'

    delete:
      summary: Delete Tags
      operationId: Delete Tags
      description: Delete bot tags for users, locations, and devices.
      tags:
        - Bot Tag APIs
      security:
        - botApiKey: []
      parameters:
        - name: type
          in: query
          description: Tag type filter
          required: true
          schema:
            type: integer
        - name: id
          in: query
          description: The entity ID to remove the tag from, optional for location tags
          schema:
            type: string
        - name: tag
          in: query
          description: Tag value
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
              example:
                resultCode: '0'

    get:
      summary: Get Tags
      operationId: Get Tags
      description: |-
        Return the list of tags that this bot has given to the user's entities.

        If the entity ID argument is passed in, then we return tags for that entity that were previously set by this bot.

        The API never returns tags that were generated outside this bot, to maintain user privacy.
      tags:
        - Bot Tag APIs
      security:
        - botApiKey: []
      parameters:
        - name: type
          in: query
          description: Tag type filter
          schema:
            type: integer
        - name: id
          in: query
          description: Retrieve tags set by this bot from a specific entity ID
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: string
                  tags:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: integer
                        tag:
                          type: string
                        id:
                          type: string
                        category:
                          type: integer
                          description: Location tag category
                        priority:
                          type: integer
                          description: Location tag priority
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                      required:
                        - type
                        - tag
                        - id
              example:
                resultCode: '0'
                tags:
                  - type: 1
                    tag: parent
                  - type: 2
                    id: '456'
                    tag: apartment
                  - type: 3
                    id: smart_plug_id
                    tag: automation
                  - type: 4
                    id: '123456'
                    tag: dog


