          schema:
            type: integer
        - name: objectName
          in: query
          description: Show objects with such name(s). Multiple values are allowed.
          schema:
            type: string
      responses:
        '200':
          description: Bot Instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  bots:
                    type: array
                    items:
                      type: object
                      properties:
                        appInstanceId:
                          type: integer
                        locationId:
