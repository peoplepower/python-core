  /analytic/callCenter:
    get:
      summary: Get Call Center
      operationId: Get Call Center
      description: |-
        A bot can check the current call center service status and send an alert, if the service is available.
        
        This API retrieves call center service statuses, if the service is available and
        if the registration in the third party application has been completed.

        Call center registration can have the following statuses:
        
        | Value | Status               | Description                                                                           |
        |:-----:|:---------------------|:--------------------------------------------------------------------------------------|
        |   0   | Unavailable          | The service never purchased                                                           |
        |   1   | Available            | The service purchased, but the user does not have enough information for registration |
        |   2   | Registration pending | The registration process has not been completed yet                                   |
        |   3   | Registered           | Registration completed                                                                |
        |   4   | Cancellation pending | The cancellation has not been completed yet                                           |
        |   5   | Cancelled            | Cancellation completed                                                                |
      
        The current alert status with the alert date is returned in a case of an emergency situation. It can have the following values:
        
        | Value | Status   | Description                                            |
        |:-----:|:---------|:-------------------------------------------------------|
        |   0   |          | An alert never raised                                  |
        |   1   | Raised   | An alert raised, but the call center not contacted yet |
        |   3   | Reported | The alert reported to the call center                  |
      tags:
        - Bot Professional Monitoring APIs
      security:
        - botApiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  callCenter:
                    type: object
                    properties:
                      status:
                        type: integer
                      alertStatus:
                        type: integer
                      alertDate:
                        type: string
                      alertDateMs:
                        type: integer
                      alertStatusDate:
                        type: string
                      alertStatusDateMs:
                        type: integer
              example:
                resultCode: 0
                callCenter:
                  status: 1
                  alertStatus: 3
                  alertDate: '2015-09-01T18:00:00Z'
                  alertDateMs: 1441130400000
                  alertStatusDate: '2015-09-01T18:00:30Z'
                  alertStatusDateMs: 1441130430000

    put:
      summary: Update Call Center
      operationId: Update Call Center
      description: The API can change the current alert status to raise or cancel it.
      tags:
        - Bot Professional Monitoring APIs
      security:
        - botApiKey: []
      requestBody:
        content:
          application/json:
            example:
              callCenter:
                alertStatus: 1
                signalType: E130
                signalMessage: Motion detected
                deviceId: 021DE57B-55F0-4FC0-B0AC-9FCB9AF8A001::71
                latitude: '44.062211'
                longitude: '-79.500925'
            schema:
              type: object
              properties:
                callCenter:
                  type: object
                  properties:
                    alertStatus:
                      type: integer
                    signalType:
                      type: string
                    signalMessage:
                      type: string
                    deviceId:
                      type: string
                    latitude:
                      type: string
                    longitude:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


