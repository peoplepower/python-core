  /analytic/dataRequests:
    post:
      summary: Submit Data Request
      operationId: Submit Data Request
      description: |-
        Selecting large amount of data from the database can take significant time.
        To avoid this long waiting period a bot can submit requests for all data to the server asynchronously.
        When the requests will be completed, the bot will be triggered with the trigger 2048 "Data Request".

        Selected data will be uploaded to S3 in CSV format (compressed) and stored for one day.
        The bot will receive access to it.
        
        Following data types are available for requesting:
        
        | Type | Name |
        | :--: | ---- |
        | 1 | Device parameters history |
        | 2 | Device activities (connection/disconnection) history |
        | 3 | Organization locations |
        | 4 | Location modes history |
        | 5 | Location narratives |
        | 6 | Organization devices |
        | 7 | Data streams history |
        | 8 | Energy usage |
        | 9 | Device alerts history |
      tags:
        - Bot Server APIs
      security:
        - botApiKey: []
      requestBody:
        content:
          application/json:
            example:
              dataRequests:
                - type: 1
                  key: ml_inactivity
                  deviceId: ABC123
                  startTime: 1446537883000
                  endTime: 1456537883000
                  paramNames:
                    - doorStatus
                  index: '0'
                  ordered: 1
                  compression: 0
                - type: 3
                  key: org_locations
                  searchBy: john*@gmail.com
                  locationTags:
                    - thermostat
                  deviceTags:
                    - disconnected
                  deviceTypes:
                    - 31
                    - 10014
                  ordered: 1
                  compression: 0
            schema:
              type: object
              properties:
                dataRequests:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: integer
                        description: Data type
                      key:
                        type: string
                        description: Optional request key
                      deviceId:
                        type: string
                        description: Device ID required for data types 1,2,8,9
                      startTime:
                        type: integer
                        description: Period start time in milliseconds required for data types 1,2,5,7,8,9
                      endTime:
                        type: integer
                        description: Period end time in milliseconds required for data types 1,2,5,7,8,9
                      paramNames:
                        type: array
                        description: Device parameter names optional for data type 1
                        items:
                          type: string
                      index:
                        type: string
                        description: Device part index optional for data type 1
                      searchBy:
                        type: string
                        description: Search string optional for data type 3. Use '*' for wildcard.
                      locationTags:
                        type: array
                        description: Location search tags optional for data type 3
                        items:
                          type: string
                      deviceTags:
                        type: array
                        description: Device search tags optional for data type 3
                        items:
                          type: string
                      deviceTypes:
                        type: array
                        description: Device search types optional for data types 3,6
                        items:
                          type: integer
                      aggregation:
                        type: integer
                        description: Data aggregation by:<br>0 = None<br>1 = Hours<br>2 = Days<br>3 = Months<br>4 = 7-day weeks<br>5 = 5-day weeks<br>required for data type 8
                      ordered:
                        type: integer
                        description: Order data by timestamp<br>1 = ASC<br>-1 = DESC<br>optional for data types 1,2,4,5,9
                      compression:
                        type: integer
                        description: Data compression<br>0 = LZ4, default<br>1 = ZIP<br>2 = none
                    required:
                      - type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /analytic/location/{locationId}/events:
