                                type: object
                                properties:
                                  name:
                                    type: string
                                  objectType:
                                    type: integer
                                  contentType:
                                    type: string
                                  url:
                                    type: string
                        version:
                          type: object
                          properties:
                            appVersionId:
                              type: integer
                            version:
                              type: string
                            status:
                              type: integer
                            trigger:
                              type: integer
