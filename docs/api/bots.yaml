  /analytic/ai:
    post:
      summary: Send a request to a model
      operationId: Send a request to a model
      description: |-
        Send asynchronous request to an AI model to obtain a model response.
        
        Bots can interact asynchronously with registered AI applications using this API.
      
        There are 2 types of AI applications:
        * The first type uses the LLama model and provides simple text completion or chat completion.
        * The second type uses the SetFit model and calculates phrase scoring (probabilities of scores 0,1,2).
        
        The type of AI application is determined automatically by its unique name.
        
        The response from AI application is delivered to the bot in a data stream message to the address "ai".
        The data stream message looks like:
        
        *Below the "feed" object includes both the result of LLama ("text") and SetFit ("phrases") for brevity*
        >
            {
                "address" : "ai",
                "scope" : 1,
                "feed" : {
                    "text" : "This is a simple completion or chat completion",
                    "phrases" : [
                        {
                            "text": "Emergency situation", 
                            "scores": [0.06117, 0.04631, 0.89252]
                        }
                    ]
                }
            }
        
        
        The request body and response body are different for the two types of AI applications.
        
        ***LLama***

        There are 2 types of completions:

        1. Simple completion
        2. Chat completion
        
        For simple completion, enter a sentence in the "text" field of the request body.
        
        For chat completion, enter a list of messages into the "chat" object of the request body.
        Each message must include 2 fields: 'role' ("system", "assistant", "user") and 'content'.
        
        Request body may include an optional 'params' object with such parameters as
        
        | Name              | Type  | Default Value | Description                                                                                                                                                               |
        |:------------------|:-----:|:--------------|:--------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
        | temperature       | float | 0.2           | The temperature to use for sampling.                                                                                                                                      |
        | top_p             | float | 0.95          | The top-p value to use for nucleus sampling. Nucleus sampling described in academic paper "The Curious Case of Neural Text Degeneration" https://arxiv.org/abs/1904.09751 |
        | min_p             | float | 0.05          | The min-p value to use for minimum p sampling. Minimum P sampling as described in https://github.com/ggerganov/llama.cpp/pull/3841                                        |
        | typical_p         | float | 1.0           | The typical-p value to use for sampling. Locally Typical Sampling implementation described in the paper https://arxiv.org/abs/2202.00666.                                 |
        | seed              |  int  | optional      | The seed to use for sampling.                                                                                                                                             |
        | max_tokens        |  int  | 50            | The maximum number of tokens to generate. If max_tokens <= 0 or None, the maximum number of tokens to generate is unlimited and depends on n_ctx.                         |
        | presence_penalty  | float | 0.0           | The penalty to apply to tokens based on their presence in the prompt.                                                                                                     |
        | frequency_penalty | float | 0.0           | The penalty to apply to tokens based on their frequency in the prompt.                                                                                                    |
        | repeat_penalty    | float | 1.1           | The penalty to apply to repeated tokens.                                                                                                                                  |
        
        
        ***SetFit***
        
        The input data is a list of phrases (sentences).
        The response from the AI application contains the scorings of each phrase.
      tags:
        - Bot AI APIs
      security:
        - botApiKey: []
      parameters:
        - name: name
          in: query
          description: Unique name of the model installed in the cloud.
          required: true
          schema:
            type: string
        - name: key
          in: query
          description: A reference to the request that will be sent to the bot along with the response from the model.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              text: Say me hello!
              chat:
                - role: system
                  content: You are an assistant who perfectly describes images.
                - role: user
                  content: Describe this image in detail please.
              params:
                max_tokens: 50
                repeat_penalty: 1.1
              phrases:
                - Emergency situation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


