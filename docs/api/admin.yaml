    put:
      summary: Update Organization Survey
      operationId: Update Organization Survey
      description: |-
        Update an existing survey for an organization.

        - All fields in the update request are optional, so just one survey attribute can be modified (e.g. status or title or specific questions) without providing the whole structure.
        - Survey-level attributes (status, title, description, etc.) can be fully updated.
        - Section attributes (title, orderNum, description) can be fully updated.
        - New sections can be added and existing sections can be removed.
        - All question attributes can be modified (except questionKey which identifies the question).
        - To move a question to a different section, include the question's `questionKey` in the target section's questions array.
        - New questions can be added.
        - A question can be market as deleted by setting the deleted flag. If the survey has been answered before, the deleted question will be hidden from future answers, but will be returned in answers history.
      tags:
        - Surveys
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: surveyKey
          in: path
          description: Survey Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: integer
                  description: |-
                    Survey status:<br>
                    0 - inactive<br>
                    1 - active<br>
                    2 - closed
                title:
                  type: string
                  description: Title
                description:
                  type: string
                  description: Description
                instructions:
                  type: string
                  description: Answer Instructions
                pagination:
                  type: boolean
                  description: Pagination flag to display survey in UI by pages
                minAnswerFrequency:
                  type: integer
                  description: How often the same user can answer the survey in days
                notifyCompletion:
                  type: boolean
                  description: Send notification to a user after completing the survey
                sections:
                  type: array
                  description: Survey sections. Questions in sections only need questionKey to identify which section they belong to.
                  items:
                    type: object
                    required:
                      - sectionId
                      - orderNum
                    properties:
                      sectionId:
                        type: integer
                        description: Section ID
                      orderNum:
                        type: integer
                        description: Display order number
                      title:
                        type: string
                        description: Section title
                      description:
                        type: string
                        description: Section description
                      questions:
                        type: array
                        description: Questions assigned to this section. Only questionKey is required to identify the question; all other attributes can be updated.
                        items:
                          type: object
                          required:
                            - questionKey
                          properties:
                            questionKey:
                              type: string
                              description: Question key to identify the question (cannot be changed)
                            deleted:
                              type: boolean
                              description: Set it to `true` to remove this question from future survey answers
                            orderNum:
                              type: integer
                              description: Display order number within the section
                            question:
                              type: string
                              description: Question text
                            description:
                              type: string
                              description: Question description
                            responseType:
                              type: integer
                              description: Answer type
                            optional:
                              type: boolean
                              description: Whether the question is optional
                            displayType:
                              type: integer
                              description: UI display type
                            answerFormat:
                              type: string
                              description: Regular expression to validate answer format
                            slider:
                              type: object
                              description: Slider configuration (for slider-type questions)
                              properties:
                                min:
                                  type: integer
                                max:
                                  type: integer
                                increment:
                                  type: integer
                                minDesc:
                                  type: string
                                maxDesc:
                                  type: string
                                unitsDesc:
                                  type: string
                            responseOptions:
                              type: array
                              description: Response options (for multiple choice questions)
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  text:
                                    type: string
            example:
              status: 1
              title: Updated Survey Title
              description: Updated survey description
              instructions: Updated instructions
              pagination: true
