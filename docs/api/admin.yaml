components:
  securitySchemes:
    userApiKey:
      type: apiKey
      in: header
      name: API_KEY
      description: End-user or Admin API key
    adminApiKey:
      type: apiKey
      in: header
      name: API_KEY
      description: Admin API key
    botApiKey:
      type: apiKey
      in: header
      name: ANALYTIC_API_KEY
      description: Bot instance's API key

  schemas:
    ReportCollection:
      type: object
      properties:
        collectionId:
          type: integer
          description: Collection ID
        organizationId:
          type: integer
          description: Organization ID
        name:
          type: string
          description: Collection name
        description:
          type: string
          description: Collection description
        executionSchedule:
          type: string
          description: Cron expression for the execution schedule
        notificationCategories:
          type: array
          items:
            type: integer
          description: Notification categories
        lastExecutionDate:
          type: string
          description: Last execution date in ISO-8601 format
        lastExecutionDateMs:
          type: integer
          description: Last execution date in milliseconds since the epoch
        nextExecutionDate:
          type: string
          description: Next execution date in ISO-8601 format
        nextExecutionDateMs:
          type: integer
          description: Next execution date in milliseconds since the epoch
        reports:
          type: array
          description: Reports in this collection
          items:
            type: object
            properties:
              collectionReportId:
                type: integer
                description: Collection report ID
              reportId:
                type: integer
                description: Report ID
              reportType:
                type: integer
                description: Report type
              displayName:
                type: string
                description: Report display name
              description:
                type: string
                description: Report description
              parameters:
                type: object
                additionalProperties:
                  type: string
                description: Report parameters as key-value pairs

tags:
  - name: Organizations
    description: |-
      Organization can be created and changed only by a System Administrator.
      That means: Care Daily and Care Daily partners work directly with customers,
      who wish to deploy Community Social Networks in their state, county, city, campus, building, or subscriber base.

  - name: Administrators
    description: |-
      The IoT Software Suite is a role-based access control system.

      * A "System Administrator" is allowed access to manage the entire system.
      * An "Organization Administrator" can manage users within their own organization. They do not have access to users or data from other organizations.
      * A "User" can only manage and see their own account. If they belong to an organization, users can retrieve limited data about the organization to which they belong.

  - name: Users and Locations
    description: |-
      | Field | Type | Description |
      | :---: | :--: | ----------- |
      | notes | string | Notes on this user, available only to Organizational or System Administrators. |

  - name: Tags
    description: |-
      Tags are a way to categorize sets of users, or devices.

      Tags can be generated automatically from AI bots, or manually by the administrator.
      The administrator can see device, location and user tags.

      ### Tag Types

      | ID | Name |
      |:--:| ---- |
      | 1 | User |
      | 2 | Location |
      | 3 | Device |

      ### Location Tag Categories

      | ID  | Name     |
      |:---:|:---------|
      |  0  | default  |
      |  1  | highlight |

  - name: EHR
    description: Care Daily can integrate with partners to receive ADT and medical infomation over HL7 and FHIR protocols.

  - name: Surveys
    description: |-
      Set of APIs for Connections Surveys and Personalized Plan Questionnaire
      and especially for the online form generation by the Care Daily Web application
      and submission of this form as questions/answers.
      Surveys are the same across organizational locations.
      
      Each survey has a unique key.
      Each question has a key, which is unique withing a survey.
      
      The history of survey answers is permanently stored in the user's account.
      
      ### Survey Statuses
      
      | Status | Description |
      | :----: | ----------- |
      | 0 | Inactive (initial, returned, but not for answering) |
      | 1 | Active (can be answered) |
      | 2 | Closed for answers, history available |
      | 3 | Deleted |
      
      ### Question Response Types

      <table>
      <tr><th>ID</th><th>Name</th><th>Display Type Values</th></tr>
      <tr><td>1</td><td>Boolean<br/>0 = False<br/>1 = True</td>
      <td><b>0</b> = On/Off Switch - default.<br/>
      <b>1</b> = Yes/No.<br/>
      <b>2</b> = Single 'Yes' button only, the question's default value is applied to the button's text. Used to trigger bot actions from the UI.<br/>
      <b>3</b> = Thumbs-up / Thumbs-down<br/><br/>
      The answer is a 0 or 1.</td></tr>
      <tr><td>2</td><td>Multiple choice - Single select</td>
      <td><b>0</b> = Radio buttons - default.<br/>
      A list of radio buttons. Requires the "responses" array to list the possible responses.
      Users can only select one response. Available for anonymous aggregated public reporting.<br/><br/>
      <b>1</b> = Drop-down list / Picker.<br/>
      A drop down list. Same as radio buttons, but can contain more items.<br/><br/>
      <b>2</b> = Slider.<br/>
      Slider UI view with predefined stops as an options.<br/><br/>
      <b>3</b> = Modal Bottom Action Sheet.<br/>
      Multiple-choice buttons that slide up from the bottom of the screen.<br/><br/>
      The answer is the ID of the response option.</td></tr>
      <tr><td>4</td><td>Multiple choice - Multiple select</td>
      <td>A list of checkbox options. Requires the "responses" array to list the possible responses.
      Users can select multiple responses. Available for anonymous aggregated public reporting.<br/><br/>
      The answer is a bitmask of selected choices.</td></tr>
      <tr><td>6</td><td>Day of the week</td><td>Day of the week input.
      The UI can optimize itself for selecting days of the week [Sun][XXX][Tue][Wed][Thu][XXX][Sat].<br/><br/>
      <b>0</b> = Select multiple days simultaneously.<br/>
      <b>1</b> = Pick a single day only.<br/><br/>
      The answer is a bitmasked value, days can be logically-OR'd together to specify multiple days of the week, ranging from SUN=0x1 to SAT=0x40.</td></tr>
      <tr><td>7</td><td>Slider</td>
      <td><b>0</b> = Integer select - default.<br/>
      Slider, with a defined minimum and maximum.<br>
      By default, minimum = 0 and maximum = 100.<br/>
      <b>1</b> = Floating point select.<br/>
      <b>2</b> = Minutes:Seconds.<br/><br/>
      Answer is the number selected. For time, the answer is in integer seconds.</td></tr>
      <tr><td>8</td><td>Time in seconds since midnight</td>
      <td><b>0</b> = hours:minutes:seconds (am|pm) - default.<br/>
      This accesses the native UI method of declaring a time.<br/>
      <b>1</b> = hours:minutes (am|pm).<br/><br/>
      The answer is in integer seconds since midnight.</td></tr>
      <tr><td>9</td><td>Date and Time in ISO 8601</td>
      <td><b>0</b> = Date and time.<br/>
      <b>1</b> = Date only.<br/><br/>
      The answer is in ISO 8601 format, `YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]`</td></tr>
      <tr><td>10</td><td>Text box</td>
      <td>Open-ended question.<br/>
      For example, if you were to ask, "Who just walked by the camera?"<br/><br/>
      The answer is a string of text.</td></tr>
      </table>

      ### User's Answer Values

      * Boolean: 0 = No, 1 = Yes
      * Multi-choice Single-select: ID of the radio button
      * Multi-choice Multi-select: Bitmask representing response options
      * Slider value
      * Text entered by the user

      Days of the week are represented by a bitmask:

      | Value | Name | Bit |
      | :---: | ---- | --- |
      | 1 | Sunday | 0 |
      | 2 | Monday | 1 |
      | 4 | Tuesday | 2 |
      | 8 | Wednesday | 3 |
      | 16 | Thursday | 4 |
      | 32 | Friday | 5 |
      | 64 | Saturday | 6 |

  - name: Reports
    description: The IoT Software Suite provides online reports for different purposes.

  - name: Billing
    description: |-
      Billing APIs allow to configure billing plans for organizations and regenerate existing bills created in the past.

      Billing APIs require an admin API key and that the user has the organization billing permission 11.

