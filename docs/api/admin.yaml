  /admin/json/organizations/{organizationId}/locationStatus:
    put:
      summary: Add or Update or Remove locations
      operationId: Add or Update or Remove locations
      description: |-
        Batch API to manage locations in an organization.

        Locations will be added or moved to the organization automatically, if they are not there.

        To remove locations from the organization set the `delete` field to `true`.

        This API does not guaranty that the request will be performed for all locations.
        The error code may not be returned in this case.
      tags:
        - Users and Locations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              locationIds:
                - 123
                - 124
                - 125
              notes: Notes text
              delete: false
            schema:
              type: object
              properties:
                locationIds:
                  type: array
                  items:
                    type: integer
                  description: Location IDs to move to the organization
                startDate:
                  type: string
                  description: Start date in the new organization. Must be between the current organization start time and the current time.
                notes:
                  type: string
                  description: Location notes
                delete:
                  type: boolean
                  description: Remove locations from the organization
              required:
                - locationIds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/organizations/{organizationId}/narratives:
    get:
      summary: Get Organization Narratives
      operationId: Get Organization Narratives
      description: |-
        Organization narratives for the specified organization and the child organizations.

        The search results are organized by "pages". 
        Each page contains a set of elements sorted by the `narrativeTime` in descending order.
        The pages follow one another in reverse chronological order.

        The rowCount parameter specifies the maximum number of elements per page.

        The result may include the `nextMarker` property - this means that there are more pages for the current search criteria. 
        To get the next page, the value of `nextMarker` must be passed to the `pageMarker` parameter on the next API call.
      tags:
        - Users and Locations
      security:
        - adminApiKey: []
        - botApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: searchTag
          in: query
          description: Filter by location's tags, multiple values
          schema:
            type: string
        - name: locationId
          in: query
          description: Filter by location IDs, multiple values
          schema:
            type: integer
        - name: narrativeTime
          in: query
          description: Specific narrative time
          schema:
            type: integer
        - name: narrativeId
          in: query
          description: Filter by ID
          schema:
            type: integer
        - name: parentId
          in: query
          description: Filter by parent ID
          schema:
            type: integer
        - name: narrativeType
          in: query
          description: Filter by narrative type, multiple values
          schema:
            type: integer
        - name: priority
          in: query
          description: Filter by priority higher or equal than that
          schema:
            type: integer
        - name: toPriority
          in: query
          description: Filter by priority less or equal than that
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by status, deleted are not returned by default
          schema:
            type: integer
        - name: eventType
          in: query
          description: Filter by event type
          schema:
            type: string
        - name: searchBy
          in: query
          description: Filter by title or description. Use * for a wildcard.
          schema:
            type: string
        - name: startDate
          in: query
          description: Narrative date range start
          schema:
            type: string
        - name: endDate
          in: query
          description: Narrative date range end
          schema:
            type: string
        - name: rowCount
          in: query
          description: Maximum number of elements per page
          required: true
          schema:
            type: integer
        - name: pageMarker
          in: query
          description: Marker to the next page
          schema:
            type: string
      responses:
        '200':
          description: Organization Narratives
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  nextMarker:
                    type: string
                  narratives:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        locationId:
                          type: integer
                        narrativeDate:
                          type: string
                        narrativeDateMs:
                          type: integer
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                        narrativeType:
                          type: integer
                        priority:
                          type: integer
                        status:
                          type: integer
                        icon:
                          type: string
                        iconFont:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        target:
                          type: object
                          properties:
                            field:
                              type: string
                        appInstanceId:
                          type: integer
                        location:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            type:
                              type: integer
                            language:
                              type: string
                            timezone:
                              type: string
                            organizationId:
                              type: integer
                            creationDate:
                              type: string
                            creationDateMs:
                              type: integer
                        user:
