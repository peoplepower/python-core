  /admin/json/billingPlans/{planId}/versions:
    get:
      summary: Get Billing Plan Versions
      operationId: Get Billing Plan Versions
      description: |-
        A billing plan version contains prices for billing items inside a billing plan for specific time period.

        The total bill value is calculated as a sum of all price values multiplied to item amounts collected from all locations in the organization for the billing period.

        Price values are in cents. It can be set for one item or for multiple item counts in the `perAmount` field.

        Price values for each item can be set depending on the item counts collected from the organization.
        For example, for the first 1000 locations it will be one price, and for following 9000 locations it will be another price.
        The price value is applied based on the value set in the `levelAmount` field, which is the start of the price value range.
        Each item included to the plan version must have one price record with `levelAmount = 0`.

        A price value for an item can be defined based on the amount of other item as well.
        In this case the second item ID must be set in the `levelItemId` field.

        For example, if an organization at the beginning of billing cycle has from 0 to 10,000 locations, the price for each new location added in this billing cycle will be one.
        If an organization at the beginning of billing cycle has more than 10,000 locations, the price for each new location added in this billing cycle will be different.
      tags:
        - Billing
      security:
        - adminApiKey: []
      parameters:
        - name: planId
          in: path
          description: Plan ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Plan Versions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        planVersionId:
                          type: integer
                        startDate:
                          type: string
                        startDateMs:
                          type: integer
                        endDate:
                          type: string
                        endDateMs:
                          type: integer
                        prices:
                          type: array
                          items:
                            type: object
                            properties:
                              itemId:
                                type: integer
                              levelAmount:
                                type: integer
                              priceValue:
                                type: integer
                              perAmount:
                                type: integer
                              levelItemId:
                                type: integer
                            required:
                              - itemId
                              - levelAmount
                              - priceValue
                              - perAmount
                              - levelItemId
                      required:
                        - planVersionId
                        - startDate
                        - startDateMs
                        - endDate
                        - endDateMs
                        - prices
              example:
                resultCode: 0
                versions:
                  - planVersionId: 1
                    startDate: '2021-09-01T00:00:00Z'
                    startDateMs: 1630454400000
                    endDate: '2022-11-01T00:00:00Z'
                    endDateMs: 1667260800000
                    prices:
                      - itemId: 1
                        levelAmount: 0
                        priceValue: 9000
                        perAmount: 10
                      - itemId: 1
                        levelAmount: 1000
                        priceValue: 8500
                        perAmount: 10
                  - planVersionId: 2
                    startDate: '2022-11-01T00:00:00Z'
                    startDateMs: 1667260800000
                    endDate: '2100-01-01T00:00:00Z'
                    endDateMs: 4102462800000
                    prices:
                      - itemId: 2
                        levelAmount: 0
                        levelItemId: 3
                        priceValue: 11000
                        perAmount: 10
                      - itemId: 2
                        levelAmount: 1000
                        levelItemId: 3
                        priceValue: 10500
                        perAmount: 10

    post:
      summary: Create or Update Billing Plan Version
      operationId: Create or Update Billing Plan Version
      description: ''
      tags:
        - Billing
      security:
        - adminApiKey: []
      parameters:
        - name: planId
          in: path
          description: Plan ID
          required: true
          schema:
            type: integer
        - name: planVersionId
          in: query
          description: Plan version ID to update
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              version:
                startDate: '2022-11-01T00:00:00Z'
                prices:
                  - itemId: 1
                    levelAmount: 0
                    priceValue: 11000
                    perAmount: 10
                  - itemId: 1
                    levelAmount: 1000
                    priceValue: 10500
                    perAmount: 10
            schema:
              type: object
              properties:
                version:
                  type: object
                  properties:
                    startDate:
                      type: string
                    prices:
                      type: array
                      items:
                        type: object
                        properties:
                          itemId:
                            type: integer
                          levelAmount:
                            type: integer
                          priceValue:
                            type: integer
                          perAmount:
                            type: integer
                        required:
                          - itemId
                          - levelAmount
                          - priceValue
                          - perAmount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


