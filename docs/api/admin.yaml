  /admin/json/organizations/{organizationId}/surveys:
    get:
      summary: Get Organization Surveys
      operationId: Get Organization Surveys
      description: |-
        Return a list of surveys available for an organization or parent organizations.
      tags:
        - Surveys
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: status
          in: query
          description: |-
            Survey status:<br>
            0 - inactive<br>
            1 - active<br>
            2 - closed
          schema:
            type: integer
      responses:
        '200':
          description: Surveys
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  surveys:
                    type: array
                    items:
                      type: object
                      properties:
                        surveyKey:
                          type: string
                          description: Unique Survey Key
                        organizationId:
                          type: integer
                          description: ID of organization, which is the owner of the survey
                        status:
                          type: integer
                          description: |-
                            Survey status:<br>
                            0 - inactive (cannot be answered)<br>
                            1 - active,<br>
                            2 - closed
                        title:
                          type: string
                          description: Title
                        description:
                          type: string
                          description: Description
                        instructions:
                          type: string
                          description: Answer Instructions
                        pagination:
                          type: boolean
                          description: Pagination flag to display survey in UI by pages
                        minAnswerFrequency:
                          type: integer
                          description: How often the same user can answer the survey in days
                        notifyCompletion:
                          type: boolean
                          description: Send notification to a user after completing the survey
              example:
                resultCode: 0
                surveys:
                  - surveyKey: ConnectionSurvey
                    organizationId: 100
                    status: 1
                    title: Connections Survey
                    description: Successful Aging Connections Questionnaire
                    pagination: true

    post:
      summary: Create Organization Survey
      operationId: Create Organization Survey
      description: |-
        Create a new survey for an organization.
      tags:
        - Surveys
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - surveyKey
                - title
                - sections
              properties:
                surveyKey:
                  type: string
                  description: Unique Survey Key
                status:
                  type: integer
                  description: |-
                    Survey status:<br>
                    0 - inactive (cannot be answered, default)<br>
                    1 - active
                title:
                  type: string
                  description: Title
                description:
                  type: string
                  description: Description
                instructions:
                  type: string
                  description: Answer Instructions
                pagination:
                  type: boolean
                  description: Pagination flag to display survey in UI by pages
                minAnswerFrequency:
                  type: integer
                  description: How often the same user can answer the survey in days
                notifyCompletion:
                  type: boolean
                  description: Send notification to a user after completing the survey
                sections:
                  type: array
                  description: Survey sections
                  items:
                    type: object
                    required:
                      - sectionId
                      - orderNum
                      - questions
                    properties:
                      sectionId:
                        type: integer
                        description: Section ID
                      orderNum:
                        type: integer
                        description: Display order number
                      title:
                        type: string
                        description: Section title
                      description:
                        type: string
                        description: Section description
                      questions:
                        type: array
                        description: Section questions
                        items:
                          type: object
                          required:
                            - questionKey
                            - orderNum
                            - question
                          properties:
                            questionKey:
                              type: string
                              description: Unique question key within the survey
                            orderNum:
                              type: integer
                              description: Display order number
                            question:
                              type: string
                              description: Question text
                            description:
                              type: string
                              description: Question description
                            responseType:
                              type: integer
                              description: Response type
                            optional:
                              type: boolean
                              description: Whether the question is optional
                            displayType:
                              type: integer
                              description: Display type for UI rendering
                            answerFormat:
                              type: string
                              description: Answer format (e.g., text)
                            slider:
                              type: object
                              description: Slider configuration for range questions
                              properties:
                                min:
                                  type: integer
                                max:
                                  type: integer
                                increment:
                                  type: integer
                                minDesc:
                                  type: string
                                maxDesc:
                                  type: string
                                unitsDesc:
                                  type: string
                            responseOptions:
                              type: array
                              description: Multiple choice options
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  text:
                                    type: string
            example:
              surveyKey: sample-survey
              status: 0
              title: Sample Survey
              description: This is a sample survey
              instructions: Please answer all questions
              pagination: false
              minAnswerFrequency: 0
              sections:
                - sectionId: 1
                  orderNum: 1
                  title: General Questions
                  questions:
                    - questionKey: q1
                      orderNum: 1
                      question: How would you rate your experience?
                      responseType: 1
                      optional: false
                      responseOptions:
                        - id: 1
                          text: Excellent
                        - id: 2
                          text: Good
                        - id: 3
                          text: Fair
      responses:
        '200':
          description: Survey Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


