  /reports/reports:
    get:
      summary: Get Reports
      operationId: Get Reports
      description: |-
        Returns the list of reports available for an organization or a list of system reports if organization is not specified.

        For each report, the API returns the report id, report name, description, parameters and fields. 
        Also, each report entry contains a list of report groups to which the report is included.

        #### Data Types

        The report parameters and fields have the attribute 'type' that designates their data type:

        | ID | Type      |
        |:--:|-----------|
        | 1  | string    |
        | 2  | integer   |
        | 3  | date-time |
        | 4  | decimal   |
        | 5  | boolean   |

        #### Report Parameters

        Report parameters appear in ascending order of their order attribute (starting from 0).

        #### Report Fields

        Each report field entry includes the attribute 'index' that is an ordinal number of the field (starting with 1).

        #### Report Datetime Parameters

        The following formats for entering date and time are allowed for the datetime parameters (of type 3):

        | Format | Examples |
        |--------|----------|
        | ISO-8601 extended local date format | '2020-07-17' |
        | ISO-8601 extended local date-time format | '2020-07-17T10:15:30' |
        | ISO-8601 extended offset date-time format | '2020-07-17T10:15:30+03:00' |
        | Special format for current date time | '{now}' |
        | Special format for a date several hours prior or after the current date | '{now}-6h', '{now}+1h' |
        | Special format for a date several days prior or after the current date | '{now}-7d', '{now}+2d' |
        | Special format for a date several months prior or after the current date | '{now}-3m', '{now}+1m' |
      tags:
        - Reports
      security:
        - adminApiKey: []
      parameters:
        - name: reportId
          in: query
          description: Filter by report ID
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Filter by organization ID
          schema:
            type: integer
        - name: reportGroupId
          in: query
          description: Filter by report group ID
          schema:
            type: integer
        - name: analytic
          in: query
          description: Filter by 'analytic' report flag
          schema:
            type: boolean
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  reports:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Report ID
                        type:
                          type: integer
                          enum: [0,1]
                          description: |-
                            Report Type: 0 - General Summary report, 1 = Analytical
                        analytic:
                          type: boolean
                          description: If the report is analytic
                        name:
                          type: string
                          description: Report name
                        desc:
                          type: string
                          description: Report description
                        params:
                          type: array
                          description: Report parameters
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Parameter index, starts from 0
                              name:
                                type: string
                                description: Parameter name
                              placeholder:
                                type: string
                                description: Placeholder in UI
                              type:
                                type: integer
                                description: Parameter datatype, 1=string, 2=integer, 3=datetime, 4=double, 5=boolean
                                enum: [1,2,3,4,5]
                              required:
                                type: boolean
                                description: If the parameter is required
                              order:
                                type: integer
                                description: Parameter order in UI
                              desc:
                                type: string
                                description: Parameter description
                            required:
                              - id
                              - name
                              - placeholder
                              - type
                              - required
                              - order
                              - desc
                        fields:
                          type: array
                          description: Report fields
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Field index, starts from 1
                              name:
                                type: string
                                description: Field name
                              desc:
                                type: string
                                description: Field description
                              type:
                                type: integer
                                description: Field datatype, 1=string, 2=integer, 3=datetime, 4=double, 5=boolean, 6=date
                                enum: [1,2,3,4,5,6]
                            required:
                              - id
                              - name
                              - desc
                              - type
                        metadata:
                          type: array
                          description: Report metadata definitions
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Metadata name
                              desc:
                                type: string
                                description: Metadata description
                            required:
                              - name
                        reportGroups:
                          type: array
                          description: Report groups the report belongs to
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Group ID
                              name:
                                type: string
                                description: Group name
                              description:
                                type: string
                                description: Group description
                              dashboard:
                                type: string
                                description: UI dashboard to include this group
                              dashboardName:
                                type: string
                                description: UI dasboard name
                              organizationId:
                                type: integer
                                description: Top level organization ID in the hierarchy
                              startDate:
                                type: string
                                description: Start date of the report's membership in this report group
                              startDateMs:
                                type: integer
                                description: Start date of the report's membership in this report group, in milliseconds since the epoch
                              parameters:
                                type: object
                                description: Parameters set in this report group for automatic running the report
                              schedule:
                                type: string
                                description: A cron expression that describes the schedule set in this report group for automatic running the report
                              sortOrder:
                                type: integer
              example:
                resultCode: 0
                reports:
                  - id: 1
                    analytic: true
                    name: Active Users Report
                    desc: >-
                      The number of users who logged in during the specified
                      period, optionally grouped by application
                    params:
                      - id: organizationId
                        name: Organization
                        placeholder: Select organization...
                        type: 2
                        required: true
                        order: 0
                      - id: startDate
                        name: Start date
                        desc: First date of statistics
                        placeholder: Set a date...
                        type: 3
                        required: true
                        order: 1
                      - id: endDate
                        name: End date
                        desc: Last date of statistics
                        placeholder: Set a date...
                        type: 3
                        required: true
                        order: 2
                      - id: suborgs
                        name: Include sub-organizations
                        type: 5
                        required: true
                        order: 3
                    fields:
                      - id: appName
                        name: App Name
                        desc: Application name
                        type: 1
                        index: 1
                      - id: count
                        name: Count
                        desc: Count of active users
                        type: 2
                        index: 2
                    metadata:
                      - name: totalCount
                        desc: Total number of active users
                    reportGroups:
                      - id: 1
                        name: Analytic reports
                        description: Analytic reports, which run by schedule
                        dashboard: care
                        dashboardName: Care Dashboard
                        organizationId: 123
                        startDate: '2020-09-15T19:44:51+03:00'
                        startDateMs: 1600188291000
                        parameters:
                          fromDate: '{now}-7d'
                          toDate: '{now}'
                        schedule: 0 0 8 ? * FRI
                        sortOrder: 1


  /reports/generate:
    get:
      summary: Generate Report
      operationId: Generate Report
      description: |-
        Generate specific report. The result is provided in the CSV format.
        
        Reports can be delivered by email or stored in the reports generation history and requested by calling the [Get Report Data API](#tag/Reports/operation/Get%20Report%20Data).

        All report parameters should be provided in the query string as name=value pairs.
      tags:
        - Reports
      security:
        - adminApiKey: []
      parameters:
        - name: reportId
          in: query
          description: Report ID
          required: true
          schema:
            type: integer
        - name: deliveryType
          in: query
          description: |-
            Way to return report data:<br>
            2 - send by email,<br>
            3 - save result to be retrieved later
          required: true
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Generate report for specific organization
          schema:
            type: integer
        - name: collectionId
          in: query
          description: Generate report for specific reports collection
          schema:
            type: integer
        - name: executionDate
          in: query
          description: Store the result in the collection reports execution history for this date
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  token:
                    type: string
                    description: Token to use in the Get Report Data API


  /reports/data:
    get:
      summary: Get Report Executions
      operationId: Get Report Executions
      description: |-
        The API returns the report executions history.

        Two mutually exclusive modes are supported:

        * **Collection mode** (`collectionId` is provided): returns executions for all reports in the given report collection.
          `organizationId` is required in this mode.
        * **Report mode** (`reportId` + `reportGroupId` are provided): returns executions for a specific report and report group.
          `organizationId` is optional in this mode (required only for organizational report groups).

        The output format of the report data depends on whether the report is analytical or not.

        * For analytical reports the output is a single-row data and is returned by the API in the form of key-value pairs where key is the report field ID;
        * For non-analytical reports the output is a set of rows of comma-separated values stored as a zip archive in AWS S3. The API returns the pre-signed URL for downloading the stored objects.

        In this example, the API response for both analytical and non-analytical reports is presented.
        Real responses will return either 'url' or 'data' and 'dictionary' element.
      tags:
        - Reports
      security:
        - adminApiKey: []
      parameters:
        - name: startDate
          in: query
          description: Start date
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: End date
          required: true
          schema:
            type: string
        - name: collectionId
          in: query
          description: Report collection ID. When provided, returns executions for all reports in the collection. Required if reportId and reportGroupId are not provided.
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Organization ID. Required when collectionId is provided; optional for organizational report groups in report mode.
          schema:
            type: integer
        - name: reportId
          in: query
          description: Report ID. Required together with reportGroupId if collectionId is not provided or used as a filter for collections.
          schema:
            type: integer
        - name: reportGroupId
          in: query
          description: Report group ID. Required together with reportId if collectionId is not provided.
          schema:
            type: integer
      responses:
        '200':
          description: Report Executions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  executions:
                    type: array
                    description: Report outputs
                    items:
                      type: object
                      properties:
                        report:
                          type: object
                          description: Report object
                          properties:
                            id:
                              type: integer
                              description: Report ID
                            type:
                              type: integer
                              enum: [0,1]
                              description: |-
                                Report Type: 0 - General Summary report, 1 = Analytical
                            analytic:
                              type: boolean
                              description: If the report is analytic
                            name:
                              type: string
                              description: name
                            desc:
                              type: string
                              description: description
                            displayInfo:
                              type: object
                              description: Display object
                            fields:
                              type: array
                              description: Report fields
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Field index, starts from 1
                                  name:
                                    type: string
                                    description: Field name
                                  desc:
                                    type: string
                                    description: Field description
                                  type:
                                    type: integer
                                    description: Field datatype, 1=string, 2=integer, 3=datetime, 4=double, 5=boolean, 6=date
                                    enum: [1,2,3,4,5,6]
                                required:
                                  - id
                                  - name
                                  - desc
                                  - type
                        collectionId:
                          type: integer
                          description: Report collection ID
                        collectionReportId:
                          type: integer
                          description: Report entry ID within the collection
                        executionDate:
                          type: string
                          description: Report completion datetime
                        executionDateMs:
                          type: integer
                          description: Report completion datetime, in milliseconds since the epoch
                        scheduleDate:
                          type: string
                          description: Scheduled report execution datetime
                        scheduleDateMs:
                          type: integer
                          description: Scheduled report execution datetime, in milliseconds since the epoch
                        executionTime:
                          type: integer
                          description: Report execution duration, in milliseconds
                        organizationId:
                          type: integer
                          description: Organization ID
                        rowCount:
                          type: integer
                          description: Number of rows in the report output
                        metadata:
                          type: array
                          description: Report execution metadata
                          items:
                            type: object
                            properties:
                              name: string
                              value: string
                        errorMessage:
                          type: string
                          description: Error message if the report execution failed
                        url:
                          type: string
                          description: Link to download the detailed report output in ZIP format
                        urlJson:
                          type: string
                          description: Link to get the report output in JSON format
                        data:
                          type: array
                          description: Analytical report output
                          items:
                            type: object
                        dictionary:
                          type: array
                          description: Report names
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: Report ID
                              name:
                                type: string
                                description: Report name
                              description:
                                type: string
                                description: Report description
              example:
                resultCode: 0
                executions:
                  - report:
                      reportId: 201
                      reportName: Daily Summary
                      fields:
                        - id: 1
                          name: Location ID
                          type: 2
                    collectionId: 5
                    collectionReportId: 12
                    executionDateMs: 1600778491000
                    executionDate: 2020-09-22T12:41:31Z
                    scheduleDateMs: 1600732800000
                    scheduleDate: 2020-09-22T00:00:00Z
                    executionTime: 3200
                    rowCount: 150
                    metadata:
                      totalSum: 250
                    errorMessage: null
                    url: >-
                      https://app.peoplepowerco.com/reports/data/lskjdffsdfs.sldfjlksdjfsdfsdfsdf.jsldjflsdfkjdklfdsfsdfs
                    data:
                      - id: 0
                        value: 0
                      - id: 24
                        value: 5
                      - id: 18
                        value: 72
                      - id: 19
                        value: 7
                      - id: 22
                        value: 7
                    dictionary:
                      - id: 3
                        name: Pro Video
                        description: Pro Video service and 5 GB disk space
                      - id: 5
                        name: Pro Energy
                        description: Pro Energy services
                      - id: 17
                        name: Care
                        description: Care

    delete:
      summary: Delete Report Executions
      operationId: Delete Report Executions
      description: |-
        The API deletes stored report executions history filtered by requested parameters.
      tags:
        - Reports
      security:
        - adminApiKey: []
      parameters:
        - name: collectionId
          in: query
          required: true
          description: Report collection ID
          schema:
            type: integer
        - name: organizationId
          in: query
          required: true
          description: Organization ID
          schema:
            type: integer
        - name: executionDate
          in: query
          description: Execution date
          required: true
          schema:
            type: string
        - name: reportId
          in: query
          description: Report ID filter
          schema:
            type: integer
        - name: collectionReportId
          in: query
          description: Collection report ID filter
          schema:
            type: integer
      responses:
        '200':
