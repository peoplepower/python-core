  /admin/json/status:
    get:
      summary: Get System Status
      operationId: Get System Status
      description: |-
        This API return detailed statistics about different system componets for the last 24 hours.

        The response contails 3 major sections. The `pulses` section contains general statuses of running modules.

        | Module Type | Name |
        | :---------: | ---- |
        | 1 | deviceio |
        | 2 | device streaming |
        | 3 | wsapi |
        | 4 | Restful API |
        | 5 | Data processing |
        | 6 | scheduler |

        The `min5Statuses` section contains system statistics for the last 60 minutes aggregated in 5 minutes intervals.
        Each statistic structure contains numbers of succesful and error operations.

        The `hourStatuses` section contains system statistics for the last 24 hours aggregated in 60 minutes intervals.
        The structure is the same as in the `min5Statuses` section.

        | Service | Description |
        | ------- | ----------- |
        | AG | Avantguard signal API calls |
        | AM | Avantguard management API calls |
        | APN | Apple Push Notifications |
        | FCM | Firebase Cloud Messaging |
        | PM | Potmark API calls (emails) |
        | RS | Restful API calls |
        | S1 | One Time Scheduler jobs execution |
        | SC | CRON Scheduler jobs execution |
        | S3 | AWS S3 API calls |
        | S3D | AWS S3 batch delete API calls |
        | SMS | SMS sending API calls |
        | ZD | Zendesk tickets |
      tags:
        - Status
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: Filter response by specific organization
          schema:
            type: integer
      responses:
        '200':
          description: System Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  pulses:
                    type: array
                    description: General statuses of running modules
                    items:
                      type: object
                      properties:
                        type:
                          type: integer
                          description: Module type
                        status:
                          type: integer
                          description: |-
                            Last reported module's status:<br>
                            1 - active<br>
                            0 - inactive
                        load:
                          type: integer
                          description: The recent cpu usage for process in %
                        time:
                          type: integer
                          description: How old this information in milliseconds
                        name:
                          type: string
                          description: Server's index
                  min5Statuses:
                    type: array
                    description: System statistics for the last 60 minutes aggregated in 5 minutes intervals
                    items:
                      type: object
                      properties:
                        timeMs:
                          type: integer
                          description: Start of the interval in milliseconds
                        time:
                          type: string
                          description: Start of the interval
                        srv:
                          type: array
                          description: Services API calls by name
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                                description: Service name
                              success:
                                type: integer
                                description: Number of success executions
                              errors:
                                type: integer
                                description: Number of errors
                              successTime:
                                type: integer
                                description: Total success execution time
                              errorsTime:
                                type: integer
                                description: Total errors execution time
                            required:
                              - name
                              - success
