openapi: 3.1.1
info:
  title: 'IoT Software Suite: Admin API'
  version: '61'
  description: |-
    Care Daily offers a full Command Center to engage your customers and manage IoT services, and access to social engagement layers.

    A component of the [IoT Software Suite](cloud.html) solution,
    the Command Center and the social engagement layers are the missing link for service providers to deliver truly compelling IoT services.

    The APIs described below follow the same principals as the rest of the [IoT Software Suite Application APIs](cloud.html).

servers:
  - url: https://app.peoplepowerco.com/
    description: US production
  - url: https://eu.caredaily.ai/
    description: EU production
  - url: https://sboxall.peoplepowerco.com/
    description: Sandbox

paths:
  /admin/json/brands:
    get:
      summary: Get Brands
      operationId: Get Brands
      description: Returns all supported brands. Available only to administrators with `access all` privilege.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      responses:
        '200':
          description: Brands
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  brands:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Brand's name
              example:
                resultCode: 0
                brands:
                  - name: default
                  - name: care


  /admin/json/organizations:
    get:
      summary: Get Organizations
      operationId: Get Organizations
      description: Retrieve organizations information. API key is optional.
      tags:
        - Organizations
      security:
        - userApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: Search field - Specific organization ID to get information about
          schema:
            type: integer
        - name: domainName
          in: query
          description: Search field - Exact domain name
          schema:
            type: string
        - name: name
          in: query
          description: Search field - First characters of organization name
          schema:
            type: string
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  organizations:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Unique organization ID
                        parentId:
                          type: integer
                          description: ID of the parent organization
                        name:
                          type: string
                          description: Name of the organization
                        domainName:
                          type: string
                          description: Unique short name
                        brand:
                          type: string
                          description: Brand name
                        updateDate:
                          type: string
                        updateDateMs:
                          type: integer
                        organizationAdmin:
                          type: boolean
                          description: If the user is an administrator of this organization
                        parentAdmin:
                          type: boolean
                          description: If the user is an administrator of the parent organization
                        organizationEditor:
                          type: boolean
                          description: If the user can update this organization
                        locked:
                          type: boolean
                          description:
                        features:
                          type: string
                          description: Available features for this organization:<br>m - messages<br>c - challenges
                        deviceTypes:
                          type: string
                          description: Types of devices managed in this organization
                        termOfService:
                          type: string
                          description: Terms of Service agreement signature ID
                        timezone:
                          type: object
                          description: Default organization time zone
                          properties:
                            id:
                              type: string
                              description: Time zone ID
                            offset:
                              type: integer
                              description: Timezone offset in minutes
                            dst:
                              type: boolean
                              description: Daylight saving time enabled
                            name:
                              type: string
                              description: Timezone name
                        contactName1:
                          type: string
                          description: Contact name 1
                        contactEmail1:
                          type: string
                          description: Contact email 1
                        contactPhone1:
                          type: string
                          description: Contact phone 1
                        contactName2:
                          type: string
                          description: Contact name 2
                        contactEmail2:
                          type: string
                          description: Contact email 2
                        contactPhone2:
                          type: string
                          description: Contact phone 2
                        addrStreet1:
                          type: string
                          description:
                        addrStreet2:
                          type: string
                          description:
                        addrCity:
                          type: string
                          description:
                        state:
                          type: object
                          description:
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            timezoneId:
                              type: string
                            abbr:
                              type: string
                        country:
                          type: object
                          description:
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        zip:
                          type: string
                          description:
                      required:
                        - id
                        - name
                        - updateDate
                        - updateDateMs
                        - organizationAdmin
                        - parentAdmin
                        - organizationEditor
              example:
                resultCode: 0
                organizations:
                  - id: 1
                    name: Care Daily Cloud
                    domainName: CDC
                    brand: care
                    updateDate: '2016-04-12T23:30:15Z'
                    updateDateMs: 1460503815000
                    organizationAdmin: true
                    parentAdmin: false
                    organizationEditor: false
                    features: g,p,m,c
                    deviceTypes: 123,124,125
                    termOfService: CDC.2023
                    addrStreet1: 123 Prospect St, Apt. 456
                    addrStreet2: ''
                    addrCity: Palo Alto
                    state:
                      id: 1
                      name: California
                      timezoneId: US/Pacific
                      abbr: CA
                    country:
                      id: 1
                      name: United States
                    zip: '12345'
                    locked: true
                  - id: 2
                    name: Customer Name
                    domainName: customer
                    parentId: 1
                    updateDate: '2016-04-12T23:30:15Z'
                    updateDateMs: 1460503815000
                    organizationAdmin: true
                    parentAdmin: true
                    organizationEditor: false
                    features: g,p,m
                    deviceTypes: 123,124,125
                    addrStreet1: Test address
                    addrStreet2: Test Address
                    addrCity: ''
                    state:
                      id: 5
                      name: California
                      timezoneId: US/Pacific
                      abbr: CA
                    country:
                      id: 1
                      name: United States
                    zip: '31300'

    post:
      summary: Create an Organization
      operationId: Create an Organization
      description: >-
        Organizations can be created inside other organizations by users with "organization administrator" permission in the parent organization.
        Users with both "access all" and "organization administrator" permissions can create top level organizations.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: The parent organization ID, where a sub-organization has to be created
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              organization:
                name: Care Daily
                domainName: caredaily.ai
                brand: presence
                features: g,p,m
                deviceTypes: 123,124,125
                termOfService: CDC.2023
                contactName1: Admin
                contactEmail1: admin@caredaily.ai
                contactPhone1: 123-456-7890
                contactName2: Manager
                contactEmail2: manager@caredaily.ai
                contactPhone2: 123-456-7890
                officePhone: 123-456-7890
                addrStreet1: 123 Prospect St, Apt. 456
                addrStreet2: ''
                addrCity: Palo Alto
                state:
                  id: 1
                country:
                  id: 1
                zip: '12345'
            schema:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    name:
                      type: string
                    domainName:
                      type: string
                    brand:
                      type: string
                    features:
                      type: string
                    deviceTypes:
                      type: string
                    termOfService:
                      type: string
                    timezone:
                      type: object
                      description: Default organization time zone
                      properties:
                        id:
                          type: string
                          description: Time zone ID
                    contactName1:
                      type: string
                    contactEmail1:
                      type: string
                    contactPhone1:
                      type: string
                    contactName2:
                      type: string
                    contactEmail2:
                      type: string
                    contactPhone2:
                      type: string
                    officePhone:
                      type: string
                    addrStreet1:
                      type: string
                    addrStreet2:
                      type: string
                    addrCity:
                      type: string
                    state:
                      type: object
                      properties:
                        id:
                          type: integer
                    country:
                      type: object
                      properties:
                        id:
                          type: integer
                    zip:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  organizationId:
                    type: integer
              example:
                resultCode: 0
                organizationId: 123

    put:
      summary: Update Organization
      operationId: Update Organization
      description: ''
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: The Organization ID to update
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              organization:
                name: Care Daily
                domainName: caredaily.ai
                brand: presence
                features: g,p,m
                deviceTypes: 123,124,125
                termOfService: CDC.2023
                contactName1: Admin
                contactEmail1: admin@caredaily.ai
                contactPhone1: 123-456-7890
                contactName2: Manager
                contactEmail2: manager@caredaily.ai
                contactPhone2: 123-456-7890
                officePhone: 123-456-7890
                addrStreet1: 123 Prospect St, Apt. 456
                addrStreet2: ''
                addrCity: Palo Alto
                state:
                  id: 1
                country:
                  id: 1
                zip: '12345'
            schema:
              type: object
              properties:
                organization:
                  type: object
                  properties:
                    name:
                      type: string
                    domainName:
                      type: string
                    brand:
                      type: string
                    features:
                      type: string
                    deviceTypes:
                      type: string
                    termOfService:
                      type: string
                    timezone:
                      type: object
                      description: Default organization time zone
                      properties:
                        id:
                          type: string
                          description: Time zone ID
                    contactName1:
                      type: string
                    contactEmail1:
                      type: string
                    contactPhone1:
                      type: string
                    contactName2:
                      type: string
                    contactEmail2:
                      type: string
                    contactPhone2:
                      type: string
                    officePhone:
                      type: string
                    addrStreet1:
                      type: string
                    addrStreet2:
                      type: string
                    addrCity:
                      type: string
                    state:
                      type: object
                      properties:
                        id:
                          type: integer
                    country:
                      type: object
                      properties:
                        id:
                          type: integer
                    zip:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    delete:
      summary: Delete Organization
      operationId: Delete Organization
      description: ''
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: The Organization ID to delete
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/organizations/{organizationId}/objects:
    get:
      summary: List Objects and Properties
      operationId: List Objects and Properties
      description: |-
        Retrieve all large objects and small properties by the organization.
        Anyone can call it.

        Private records are turned only for administrators.
      tags:
        - Organizations
      security:
        - userApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Objects and Properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  organizationObjects:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        contentType:
                          type: string
                        privateContent:
                          type: boolean
                        parent:
                          type: boolean
                        value:
                          type: string
                      required:
                        - name
                        - privateContent
                        - parent
              example:
                resultCode: 0
                organizationObjects:
                  - name: logo
                    contentType: image/png
                    privateContent: false
                    parent: false
                  - name: backgroundColour
                    privateContent: false
                    value: '777'
                    parent: true

    post:
      summary: Set Properties
      operationId: Set Properties
      description: |-
        Update organization property values.
        Only administrator can call it.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              organizationObjects:
                - name: backgroundColour
                  privateContent: false
                  value: '777'
            schema:
              type: object
              properties:
                organizationObjects:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      privateContent:
                        type: boolean
                      value:
                        type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/organizations/{organizationId}/objects/{objectName}:
    put:
      summary: Upload Large Object
      operationId: Upload Large Object
      description: |-
        These APIs allow to store large binary or text objects like images, videos and email templates for an organization.

        This API is only available to organization administrators or organization bots.

        The `Content-Type` header must be like `video/*`, `image/*`, `text/plain`, `application/octet-stream` or  `application/json`
        (see https://en.wikipedia.org/wiki/Internet_media_type for possible exact values).
        For example: `video/mp4`, `image/jpeg`, `audio/mp3`.

        The object content gets uploaded as a binary stream.
      tags:
        - Organizations
      security:
        - adminApiKey: []
        - botApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: objectName
          in: path
          description: Object name
          required: true
          schema:
            type: string
        - name: private
          in: query
          description: Set to true, if the object is private
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Object Content
      operationId: Get Object Content
      description: |-
        Return the previously uploaded object content.

        Private objects content is available only for organization administrators.
        Public objects content is available for any user.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: objectName
          in: path
          description: Object name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            image/png:
              example: |
                Object content

    delete:
      summary: Delete Object
      operationId: Delete Object
      description: ''
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: objectName
          in: path
          description: Object name
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/organizations/{organizationId}/secrets/{secretName}:
    put:
      summary: Put an Organization Secret
      operationId: Put Organization Secret
      description: >-
        Create or update an organization named secret value.
        The value will be stored encrypted.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: secretName
          in: path
          required: true
          description: Secret value name, maximum 50 characters.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              secretValue: ABC123
            schema:
              type: object
              properties:
                secretValue:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    delete:
      summary: Delete an Organization Secret
      operationId: Delete Organization Secret
      description: Delete an existing secret value.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: secretName
          in: path
          required: true
          description: Secret value name
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

  /admin/json/organizations/{organizationId}/secrets:
    get:
      summary: Get Organization Secret Names
      operationId: Get Organization Secret Names
      description: List all existing secret names
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Secret names
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  secretNames:
                    type: array
                    items:
                      type: string
              example:
                resultCode: 0
                secretNames:
                  - 'ABC123'
                  - 'DEF456'


  /admin/json/organizations/{organizationId}/notifications:
    post:
      summary: Test Organization Notifications
      operationId: Test notifications
      description: |-
        Request to generate possible common notifications including emails, SMS, push notifications.
        The API will return all notification texts in a zip archive.
      tags:
        - Organizations
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              brand: default
              template: account/user_registration.vm
              language: en
              model:
                key0: value0
                key1: value1
            schema:
              type: object
              properties:
                brand:
                  type: string
                  description: Brand to overwrite the organization's brand
                template:
                  type: string
                  description: Test the specific notification template
                language:
                  type: string
                  description: Generate notifications in specific language. Otherwise the user's language is used.
                model:
                  type: object
                  additionalProperties:
                    type: string
                  description: Notification template parameters key/value string map
      responses:
        '200':
          description: ZIP archive
        '404':
          description: Resource not found


  /admin/json/roles:
    get:
      summary: Get Roles
      operationId: Get Roles
      description: Returns administrative roles which can be granted to another user by an administrator.
      tags:
        - Administrators
      security:
        - adminApiKey: []
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Role's ID
                        name:
                          type: string
                          description: Role's name
                        description:
                          type: string
                        permissions:
                          type: array
                          description: Permissions granted to users with this role [user permissions](cloud.html#tag/User-Accounts/User-Permissions)
              example:
                resultCode: 0
                roles:
                  - id: 1
                    name: Organization Admininstrator
                    description: Standard organization permissions
                    permissions:
                      - 3
                      - 9
                  - id: 2
                    name: Super Admininstrator
                    description: Organization management permissions
                    permissions:
                      - 1
                      - 3
                      - 4
                      - 9


  /admin/json/users/{userId}/roles/{roleId}:
    put:
      summary: Grant Administrative Roles
      operationId: Grant Administrative Roles
      description: A role can be granted or revoked only by an administrator with a corresponding permission.
      tags:
        - Administrators
      security:
        - adminApiKey: []
      parameters:
        - name: userId
          in: path
          description: User ID to grant this role to
          required: true
          schema:
            type: string
        - name: roleId
          in: path
          description: The Role ID to grant. This is specified by the "Get Roles" API.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/users/{userId}/roles:
    delete:
      summary: Revoke Administrative Roles
      operationId: Revoke Administrative Roles
      description: ''
      tags:
        - Administrators
      security:
        - adminApiKey: []
      parameters:
        - name: userId
          in: path
          description: User ID for which to revoke administrative privileges
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /admin/json/organizations/{organizationId}/admins:
    get:
      summary: Get Administrators
      operationId: Get Administrators
      description: ''
      tags:
        - Administrators
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID to get administrators from
          required: true
          schema:
            type: integer
        - name: parents
          in: query
          description: Get administrators from parent organizations as well
          schema:
            type: boolean
      responses:
        '200':
          description: Administrators
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        userName:
                          type: string
                        altUsername:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        creationDate:
                          type: string
                        creationDateMs:
                          tile: integer
                        lastLoginDate:
                          type: string
                        lastLoginDateMs:
                          tile: integer
                        email:
                          type: object
                          properties:
                            email:
                              type: string
                            verified:
                              type: boolean
                            status:
                              type: integer
                        role:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            description:
                              type: string
              example:
                resultCode: 0
                users:
                  - id: 123
                    userName: john.smith@gmail.com
                    altUsername: '1234567890'
                    firstName: John
                    lastName: Smith
                    email:
                      email: john.smith@gmail.com
                      verified: true
                      status: 0
                    role:
                      id: 5
                      name: Organization administrator
                      description: Role description


  /admin/json/organizations/{organizationId}/admins/{userId}:
    put:
      summary: Add an Administrator
      operationId: Add an Administrator
      description: ''
      tags:
        - Administrators
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          description: Administrator user ID to add to this organization
          required: true
          schema:
            type: integer
        - name: brand
          in: query
          description: Notification brand
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    delete:
      summary: Remove Administrator
      operationId: Remove Administrator
      description: ''
      tags:
        - Administrators
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          description: User ID to remove from this organization
          required: true
          schema:
            type: integer
      responses:
