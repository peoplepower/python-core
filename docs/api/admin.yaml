  /admin/json/organizations/{organizationId}/challenges:
    post:
      summary: Create a Challenge
      operationId: Create a Challenge
      description: |-
        Create a challenge from scratch or from a template.
        
        In a community social network setting, an Engagement Manager may issue challenges to the community, to help achieve the overall goals of the community.
  
        Challenges are a really fun way to engage with a large population!
      tags:
        - Challenges
      security:
        - adminApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID to create this challenge for
          required: true
          schema:
            type: integer
        - name: check
          in: query
          description: >-
            <b>true</b> - Check if an active challenge already exists without creating one.<br>
            <b>false</b> - Do not check if an active challenge already exists, just create it, default.
          schema:
            type: boolean
        - name: parentId
          in: query
          description: Challenge or template ID to copy settings from.
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              challenge:
                name: DR event
                template: false
                startDate: '2014-08-01T00:00:00Z'
                endDate: '2014-10-15T12:00:00Z'
                challengeType: 4
                recurring: 0
                invitational: true
                deviceTypeExistance: 2
                deviceTypes:
                  - 10
                  - 20
                  - 30
                excludeDeviceTypes:
                  - 40
                participantType: 1
                participationStatus: 1
                participantTag: auto-opt-in
                excludeParticipantTag: inactive
                parameters:
                  name1: value1
                  name2: value2
            schema:
              type: object
              properties:
                challenge:
                  type: object
                  properties:
                    name:
                      type: string
                    template:
                      type: boolean
                      description: |-
                        `True` means the challenge is intended to be used as a template for creating new challenges. In this case, participants are not created.<br>
                        Optional, default is false.
                    startDate:
                      type: string
                    endDate:
                      type: string
                    challengeType:
                      type: integer
                      description: <b>4</b> - Demand response
                    recurring:
                      type: integer
                      description: |-
                        <b>0</b> - One-time, not recurring<br>
                        <b>3</b> - Recurring monthly
                    invitational:
                      type: boolean
                    deviceTypeExistance:
                      type: integer
                      description: |-
                        Optional, default is 0.<br>
                        <b>1</b> - ANY listed device type must exists on the participating location<br>
                        <b>2</b> - ALL device types must exist on the participating location
                    deviceTypes:
                      type: array
                      description: A list of device types to filter participants
                      items:
                        type: integer
                    excludeDeviceTypes:
                      type: array
                      description: Exclude locations having any of these devices from the challenge
                      items:
                        type: integer
                    participantType:
                      type: integer
                      description: <b>1</b> - Individual challenge
                    participationStatus:
                      type: integer
                      description: |-
                        Initial participation status for invited users.<br>
                        <b>1</b> - Not responded, default<br>
                        <b>2</b> - Opt-In<br>
                        <b>3</b> - Opt-Out
                    participantTag:
                      type: string
                      description: A tag value to filter participants.
                    excludeParticipantTag:
                      type: string
                      description: Exclude locations having this tag
                    parameters:
                      type: object
                      description: Parameters key/value string map
                      additionalProperties:
                        type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  challengeId:
                    type: integer
              example:
                resultCode: 0
                challengeId: 123

    get:
      summary: Get Challenges
      operationId: Get Challenges
      description: >-
        View a list of challenges selected by their parameters.
        Only admins can see the templates in the search results.
      tags:
        - Challenges
      security:
        - userApiKey: []
      parameters:
        - name: organizationId
          in: path
          description: Organization ID to retrieve challenges for
          required: true
          schema:
            type: integer
        - name: status
          in: query
          description: >-
            Optional status filter<br>
            <b>0</b> - Inactive<br>
            <b>1</b> - Active<br>
            <b>2</b> - Completed
          schema:
            type: integer
        - name: challengeId
          in: query
          description: Retrieve only this challenge
          schema:
            type: integer
        - name: challengeType
          in: query
          description: Filter response by challenge types. Multiple values are supported.
          schema:
            type: integer
        - name: searchBy
          in: query
          description: Search by name
          schema:
            type: string
        - name: parentId
          in: query
          description: Template ID to filter by
          schema:
            type: integer
      responses:
        '200':
          description: Challenges
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  challenges:
                    type: array
                    items:
                      type: object
                      properties:
                        challengeId:
                          type: integer
                        template:
                          type: boolean
                        parentId:
                          type: integer
                        name:
                          type: string
                        startDate:
                          type: string
                        startDateMs:
                          type: integer
                        challengeType:
                          type: integer
                        recurring:
                          type: integer
                        participantType:
                          type: integer
                        status:
                          type: integer
                        invitational:
                          type: boolean
                        deviceTypes:
                          type: array
                          items:
                            type: integer
                        deviceTypeExistance:
                          type: integer
                        participantTag:
                          type: string
                        excludeDeviceTypes:
                          type: array
                          items:
                            type: integer
                        excludeParticipantTag:
                          type: string
                        participantsIn:
                          type: integer
                        participantsOut:
                          type: integer
                        participantsNoResponse:
                          type: integer
                        parameters:
                          type: object
                          description: Parameters key/value string map
                          additionalProperties:
                            type: string
                        endDate:
                          type: string
                        endDateMs:
                          type: integer
                      required:
                        - challengeId
                        - name
                        - startDate
                        - startDateMs
                        - challengeType
                        - recurring
                        - status
                        - template
              example:
                resultCode: 0
                challenges:
                  - challengeId: 90
                    template: false
                    parentId: 50
                    name: DR event
                    startDate: '2014-08-14T22:23:10-04:00'
                    startDateMs: 1408069390000
                    challengeType: 4
                    recurring: 0
                    participantType: 1
                    status: 1
                    invitational: true
                    deviceTypes:
                      - 10
                      - 20
                      - 30
                    deviceTypeExistance: 2
                    participantTag: auto-opt-in
                    excludeDeviceTypes:
                      - 40
                    excludeParticipantTag: inactive
                    participantsIn: 60
                    participantsOut: 20
                    participantsNoResponse: 10
                    parameters:
                      name1: value1
                      name2: value2
                  - challengeId: 127
                    name: template
                    startDate: '2014-06-30T14:30:00-04:00'
                    startDateMs: 1404153000000
                    endDate: '2014-07-31T14:29:59-04:00'
                    endDateMs: 1406831399000
                    challengeType: 4
                    recurring: 0
                    participantType: 0
                    status: 2
                    template: true
                    parameters:
                      lowTemperature: 64F
                      highTemperature: 71F


