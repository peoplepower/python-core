    delete:
      summary: Delete Devices
      operationId: Delete Devices
      description: |-
        There are multiple ways to delete a device.
        This method is the most flexible, allowing multiple devices to be deleted simultaneously.

        Devices linked to a proxy will be removed from the proxy.
      tags:
        - Devices
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: query
          description: >-
            The Device ID to delete.
            You may include this parameter multiple times to delete multiple devices.
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Location ID where to delete devices
          required: true
          schema:
            type: integer
        - name: keepOnAccount
          in: query
          description: Send only the delete command to the gateway, but keep the device on the user account.
          schema:
            type: boolean
        - name: keepSlave
          in: query
          description: Delete only the gateway from the user account without removing slave devices.
          schema:
            type: boolean
        - name: keepSlaveOnGateway
          in: query
          description: Delete slave devices from the account only, but not delete them on the gateway.
          schema:
            type: boolean
        - name: clear
          in: query
          description: >-
            <b>true</b> - Delete the device from all previous locations and clear its current parameter values, but don't delete its history.
            <br><b>false</b> - Do not remove the device from previous locations and do not clear its current parameters when deleting it
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


