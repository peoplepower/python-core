  /cloud/json/stories:
    put:
      summary: Put Stories
      operationId: Put Stories
      description: |-
        Insert new stories or update existing stories.
        
        ### Story Types

        | ID  | Name | Description |
        | :-: | ---- | ----------- |
        |  1 | OOBE Connect Device | The initial part of the add device OOBE. |
        |  2 | OOBE Device Connection Success | Displayed when a device successfully connected to the cloud, or the second part of OOBE. |
        |  3 | OOBE Device Connection Fail | Displayed when a device fails to connect or it takes too long for connection. |
        |  4 | OOBE Device Installation Help | How to install your device, it should shows after you’ve done standard wizard. The third part of OOBE. |
        |  5 | Paid Service | How-to setup and what you've got with paid service plans. |
        |  6 | Scenarios | Device goals. |
        |  7 | Promotions | Marketing information that can shows up in app. |
        |  8 | Device Bundles | Collection of device OOBEs organized into a single story |
        | 10 | Bots | Bot microservices stories. |
        | 11 | Device Reconnection: random disconnect | Troubleshooting if something goes wrong with device connection. |
        | 12 | Device Reconnection: battery | Troubleshooting if the battery is dead and the device is now disconnected. |
        | 13 | Device Reconnection: wireless signal | Troubleshooting if the wireless signal strength was bad and the device is now disconnected. |
        | 20 | OAuth success |  |
        | 21 | OAuth failure |  |
        | 30 | FAQ |  |
        | 40 | Terms of Services |  |
        | 41 | Privacy Policy |  |
        | 42 | Monitoring Services |  |
        | 43 | Cookie Policy |  |
        | 44 | Manufacturer and Developer Terms and Conditions | |
        | 50 | About |  |

        ### Action Types

        | ID  | Description |
        | :-: | ----------- |
        | 1 | Link to another story |
        | 2 | In-app link |
        | 3 | Make Photo |
        | 4 | Record Audio |
        | 5 | Open Contacts |
        | 6 | Configure WiFi |
        | 7 | Contact Support |
        | 8 | Open QR code scanner |

        ### Action Styles

        | ID  | Name |
        | :-: | ---- |
        | 1 | Button |
        | 2 | Link |

        ### Hash

        An optional hash value field contains the story hash value calculated by the client.
        If it is set, the server will not update the existing story, if the value is not changed.
