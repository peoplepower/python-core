  /cloud/json/emailVerificationMessage:
    get:
      summary: Send Verification Message
      operationId: Send Verification Message
      description: |-
        Send an email or an SMS to the user containing a link to a temporary page which is valid for one day and/or a verification code,
        to verify the email address or if this phone number able to receive SMS.
        When the user clicks on that link, the email address is marked as verified and the user is forwarded to a success page.
        If the link is expired, the user is forwarded to an error page.

        By default, the Care Daily AI Platform will use a Customer's specific email template based on the preferable user organization.
        This customization can be overwritten by the brand parameter.
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: type
          in: query
          description: 'Message type: 0 - email, 2 - SMS'
          required: true
          schema:
            type: integer
        - name: brand
          in: query
          description: A parameter identifying a Customer's specific email template, among other customization settings
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    put:
      summary: Provide Verification Code
      operationId: Provide Verification Code
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: code
          in: query
          description: Code sent to the user in email or SMS
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: 'Code type: 0 - email, 2 - SMS'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/newPassword:
    put:
      summary: Update Password
      operationId: Update Password
      description: |-
        The app calls this API to submit a new password, if the user has the password already.

        To change the password an end users must provide either a temporary API key sent by email after calling the recover password API
        or a regular user API key and the old password together.
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: brand
          in: query
          description: A parameter identifying a customer's specific notification template
          schema:
            type: string
        - name: strongPassword
          in: query
          description: Check if the password is strong
          schema:
            type: boolean
        - name: keepKeyVersion
          in: query
          description: Keep the current user API key version to keep previously generated API keys active
          schema:
            type: boolean
      requestBody:
        content:
          application/json:
            example:
              oldPassword: old user password
              newPassword: new user password
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                  description: current user's password
                newPassword:
                  type: string
                  description: new user's password
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Recover Password
      operationId: Recover Password
      description: |-
        If a user forgot his password or does not have one, this API can be used to recover user's password.

        The API will send an email to the user containing a temporary link, which is valid for the next hour, to the reset password page.
        When the user clicks on that link the web page is launched.
        After verification of token, the page shall allow the user to set a new password.
        The user must have a valid email address.

        By default, the IoT Software Suit will use a customer's specific email template based on the brand or preferable user organization.
      tags:
        - User Accounts
      parameters:
        - name: username
          in: query
          description: The username, which is typically the user's email address
          required: true
          schema:
            type: string
        - name: brand
          in: query
          description: A parameter identifying a customer's specific email template
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/badges:
    put:
      summary: Reset Badges
      operationId: Reset Badges
      description: |-
        A **badge** is a red number that appears over an app's icon, indicating to the user that the app has something new to share.
        Like a ringtone alerts a person to pick up the phone, a badge alerts users to open the app.

        <div><img src="https://i.imgur.com/NcGVkzz.jpg"></div>

        In a normal scenario, the Care Daily AI Platform will send a push notification to the user's apps to automatically place a badge on top of the app's icon(s).
        The total badge counts can be manually obtain from the /user GET API.
        It is the app's responsibility to clear its own local badges, and to alert the server to reset the badge counter when the user finally responds.

        Badge types:

        | Type | Description |
        | :--: | ----------- |
        | 3 | Motion detection device alert |
        | 6 | Community |
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: type
          in: query
          description: |-
            If this is not provided, all badge counts will be reset.
            <br><b>1</b> - Reset message badges
            <br><b>2</b> - Reset challenge badges
            <br><b>3</b> - Reset Video Alert badges
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/termsOfServices/{signatureId}:
    put:
      summary: Sign Terms of Service
      operationId: Sign Terms of Service
      description: |-
        The Care Daily AI Platform permanently documents each Agreement signed by a user.
        Typically, these agreements represent Terms of Service and Privacy Policies required to gain access to the rest of the system.
        They may also document consent from the user to activate a certain feature inside the system.
        
        Each version of each Terms of Service Agreement is represented by a unique signature ID.
        It is the owner's responsibility to maintain copies of the text found in the original agreement and the unique signature ID that represents it, for legal purposes.
        
        In a real world production app, we use a System Property to document the most recent agreement signature ID that needs to be signed.
        We use these "Terms of Service" APIs to determine if the user has previously agreed.
        If the user has never agreed, then we force them to review the new Terms of Service and tap Agree to continue.
        After agreeing, the agreement signature is permanently added to the user's account.
        
        We recommend selecting agreement signature strings of the format `{appName}_{agreement version number}` or `{appName}_{feature}_{agreement version number}`.
        
        This API adds a unique signature identifier to the list of agreements the user has signed.
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: signatureId
          in: path
          description: Terms of service ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/termsOfServices:
    get:
      summary: Get Terms Of Service Signatures
      operationId: Get Terms of Service Signatures
      description: Retrieve all Terms of Service agreement signature identifiers to which the user has previously agreed.
      tags:
        - User Accounts
      security:
        - userApiKey: []
      parameters:
        - name: signatureId
          in: query
          description: Filter by terms of service ID
          schema:
            type: string
      responses:
        '200':
          description: Terms Of Services
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  termsOfServices:
                    type: array
                    items:
                      type: string
              example:
                resultCode: 0
                termsOfServices:
                  - Care_1.0.1
                  - Care_1.1
                  - YourApp_2


