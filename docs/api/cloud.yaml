  /cloud/json/filesSummary/{aggregation}:
    get:
      summary: Get Summary of Device Files
      operationId: Get Summary of Device Files
      description: |-
        Users can collect a massive list of files. Even the plain text to describe these files can sometimes be megabytes long.
        This API helps describe what files exist on the server, so the user can drill into the data without downloading everything all at once.

        If is highly recommended to call this API first and then use received information to obtain files list for specific time period.

        In some cases even files summary data can be very long.
        So it is recommended to use optional `startDate` and `endDate` parameters.
        By default `endDate` is set to the creation time of the last uploaded user file.
        If `startDate` is not provided, it will be estimated by the cloud according to the aggregation to provide better API performance.

        This API will return a summary of files grouped by files creation date in descending order by default,
        providing summary information for the files within each aggregation period (day, week, month, etc.).

        For better API performance request only own user files information with aggregation by days without details and for limited time period.
      tags:
        - Device Files
      security:
        - userApiKey: []
      parameters:
        - name: aggregation
          in: path
          description: >-
            The duration of time across which to aggregate summary information
            <br><b>1</b> - hour
            <br><b>2</b> - day
            <br><b>3</b> - month
            <br><b>4</b> - 7-day week from Sunday to Saturday
          required: true
          schema:
            type: integer
        - name: locationId
          in: query
          description: Files location ID
          required: true
          schema:
            type: integer
        - name: details
          in: query
          description: >-
            If true, the API will return detailed information - slow.
            <br>Otherwise only total number of files will be returned.
          schema:
            type: boolean
        - name: timeZone
          in: query
          description: >-
            Time zone ID to separate aggregated summary information.
            <br>For example, `America/Los_Angeles`.
          schema:
            type: string
        - name: type
          in: query
          description: >-
            Filter by type of file.
            <br><b>0</b> - any file
            <br><b>1</b> - videos only
            <br><b>2</b> - images only
            <br><b>3</b> - audio only
            <br><b>4</b> - bitmaps only
          schema:
            type: integer
        - name: startDate
          in: query
          description: Start date for which to begin returning aggregate summary information on the user's files
          schema:
            type: string
        - name: endDate
          in: query
          description: End date for which to stop returning aggregate summary information on the user's files
          schema:
            type: string
      responses:
        '200':
          description: Files summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  totalFilesSpace:
                    type: integer
                    description: The total space in the user's account for files in bytes.
                  usedFilesSpace:
                    type: integer
                    description: The space in the user's account that has already been consumed in bytes.
                  filesCount:
                    type: integer
                    description: Number of files
                  startDate:
                    type: string
                    description: Date when first file uploaded
                  startDateMs:
                    type: integer
                  endDate:
                    type: string
                    description: Date when last file uploaded
                  endDateMs:
                    type: integer
                  summaries:
                    type: array
                    description: Information for the files within each aggregation period
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: The beginning of an aggregation period
                        dateMs:
                          type: integer
                        total:
                          type: integer
                          description: Number of files
                        deleted:
                          type: integer
                          description: Number of deleted files
                        size:
                          type: integer
                          description: Total files size in bytes, if details requested
                        duration:
                          type: integer
                          description: Total files duration, if details requested
                        viewed:
                          type: integer
                          description: Number of viewed files, if details requested
                        favourite:
                          type: integer
                          description: Number of favourite files, if details requested
                      required:
                        - date
                        - dateMs
                        - total
                        - deleted
              example:
                resultCode: 0
                totalFilesSpace: 10485760
                usedFilesSpace: 1043858
                filesCount: 36
                startDate: '2014-02-01T00:00:00-08:00'
                startDateMs: 1391241600000
                endDate: '2014-02-03T00:00:00-08:00'
                endDateMs: 1391414400000
                summaries:
                  - date: '2014-02-03T00:00:00-08:00'
                    dateMs: 1391414400000
                    total: 14
                    deleted: 0
                    size: 7000000
                    duration: 70
                    viewed: 7
                    favourite: 0
                  - date: '2014-02-02T00:00:00-08:00'
                    dateMs: 1391328000000
                    total: 12
                    deleted: 3
                    size: 6000000
                    duration: 60
                    viewed: 6
                    favourite: 2
                  - date: '2014-02-01T00:00:00-08:00'
                    dateMs: 1391241600000
                    total: 10
                    deleted: 1
                    size: 5000000
                    duration: 50
                    viewed: 5
                    favourite: 4


