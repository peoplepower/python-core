  /cloud/json/notificationSubscriptions:
    get:
      summary: Get Notification Subscriptions
      operationId: Get Notification Subscriptions
      tags:
        - User Communications
      description: |-
        A user may subscribe or unsubscribe from certain types of push and email notifications,
        or set boundaries on how many notifications their account can receive within a specified amount of time.

        The Care Daily AI Platform supports following notification types:

        | Type | Description | Transport | Configurable | Location |
        | :--: | ----------- | :-------: | :----------: | :------: |
        |  0 | Unsubscribe from all | Email Push SMS | * |  |
        |  1 | Marketing emails | Email | * |  |
        |  3 | Rules| Email Push |  |  |
        |  4 | Bots | Email Push SMS | * | * |
        |  6 | Account creation follow up | Email |  |  |
        |  7 | Device alerts | Email Push | * | * |
        |  8 | Apps | Email Push | * | * |
        | 10 | New device added | Push |  |  |
        | 11 | Account issues | Push |  |  |
        | 13 | OAuth client | Email Push | * | * |
        | 15 | Adding circle members | Email Push |  |  |
        | 16 | Device firmware update | Push |  |  |
        | 17 | SMS chat | Push SMS |  |  |
        | 18 | Location messages | SMS |  |  |
        | 19 | Bot errors to developers | Email | * |  |
        | 20 | App badge change | Push |  |  |
        | 21 | Community event reminder | Push | * |  |
        | 22 | Bot reports | Email Push SMS | * | * |
        | 23 | Messages | Email Push SMS | * | * |
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: userId
          in: query
          description: User ID for bots and administrators
          schema:
            type: integer
      responses:
        '200':
          description: Notification Subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: integer
                          description: Notification type
                        name:
                          type: string
                          description: Notification type name
                        locationId:
                          type: integer
                          description: Subscription related location ID
                        email:
                          type: boolean
                          description: Notifications by email enabled
                        push:
                          type: boolean
                          description: Push notifications enabled
                        sms:
                          type: boolean
                          description: Notifications by SMS enabled
                        emailPeriod:
                          type: integer
                          description: How long to wait between emails in seconds
                        pushPeriod:
                          type: integer
                          description: How long to wait between push notifications in seconds
                      required:
                        - type
                        - email
                        - push
                        - sms
              example:
                resultCode: 0
                subscriptions:
                  - type: 0
                    locationId: 0
                    email: true
                    push: true
                    sms: false
                    name: All
                    emailPeriod: 0
                    pushPeriod: 0
                  - type: 6
                    locationId: 0
                    email: false
                    push: false
                    sms: false
                    name: Registration follow up
                    emailPeriod: 0
                    pushPeriod: 0
                  - type: 7
                    locationId: 123
                    email: true
                    push: true
                    sms: false
                    name: Device alerts
                    emailPeriod: 0
                    pushPeriod: 0
                  - type: 8
                    locationId: 123
                    email: true
                    push: true
                    sms: false
                    name: Analytics and external
                    emailPeriod: 0
                    pushPeriod: 0


