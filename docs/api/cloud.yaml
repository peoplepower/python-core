                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        lastDataReceivedDate:
                          type: string
                        lastDataReceivedDateMs:
                          type: integer
                        lastMeasureDate:
                          type: string
                        lastMeasureDateMs:
                          type: integer
                        parameters:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              value:
                                type: string
                              lastUpdateTime:
                                type: string
