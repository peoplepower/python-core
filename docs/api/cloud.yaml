  /cloud/json/dataRequests:
    post:
      summary: Submit Data Request
      operationId: Submit Data Request
      description: |-
        Selecting large amount of data from the database can take significant time.
        To avoid this long waiting period a user can submit requests for all data to the server asynchronously.
        When the requests will be completed, the user will be notified by email.

        Selected data will be uploaded to S3 in CSV format (compressed) and stored for one day.
        Links to download the data files will be sent by email by the user's request.
        Otherwise, they can be received by calling the get data API.

        Following data types are available for requesting:

        | Type | Details |
        | :--: | :------ |
        | 1 | Device parameters history |
        | 2 | Device activities history |
        | 3 | Organization locations |
        | 4 | Location modes history |
        | 5 | Location narratives |
        | 6 | Organization devices |
        | 7 | Data streams |
        | 8 | Energy usage |
        | 9 | Device alerts history |
      tags:
        - Device Measurements
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Request information from specific location
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              brand: care
              byEmail: true
              dataRequests:
                - type: 1
                  key: Front door history
                  deviceId: ABC123
                  startTime: 1446537883000
                  endTime: 1456537883000
                  paramNames:
                    - doorStatus
                  index: '0'
                  ordered: 1
                  compression: 1
            schema:
              type: object
              properties:
                brand:
                  type: string
                  description: Notification brand
                byEmail:
                  type: boolean
                  description: Notify the user by email, when the request completed.
                dataRequests:
                  type: array
                  description: Data requests
                  items:
                    type: object
                    properties:
                      type:
                        type: integer
                        description: Data type
                      key:
                        type: string
                        description: Optional request key
                      deviceId:
                        type: string
                        description: Device ID required for data types 1,2,8,9
                      startTime:
                        type: integer
                        description: Period start time in milliseconds required for data types 1,2,5,7,8,9
                      endTime:
                        type: integer
                        description: Period end time in milliseconds required for data types 1,2,5,7,8,9
                      paramNames:
                        type: array
                        description: Device parameter names optional for data type 1
                        items:
                          type: string
                      index:
                        type: string
                        description: Device part index optional for data type 1
                      organizationId:
                        type: integer
                        description: Organization ID required for data types 3,6
                      searchBy:
                        type: string
                        description: Search string optional for data type 3. Use '*' for wildcard.
                      locationTags:
                        type: array
                        description: Location search tags optional for data type 3
                        items:
                          type: string
                      deviceTags:
                        type: array
                        description: Device search tags optional for data type 3
                        items:
                          type: string
                      deviceTypes:
                        type: array
                        description: Device search types optional for data types 3,6
                        items:
                          type: integer
                      aggregation:
                        type: integer
                        description: Data aggregation by:<br>0 = None<br>1 = Hours<br>2 = Days<br>3 = Months<br>4 = 7-day weeks<br>5 = 5-day weeks<br>required for data type 8
                      ordered:
                        type: integer
                        description: Order data by timestamp<br>1 = ASC<br>-1 = DESC<br>optional for data types 1,2,4,5,9
                      compression:
                        type: integer
                        description: Data compression<br>0 = LZ4, default<br>1 = ZIP<br>2 = none
                    required:
                      - type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Requested Data
      operationId: Get Requested Data
      description: Completed data requests can be retrieved by calling this API.
      tags:
        - Device Measurements
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Organization ID
          schema:
            type: integer
        - name: requestKey
          in: query
          description: Filter by data request key
          schema:
            type: string
      responses:
        '200':
          description: Data requests history
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: integer
                          description: Data request type
                        key:
                          type: string
                          description: Request key
                        url:
                          type: string
                          description: Data download URL
                        completionDate:
                          type: string
                          description: Request completion date
                        completionDateMs:
                          type: integer
                        expiryDate:
                          type: string
                          description: Data URL expiry date
                        expiryDateMs:
                          type: integer
                        deviceId:
                          type: string
                          description: Requested data device ID
                        startDate:
                          type: string
                          description: Requested data start date
                        startDateMs:
                          type: integer
                        endDate:
                          type: string
                          description: Requested data end date
                        endDateMs:
                          type: integer
              example:
                resultCode: 0
                results:
                  - type: 1
                    key: Front door history
                    url: >-
                      https://s3.amazonaws.com/bucket/fileId?X-Amz-Algorithm=AWS4-HMAC-SHA256
                    completionDate: '2019-04-08T12:13:14Z'
                    completionDateMs: 1456537883000
                    expiryDate: '2019-04-09T12:13:14Z'
                    expiryDateMs: 1456557883000
                    deviceId: ABC123
                    startDate: '2010-01-01T00:00:00Z'
                    startDateMs: 1446537883000
                    endDate: '2020-01-01T00:00:00Z'
                    endDateMs: 1646537883000


