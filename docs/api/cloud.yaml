  /cloud/json/devicemodels:
    get:
      summary: Get Device Models
      operationId: Get Device Models
      description: |-
        The API returns device categories and models for specific brand.
        If the brand parameter is not set, data for the default brand is returned.

        Categories can be organized in hierarchies.

        ### Pairing Types

        | Value | Description |
        | :---: | ----------- |
        | 1 | QR code scan |
        | 2 | Native |
        | 4 | OAuth 2.0 |
        | 8 | ZigBee |
        | 16 | Wi-Fi |
        | 32 | Generate QR code<br>Use get device activation info API |

        ### Lookup Parameters

        The server device processing algorithm will try to locate the device model by the device type and input parameters.
        If the model is found, the model ID will be set in the device instance.
        The user can manually change the model ID by calling the update device instance API.

        If multiple models are available, the server will choose one, which has the most parameter matches.
        Parameter names are compared for equality. Values are compared with the LIKE operator. The '%' character is used as a wildcard.
        If the value is set to `ANY`, it is not compared, but has the lowest priority.

        ### Hash

        An optional hash value field contains a device model or a category hash value calculated by the client.
        If it is set, the server will not update an existing device model or category, if the value is not changed.
      tags:
        - Products Management
      parameters:
        - name: brand
          in: query
          description: Get text data for specific brand, otherwise data for default brand returned
          schema:
            type: string
        - name: lang
          in: query
          description: |-
            Get text data for specific languages (support for multiple values),
            otherwise data for all languages returned.
          schema:
            type: string
        - name: hidden
          in: query
          description: Request hidden categories and brand, which are not returned by default
          schema:
            type: boolean
        - name: searchBy
          in: query
          description: Search criterion. Use * for a wildcard.
          schema:
            type: string
        - name: includePairingType
          in: query
          description: Filter models by pairing type bitmask.
          schema:
            type: integer
        - name: excludePairingType
          in: query
          description: Exclude models by pairing type bitmask.
          schema:
            type: integer
        - name: modelId
          in: query
          description: Select specific device model by ID
          schema:
            type: string
      responses:
        '200':
          description: Device Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique string category ID
                        hash:
                          type: string
                        icon:
                          type: string
                          description: Icon name
                        search:
                          type: string
                          description: Search tags
                        parentId:
                          type: string
                          description: Reference to the top category (brand dependent)
                        hidden:
                          type: boolean
                          description: Hidden category (brand dependent)
                        sortId:
                          type: integer
                          description: Ordering ID (brand dependent)
                        name:
                          type: object
                          additionalProperties:
                            type: string
                          description: Multilingual name string map, brand dependent
                        desc:
                          type: object
                          additionalProperties:
                            type: string
                          description: Multilingual description string map, brand dependent
                        models:
                          type: array
                          description: Device models related to this category
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique string model ID
                              hash:
                                type: string
                              manufacturer:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Multilingual manufacturer name string map
                              pairingType:
                                type: integer
                                description: Pairing type
                              oauthAppId:
                                type: integer
                                description: OAuth 2.0 application ID
                              dependencyDeviceTypes:
                                type: array
                                description: One device of these device types must be on an account before registering this model.
                                items:
                                  type: integer
                              hidden:
                                type: boolean
                                description: Hidden model (brand dependent)
                              sortId:
                                type: integer
                                description: Ordering ID (brand dependent)
                              name:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Multilingual model name string map, brand dependent
                              desc:
                                type: object
                                additionalProperties:
                                  type: string
                                description: Multilingual model description string map, brand dependent
                              template:
