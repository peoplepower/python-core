  /espapi/oauth/authorize/{brand}:
    get:
      summary: Authorize a Third-Party Application
      operationId: Authorize a Third-Party Application
      description: |-
        OAuth allows the Care Daily AI Platform to act as a client or a host for a third-party application.
  
        As a host, the Care Daily AI Platform provides authorization information to third party applications using the OAuth 2.0 open standard.        
        
        This endpoint begins the process of authorizing a third-party application (the client) to access the user's data.
        The client has to redirect the user to this HTTP GET URL.
        The request will be processed in the following steps:

        1. The user is redirected to the Care Daily login web page, where he or she has to enter his or her username and password.

        2. After successful authentication, the user is redirected to the approval page, where he or she has to allow or deny the client access to data.

        3. From the approval page, the user is redirected to the Care Daily AI Platform approval URL.

        4. The Care Daily AI Platform redirects the user to the third-party callback URL with an authorization or error code.

        Each client has to be registered in Care Daily before requesting authorization.
        The registration information includes the client ID, secret, and the callback URL.

        At the end of this process, the user will be redirected to the callback URL (HTTP Status Code 303, see Other) with the following query parameters:

        | Parameter | Type | Details |
        | --------- | :--: | ------- |
        | state | string | The same client state value as the input parameter |
        | code | string | The authorization code, if the process was successful |
        | error | string | The authorization error code, if the process was unsuccessful.<br><b>access_denied</b><br><b>unsupported_response_type</b><br><b>server_error</b> |

        The application has to GET the Access Token with a separate API call to access data from the Care Daily AI Platform.

        You may find the list of authorized third-party apps in the /user GET information API.
      tags:
        - Clouds Integration
      parameters:
        - name: brand
          in: path
          description: Brand
          required: true
          schema:
            type: string
        - name: client_id
          in: query
          description: OAuth Client ID
          required: true
          schema:
            type: string
        - name: response_type
          in: query
          description: OAuth 2 response type. The "code" response type is the only one currently supported.
          required: true
          schema:
            type: string
        - name: state
          in: query
          description: The client's state which will be returned in the callback URL.
          schema:
            type: string
      responses:
        '303':
          description: Redirect to the web page to login to the Care Daily AI Platform
          headers:
            Location:
              schema:
                type: string
                description: Redirect URL


