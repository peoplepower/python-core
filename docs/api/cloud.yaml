  /cloud/json/locations/{locationId}/narratives:
    put:
      summary: Create or Update a Narrative
      operationId: Create or Update a Narrative
      description: |-
        Narratives are time-series auditable records that log human-readable events from a location.
        They are typically used to enable Explainable AI, and record exactly what happened at what time in a home or business.
        Narratives can include arbitrary JSON content underneath the human-visible layer to enable debugging and analytics.
        
        Friends and family who can switch into and view your location should be able to see your narrative.
        
        Administrators should also be able to access your narrative in Maestro for debugging / understanding / explanation of "why did that happen in my home?" purposes.

        | Status | Description |
        | :----: | ----------- |
        | 0 | Default initial |
        | 1 | Deleted |
        | ... | Any other value |

        | Type | Description |
        | :--: | ----------- |
        | 0 | High-frequency time-series "observations", default |
        | 1 | Deleted user (organization) |
        | 2 | Deleted location (organization) |
        | 3 | Moved location (organization) |
        | 4 | Low-frequency time-series "journal" |
        | 5 | Insight |
        | 6 | Support Ticket |

        Narrative time is always truncated to seconds by the API.

        When a new narrative is created, the API returns the new record ID and `narrativeTime` in milliseconds.

        To update an existing narrative record both `narrativeId` and `narrativeTime` query parameters must be provided.
        The new value of `narrativeTime` in milliseconds will be returned, if it has been changed.
      tags:
        - Locations
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: scope
          in: query
          description: Scope:<br>1 = location,<br>2 = organization
          required: true
          schema:
            type: integer
        - name: publish
          in: query
          description: Publish narrative to subscribers, default is true
          schema:
            type: integer
        - name: narrativeId
          in: query
          description: ID of narrative for update
          schema:
            type: integer
        - name: narrativeTime
          in: query
          description: narrative time as returned from the API for update
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              narrative:
                narrativeTime: 1537692964000
                priority: 1
                status: 0
                narrativeType: 0
                eventType: thermostat
                icon: icon.gif
                iconFont: icon.font
                title: Water Leak
                description: Water leak in the bathroom
                target:
                  fileIDs:
                    - 1234
                    - 2366
                  field: value
            schema:
              type: object
              properties:
                narrative:
                  type: object
                  properties:
                    narrativeTime:
                      type: integer
                      description: Narrative time in milliseconds for a new record
                    parentId:
                      type: integer
                      description: Parent narrative ID
                    parentNarrativeTime:
                      type: integer
                      description: Parent narrative time in milliseconds
                    priority:
                      type: integer
                    status:
                      type: integer
                    narrativeType:
                      type: integer
                    eventType:
                      type: string
                    icon:
                      type: string
                    iconFont:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    target:
                      type: object
                      description: Flexible sructure object
      responses:
        '200':
          description: New narrative ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  narrativeId:
                    type: integer
                  narrativeTime:
                    type: integer
              example:
                resultCode: 0
                narrativeId: 123
                narrativeTime: 1537692964000

    get:
      summary: Get Narratives
      operationId: Get Narratives
      description: |-
        The search results are organized by "pages". 
        Each page contains a set of elements sorted by the `narrativeTime` in  descending order.
        The pages follow one another in reverse chronological order.

        The rowCount parameter specifies the maximum number of elements per page.
        The result may include the `nextMarker` property - this means that there are more pages for the current search criteria. 
        To get the next page, the value of `nextMarker` must be passed to the `pageMarker` parameter on the next API call.
      tags:
        - Locations
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: rowCount
          in: query
          description: Maximum number of elements per page
          schema:
            type: integer
        - name: narrativeId
          in: query
          description: Filter by ID
          schema:
            type: integer
        - name: narrativeTime
          in: query
          description: Specific narrative time
          schema:
            type: integer
        - name: parentId
          in: query
          description: Filter by parent ID
          schema:
            type: integer
        - name: narrativeType
          in: query
          description: Filter by narrative type, multiple values
          schema:
            type: integer
        - name: scope
          in: query
          description: Scope:<br>1 = location, default,<br>2 = organization, for bots only
          schema:
            type: integer
        - name: priority
          in: query
          description: Filter by priority higher or equal than that
          schema:
            type: integer
        - name: toPriority
          in: query
          description: Filter by priority less or equal than that
          schema:
            type: integer
        - name: status
          in: query
          description: Filter by status, deleted are not returned by default
          schema:
            type: integer
        - name: eventType
          in: query
          description: Filter by event type
          schema:
            type: string
        - name: searchBy
          in: query
          description: Filter by title or description. Use * for a wildcard.
          schema:
            type: string
        - name: startDate
          in: query
          description: Narrative date range start
          schema:
            type: string
        - name: endDate
          in: query
          description: Narrative date range end
          schema:
            type: string
        - name: pageMarker
          in: query
          description: Marker to the next page
          schema:
            type: string
      responses:
        '200':
          description: Narratives
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  nextMarker:
                    type: string
                    description: Pass it to the `pageMarker` parameter on the next API call
                  narratives:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        locationId:
                          type: integer
                        narrativeDate:
                          type: string
                        narrativeDateMs:
                          type: integer
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                        narrativeType:
                          type: integer
                        priority:
                          type: integer
                        status:
                          type: integer
                        icon:
                          type: string
                        title:
                          type: string
                        description:
                          type: string
                        target:
                          type: object
                          description: Flexible structure object
                        appInstanceId:
                          type: integer
                          description: Bot instance ID, which created this record
                        iconFont:
                          type: string
                      required:
                        - id
                        - locationId
                        - narrativeDate
                        - narrativeDateMs
                        - creationDate
                        - creationDateMs
                        - narrativeType
                        - priority
                        - status
              example:
                resultCode: 0
                nextMarker: 16611d93630-306b
                narratives:
                  - id: 20
                    locationId: 1
                    narrativeDate: '2018-10-01T03:05:07'
                    narrativeDateMs: 1537692964000
                    creationDate: '2018-10-01T03:05:07'
                    creationDateMs: 1537692964000
                    narrativeType: 0
                    priority: 3
                    status: 0
                    icon: alert.gif
                    title: Water Leak
                    description: Water leak in the bathroom
                    target:
                      field: value
                    appInstanceId: 520
                  - id: 19
                    locationId: 1
                    narrativeDate: '2018-10-01T03:05:07'
                    narrativeDateMs: 1537692964000
                    creationDate: '2018-10-01T03:05:07'
                    creationDateMs: 1537692964000
                    narrativeType: 0
                    priority: 1
                    status: 2
                    icon: icon4
                    iconFont: icon.font
                    title: Left the house
                    description: Left the house
                    target:
                      field: value
                    appInstanceId: 520

    delete:
      summary: Delete a Narrative
      operationId: Delete a Narrative
      description: ''
      tags:
        - Locations
      security:
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: scope
          in: query
          description: Scope:<br>1 = location,<br>2 = organization
          required: true
          schema:
            type: integer
        - name: narrativeId
          in: query
          description: ID of narrative to delete
          required: true
          schema:
            type: integer
        - name: narrativeTime
          in: query
          description: narrative time in milliseconds
          required: true
          schema:
            type: integer
        - name: publish
          in: query
          description: Publish narrative to subscribers, default is true
          schema:
            type: boolean
        - name: eventType
          in: query
          description: Publishing event type
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


