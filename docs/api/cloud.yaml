                        lastUpdateTimeMs: 1403293631000
                      - name: status
                        lastUpdateTime: '2014-06-20T12:47:11-07:00'
                        lastUpdateTimeMs: 1403293631000
                  - id: moss-outlet
                    lastDataReceivedDate: '2014-06-20T12:47:11-07:00'
                    lastMeasureDate: '2014-06-20T12:47:11-07:00'
                    parameters:
                      - name: model
                        value: Hello World!
                        lastUpdateTime: '2014-06-20T12:47:11-07:00'
                        lastUpdateTimeMs: 1403293631000
                      - name: outletStatus
                        index: '0'
                        value: 'ON'
                        lastUpdateTime: '2014-06-20T12:47:11-07:00'
                        lastUpdateTimeMs: 1403293631000
                      - name: power
                        index: '0'
                        value: '10'
                        lastUpdateTime: '2014-06-20T12:47:11-07:00'
                        lastUpdateTimeMs: 1403293631000

    put:
      summary: Send Commands
      operationId: Send Commands
      description: |-
        This API allows to send commands to multiple devices simultaneously.

        This operation is not atomic. It will try to execute all commands in the same order, as they are provided.
        If some command fails, it will execute the next one. The result code is returned for each command.
      tags:
        - Device Measurements
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Devices location ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              devices:
                - deviceId: ABC123
                  commandType: 0
                  commandTimeout: 15000
                  params:
                    - name: outletStatus
                      index: '0'
                      value: '1'
                    - name: ppc.lowPowerMode
                      value: '0'
                  comment: Why this command has been sent
            schema:
              type: object
              properties:
                devices:
                  type: array
                  items:
                    type: object
                    properties:
                      deviceId:
                        type: string
                        description: Device ID
                      commandType:
                        type: integer
                        description: Optional command type, default is 0
                      commandTimeout:
                        type: integer
                        description: Optional command timeout in milliseconds from the creation time
                      comment:
                        type: string
                        description: Comment describes, why this command was made
                      params:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Configured parameter name
                            index:
                              type: string
                              description: Device part index is needed, if the device interprets or expects an index value
                            value:
                              type: string
                              description: New parameter value or value for a specific command or null to request it from the device by the get command
                            unit:
                              type: string
                              description: Unit can be used, if the app needs to use non-system unit for this parameter
                          required:
                            - name
                    required:
                      - deviceId
      responses:
        '200':
          description: Commands execution results
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  commands:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        deviceId:
                          type: string
                        resultCode:
                          type: integer
                        resultCodeMessage:
                          type: string
              example:
                resultCode: 0
                commands:
                  - id: 123
                    deviceId: ABC123
                    resultCode: 0
                    resultCodeMessage: Error message


  /cloud/json/devices/{deviceId}/parametersByDate/{startDate}:
    get:
      summary: Get History of Measurements
      operationId: Get History of Measurements
      tags:
        - Device Measurements
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: path
          description: Device ID for which to get a history of measurements
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Location ID
          required: true
          schema:
            type: integer
        - name: startDate
          in: path
          description: Start date to begin receiving measurements, for example 2014-08-01T12:00:00-08:00
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: >-
            End date to stop receiving measurements, for example 2014-08-01T13:00:00-08:00.
            Default is the current date.
          schema:
            type: string
        - name: paramName
          in: query
          description: Only obtain measurements for given parameter names. Multiple values can be passed.
          schema:
            type: string
        - name: index
          in: query
          description: Only obtain measurements for parameters with this index value
          schema:
            type: string
        - name: rangeOnly
          in: query
          description: Return parameters stored exactly between start and end dates
          schema:
            type: boolean
        - name: reduceNoise
          in: query
          description: Return tiny parameter values less than defined threshold as zero
          schema:
            type: boolean
        - name: interval
          in: query
          description: Aggregate the readings by this interval, in minutes
          schema:
            type: integer
        - name: aggregation
          in: query
          description: |-
            Interval aggregation algorithm:
            <br>0 = last value before the interval point - default
            <br>1 = minimum value
            <br>2 = maximum value
            <br>3 = median value
            <br>4 = time distributed average value
            <br>5 = average value
          schema:
            type: integer
        - name: sortOrder
          in: query
          description: Order result by timestamp<br>asc = ascending<br>desc = descending
          schema:
            type: string
      responses:
        '200':
          description: Measurements history
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  readings:
                    type: array
                    items:
                      type: object
                      properties:
                        deviceId:
                          type: string
                        timeStamp:
                          type: string
                        timeStampMs:
                          type: integer
                        params:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              index:
                                type: string
                              value:
                                type: string
                            required:
                              - name
                      required:
                        - deviceId
                        - timeStamp
                        - timeStampMs
                        - params
              example:
                resultCode: 0
                readings:
                  - deviceId: MON9648
                    timeStamp: '2014-12-21T00:58:49-04:00'
                    timeStampMs: 1419137929000
                    params:
                      - name: power
                        value: '865'
                      - name: energy
                        value: '0.003'
                  - deviceId: MON9648
                    timeStamp: '2014-12-21T00:58:49-04:00'
                    timeStampMs: 1419137929000
                    params:
                      - name: energy
                        value: '0.004'


