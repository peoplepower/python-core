  /cloud/json/locations/{locationId}/state:
    put:
      summary: Set Location State
      operationId: Set Location State
      description: |-
        Location state variables are a way for bots and users to set named location states with flexible object structure.
  
        The location state value can be an any valid JSON node.
        When a state variable is saved by a bot, its contents will persist in the location beyond the lifetime of the bot.
        It can be a single value node (string, integer, etc.) or an array or an object node `{}`.
  
        If the value is an object node, the API will read the current state value and try to update only changed fields.
  
        To remove a state, set the value to `null`.
        To delete a field from the current value set it to `null`.
      tags:
        - Synthetic APIs
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: name
          in: query
          description: State name
          required: true
          schema:
            type: string
        - name: overwrite
          in: query
          description: Overwrite the entire state with completely new content
          schema:
            type: boolean
        - name: publish
          in: query
          description: Publish state to subscribers, default is true
          schema:
            type: boolean
        - name: upd
          in: query
          description: >-
            Array of updated or added top level properties of the state.
            <br>Used with overwrite=true to inform a partner's cloud.
          schema:
            type: string
        - name: del
          in: query
          description: >-
            Array of deleted top level properties of the state.
            <br>Used to inform a partner's cloud.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              value:
                field0: 123
                field1:
                  ids:
                    - 1234
                    - 2366
                  key: value
                fieldToDelete: null
            schema:
              type: object
              properties:
                value:
                  type: object
                  description: Flexible structure object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Location State
      operationId: Get Location State
      tags:
        - Synthetic APIs
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: name
          in: query
          description: State name(s), multiple values supported
          required: true
          schema:
            type: string
      responses:
        '200':
          description: State(s)
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  stateDate:
                    type: string
                  stateDateMs:
                    type: integer
                  value:
                    type: object
                    description: Value of the requested single state
                  states:
                    type: array
                    description: Array of states
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: State's name
                        stateDate:
                          type: string
                        stateDateMs:
                          type: integer
                        value:
                          type: object
                          description: State's value
              example:
                resultCode: 0
                value:
                  field0: 123
                  field1:
                    ids:
                      - 1234
                      - 2366
                    key: value
                states:
                  - name: stateName
                    value:
                      field0: 123
                      field1: AAA

    delete:
      summary: Delete All Location States
      operationId: Delete All Location States
      description: Delete all states on the location
      tags:
        - Synthetic APIs
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


