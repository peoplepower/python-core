          schema:
            type: boolean
        - name: index
          in: query
          description: >-
            Fragment index starting from 0 to identify unique file fragment.
            It is used for additional control over uploaded data.
          schema:
            type: integer
        - name: PPCAuthorization
          in: header
          description: Device's authorization
          example: esp token=ABC12345
          schema:
