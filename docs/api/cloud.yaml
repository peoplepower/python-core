  /cloud/json/token:
    get:
      summary: Get Operation Token
      operationId: Get Operation Token
      description: |-
        Generate a new operation token, which can be used in other API calls instead of optional API key.
        The operation token is valid exactly between two time values in milliseconds from the current moment
        returned by this API with the token and *can be used only once*.

        At this moment only one token type is supported.

        | Type | Description | Usage |
        | :--: | ----------- | ----- |
        | 1 | User registration | Create a new user account API |

        The token value should be provided in the `PPCAuthorization` HTTP header with the `op token=` prefix to the create user API.
        For example, `PPCAuthorization:op token=abc123456`.
      tags:
        - Authentication
      parameters:
        - name: type
          in: query
          description: Token type
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Operation Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  token:
                    type: string
                    description: Token value
                  tokenType:
                    type: integer
                    enum: [1]
                    description: Token type
                  validFrom:
                    type: integer
                    description: Time in milliseconds from the current moment, when the token will be started using
                  expire:
                    type: integer
                    description: Time in milliseconds from the current moment, when the token must be stopped using
              example:
                resultCode: 0
                token: UugJtGEXxMfnVyql4N4crIAfqOUlJ
                tokenType: 1
                validFrom: 15000
                expire: 600000


  /cloud/json/user:
    post:
      summary: Create User and Location
      operationId: Create User and Location
      description: |-
        When creating a new user or a new location, all fields are optional.
        If the username or the password is not set, the user account will be created,
        but the user will not be able to sign in and will have to renew the password.
        
        Although it's not required, we recommend creating a default Location when creating a new User account,
        to begin grouping Devices by Location and to take advantage of AI functionality for that Location.

        The API returns the registered user ID and a new API key.

        A new user account can be created by an existing user.
        In this case the API key must be used.
        Otherwise, an operation token of type 1 must be provided.
