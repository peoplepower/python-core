        - userApiKey: []
      parameters:
        - name: deviceTypeId
          in: path
          description: The device type ID
          required: true
          schema:
            type: integer
        - name: details
          in: query
          description: |-
            <b>true</b> - Return details for these rules, including all the triggers, states, and actions that compose the rule.
            <br><b>false</b> - Only return the high level information about the rule, including the id, description text,
            on/off status, whether the rule is a default rule, and whether the rule is hidden and not editable, default.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        status:
                          type: integer
                        hidden:
                          type: boolean
                        default:
                          type: boolean
                        trigger:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                            type:
                              type: integer
                            display:
                              type: integer
                            timezone:
                              type: boolean
                            desc:
                              type: string
                            past:
                              type: string
                            parameters:
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  category:
                                    type: integer
                                  value:
                                    type: string
                        states:
                          type: object
                          properties:
                            state:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                                  type:
                                    type: integer
                                  display:
                                    type: integer
                                  timezone:
                                    type: boolean
                                  desc:
                                    type: string
                                  past:
                                    type: string
                                  parameters:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        name:
                                          type: string
                                        category:
                                          type: integer
                                        value:
                                          type: string
                        actions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              type:
                                type: integer
                              display:
                                type: integer
                              timezone:
                                type: boolean
                              desc:
                                type: string
                              parameters:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    category:
                                      type: integer
                                    value:
                                      type: string
              example:
                resultCode: 0
                rules:
                  - id: 2367670
                    name: If my door opens, and I am away then notify me on my phone
                    status: 1
                    hidden: false
                    default: true
                    trigger:
                      id: 35
                      name: trigger door/window opens
                      type: 14
                      display: 14
                      timezone: false
                      desc: opens
                      past: opened
                      parameters:
                        - name: deviceId
                          category: 5
                          value: ABC123
                    states:
                      state:
                        - id: 5
                          name: Away state
                          type: 21
                          display: 22
                          timezone: false
                          desc: am away
                          past: were away
                          parameters:
                            - name: locationId
                              category: 4
                              value: '3'
                    actions:
                      - id: 14
                        name: notification to phone action
                        type: 31
                        display: 31
                        timezone: false
                        desc: notify me by phone
                        parameters:
                          - name: text
                            category: 10
                            value: Your door opened while you were away!


