                        description: Either brands or models are supported
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              description: Model's ID
                            brand:
                              type: string
                              description: Model's brand
                      pages:
                        type: array
                        description: Story pages
                        items:
