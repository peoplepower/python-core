  /cloud/json/userServicePlans/{servicePlanId}:
    post:
      summary: Assign Service Plan to Locations
      operationId: Assign Service Plan to Locations
      description: |-
        This API can be called by any user to assign free services.

        An administrator with a corresponding privilege level must provide a list of locations where to assign the service plan.
        In multiple locations assignment result codes are returned for each of them.
        User IDs are optional, but if set, their access to locations will be verified.
      tags:
        - Subscriptions
      security:
        - userApiKey: []
      parameters:
        - name: servicePlanId
          in: path
          description: The Service Plan ID to assign
          required: true
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Organization ID. Required if called by an organization administrator.
          schema:
            type: integer
        - name: endDate
          in: query
          description: The end date of the service plan
          schema:
            type: string
        - name: locationId
          in: query
          description: Location ID to assign the service plan
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                locations:
                  type: array
                  description: Location and user IDs to assign the service plan
                  items:
                    type: object
                    properties:
                      locationId:
                        type: integer
                      userId:
                        type: integer
            example:
              locations:
                - locationId: 123
                  userId: 456
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  results:
                    type: array
                    description: Result codes for assigning the plan to each location ID from the request body
                    items:
                      type: object
                      properties:
                        locationId:
                          type: integer
                        resultCode:
                          type: integer
              example:
                resultCode: 0
                results:
                  - locationId: 123
                    resultCode: 0

    delete:
      summary: Cancel Service Plan
      operationId: Cancel Service Plan
      description: Cancel assigned service plan.
      tags:
        - Subscriptions
      security:
        - userApiKey: []
      parameters:
        - name: servicePlanId
          in: path
          description: The User service plan ID to cancel
          required: true
          schema:
            type: integer
        - name: locationId
          in: query
          description: Location ID to cancel the service plan
          schema:
            type: integer
        - name: organizationId
          in: query
          description:  Organization ID. Required if called by an organization administrator.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


