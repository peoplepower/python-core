                  status: 1
                  title: Connections Survey
                  description: Successful Aging Connections Questionnaire
                  pagination: true

    put:
      summary: Answer Survey Questions
      operationId: Answer Survey Questions
      description: |-
        Put survey answers by a Survey API key to the latest open survey response.
        A user can submit a portion of answers in one API call. Some of answers can overwrite previous.
        
        The API checks, if the survey is not answered yet by the user (withing configured date interval).
        
        An optional parameter `status` is used to finalize the latest survey response.
        In this case the API checks that all questions answered and triggers bots.
      tags:
        - Questions
      security:
        - surveyApiKey: []
      parameters:
        - name: status
          in: query
          description: |-
            Change survey response status: 1 - close
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              questions:
                - questionKey: Question#1
                  answer: '1'
                - questionKey: Question#2
                  answer: '0'
            schema:
              type: object
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      questionKey:
                        type: string
                        description: Question key
                      answer:
                        type: string
                        description: Question answer
                    required:
                      - questionKey
                      - answer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/systemProperty/{propertyName}:
    get:
      summary: Get User or System Property
      operationId: Get User or System Property
      description: |-
        This API will first attempt to return a user-specific property value in plain text.
        If there is no user-specific property set, it will attempt to return a system-wide property value as plain text.
        If there is no system property available, it will return no content.

        When using the returned content in your code, be sure to check for edge cases where no content was retrieved,
        or the value is out-of-bounds, or the value was not the right type of information your code expects.

        When retrieving a system property, the API key is optional.
        When the API key is not presented, the API will always return a System Property and never override it with a User Property of the same name.
      tags:
        - System and User Properties
      security:
        - userApiKey: []
      parameters:
        - name: propertyName
          in: path
          description: Name of the property value to retrieve, i.e. "ppc.api.debug_level"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Property value
          content:
            text/plain:
              example: |
                DEBUG


  /cloud/json/userProperties:
    get:
      summary: Get User Properties
      operationId: Get User Properties
      description: |-
        This API returns user-specific property values.

        When using the returned content in your code, be sure to check for edge cases where no content was retrieved,
        or the value is out-of-bounds, or the value was not the right type of information your code expects.

        You may also supply only a prefix of the property name you are looking for.
        The Care Daily AI Platform will return all properties that contain the given property name prefix.
      tags:
        - System and User Properties
      security:
        - userApiKey: []
      parameters:
        - name: name
          in: query
          description: Property name or optional name prefix to filter properties. Multiple values are supported.
          schema:
            type: string
        - name: userId
          in: query
          description: User ID, used by an account with administrative privileges to retrieve the properties of another user
          schema:
            type: integer
      responses:
        '200':
          description: User Properties
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  properties:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        displayType:
                          type: integer
                      required:
                        - name
                        - value
              example:
                resultCode: 0
                properties:
                  - name: question.roommates
                    value: '1'
                    displayType: 2
                  - name: question.xbox
                    value: 'false'

    post:
      summary: Update User Properties
      operationId: Update User Properties
      description: >-
        The application may update several user properties simultaneously.
        The maximum value size may be 10,000 characters using this API.
      tags:
        - System and User Properties
      security:
        - userApiKey: []
      parameters:
        - name: userId
          in: query
          description: User ID, used by an account with administrative privileges to update the properties for another user
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              property:
                - name: question.roommates
                  value: '1'
                  displayType: 2
                - name: products.xbox
                  value: 'false'
            schema:
              type: object
              properties:
                property:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      displayType:
                        type: integer
                    required:
                      - name
                      - content
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/userProperty/{name}:
    get:
      summary: Get User Property
      operationId: Get User Property
      description: |-
        This API will first attempt to return a user-specific property value in plain text.
        If there is no user-specific property set, it will attempt to return a system-wide property value as plain text.
        If there is no system property available, it will return no content.

        When using the returned content in your code, be sure to check for edge cases where no content was retrieved,
        or the value is out-of-bounds, or the value was not the right type of information your code expects.

        When retrieving a system property, the API key is optional.
        When the API key is not presented, the API will always return a System Property and never override it with a User Property of the same name.

        This is JSON format version of the previously documented API.
      tags:
        - System and User Properties
      security:
        - userApiKey: []
      parameters:
        - name: name
          in: path
          description: Name of the property value to retrieve, i.e. "ppc.api.debug_level"
          required: true
          schema:
            type: string
        - name: userId
          in: query
          description: User ID, used by an account with administrative privileges to retrieve the properties of another user
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  value:
                    type: string
              example: |
                {
                  "resultCode": 0,
                  "value": "1"
                }

    put:
      summary: Update a User Property
      operationId: Update a User Property
      description: |-
        The application may update a single user property with a very simple API requiring no JSON body.
        The maximum value size may be 250 characters using this API.
      tags:
        - System and User Properties
      security:
        - userApiKey: []
      parameters:
        - name: name
          in: path
          description: Name of the property to set a value for. Maximum of 250 characters.
          required: true
          schema:
            type: string
        - name: value
          in: query
          description: Value to set for this property. Maximum of 250 characters.
          required: true
          schema:
            type: string
        - name: displayType
          in: query
          description: Display type
          schema:
            type: integer
        - name: userId
          in: query
          description: User ID, used by an account with administrative privileges to update the properties for another user
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/files:
    post:
      summary: Upload New Device File
      operationId: Upload Device File
      description: |-
        The "Content-Type" header must be like `video/*`, `image/*`, `audio/*`, `text/plain` or `application/octet-stream`
        (see https://en.wikipedia.org/wiki/Internet_media_type for possible exact values).
        For example: `video/mp4`, `image/jpeg`, `audio/mp3`.
        The content type of thumbnail image is always `image/jpeg`.

        The `PPCAuthorization` headers may take on one of two forms, to identify the source device:

        * Using a Device Authentication Token: `PPCAuthorization: esp token="ABC12345"`
        * Using a Streaming Session ID: `PPCAuthorization: stream session="DEF67890"`

        A client can request only a creation of the file record without immediate uploading of the file or thumbnail content.
        In this case the API will return temporary content and thumbnail upload URL's, where data can be uploaded,
        and upload request headers, which must be used in each upload.
        After finishing data upload the client must update the file as completed.
        This method can improve large files upload speed.

        A client should provide the file creation timestamp.
      tags:
        - Device Files
      parameters:
        - name: proxyId
          in: query
          description: Device ID of the proxy that this file is being uploaded through
          required: true
          schema:
            type: string
        - name: deviceId
          in: query
          description: Device ID of the device that generated this file, if different from the proxyId
          schema:
            type: string
        - name: ext
          in: query
          description: File extension (For example, `mp4` or `png`)
          schema:
            type: string
        - name: expectedSize
          in: query
          description: Expected total size in bytes, if available
          schema:
            type: integer
        - name: timestamp
          in: query
          description: File creation time on the device in milliseconds
          schema:
            type: string
        - name: timesec
          in: query
          description: File creation time on the device in seconds
          schema:
            type: string
        - name: duration
          in: query
          description: Duration of the video in seconds, for reporting to the UI
          schema:
            type: integer
        - name: rotate
          in: query
          description: Rotation in degrees. The UI is expected to manually rotate the video back to being upright if this is set.
          schema:
            type: integer
        - name: fileId
          in: query
          description: Existing file ID to replace the content and properties
          schema:
            type: integer
        - name: thumbnail
          in: query
          description: <b>true</b> - the content is a thumbnail image and the file content will be uploaded later
          schema:
            type: boolean
        - name: incomplete
          in: query
          description: >-
            <b>true</b> - This file content will be added or replaced or extended later
            <br><b>false</b> - This file is complete
          schema:
            type: boolean
        - name: uploadUrl
          in: query
          description: <b>true</b> - Generate upload URL's for file's content and thumbnail, if the thumbnail parameter is true.
          schema:
            type: boolean
        - name: type
          in: query
          description: >-
            File type. By default it is defined from the content type.
            However, this parameter is useful, if a thumbnail with different content type is uploaded first.
          schema:
            type: integer
        - name: PPCAuthorization
          in: header
          description: Device's authorization
          example: esp token=ABC12345
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Device response status
                  fileRef:
                    type: integer
                    description: The File ID to reference this file later
                  filesAction:
                    type: integer
                    description: >-
                      Actions performed by the API as a result of this file upload:
                      <br><b>1</b> - Old files have been deleted to make room for this one
                      <br><b>2</b> - There isn't enough space to upload this file
                  thumbnail:
                    type: boolean
                    description: <b>true</b> - the content is a thumbnail image
                  totalFilesSpace:
                    type: integer
                    description: The total space in the user's account for files in bytes.
                  usedFilesSpace:
                    type: integer
                    description: The space in the user's account that has already been consumed in bytes.
                  fragments:
                    type: integer
                    description: The total fragments that compose this file. Always 1 for this API.
                  contentUrl:
                    type: string
                    description: Temporary URL to upload the file content
                  thumbnailUrl:
                    type: string
                    description: Temporary URL to upload the thumbnail content
                  uploadHeaders:
                    type: object
                    description: Headers required to upload the content to the URLs
              example:
                status: ACK
                fileRef: 12345
                filesAction: 1
                thumbnail: true
                totalFilesSpace: 10000000
                usedFilesSpace: 1000000
                fragments: 3
                contentUrl: >-
                  https://s3.amazonaws.com/cbacket/fileId?X-Amz-Algorithm=AWS4-HMAC-SHA256...
                thumbnailUrl: >-
                  https://s3.amazonaws.com/tbacket/fileId?X-Amz-Algorithm=AWS4-HMAC-SHA256...
                uploadHeaders:
                  x-amz-server-side-encryption: AES256

