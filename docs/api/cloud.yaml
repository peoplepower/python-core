            type: string
      responses:
        '200':
          description: Private key
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  privateKey:
                    type: string
                    description: PKCS#8 encoded private key in Base64 format
              example:
                resultCode: 0
                privateKey: UugJtGEXxMfnVyql4N4crIAfqOUlJ=

    put:
      summary: Put Public Key
      operationId: Put Public Key
      description: Upload own RSA public key to the account.
      tags:
        - Authentication
