  /cloud/json/countries:
    get:
      summary: Get Countries, States, Time Zones
      operationId: Get Countries States Time Zones
      description: >-
        This API returns a list of countries currently supported on the Care Daily AI Platform.
        Countries are explicitly documented, maintained, and enumerated in the Care Daily AI Platform, allowing association of a set of attributes with each country.
        In other API calls, countries, states, and time zones are referenced by their ID's, which must be gathered first from the Care Daily AI Platform.
      tags:
        - Locations
      security:
        - userApiKey: []
      parameters:
        - name: organizationId
          in: query
          description: Filter response by the organization ID
          schema:
            type: integer
        - name: countryCode
          in: query
          description: >-
            Filter response by country codes.
            You may specify multiple countryCode URL parameters with different values to gather multiple countries data.
          schema:
            type: string
        - name: lang
          in: query
          description: Use for language specific response.
          schema:
            type: string
      responses:
        '200':
          description: Countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  countries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Country ID, for referencing this country elsewhere in the Care Daily AI Platform
                        name:
                          type: string
                          description: Name of the country
                        countryCode:
                          type: string
                          description: ISO 3166-1 alpha-2 country code
                        currencyCode:
                          type: string
                          description: ISO 4217 currency code
                        currencySymbol:
                          type: string
                          description: Currency symbol
                        zipFormat:
                          type: string
                          description: |-
                            Regular expression describing the acceptable format for the zip / postal code. For example, ^\d{5}$
                        stateName:
                          type: string
                          description: State's name, for example, "state" or "province"
                        zipName:
                          type: string
                          description: Postal code name
                        preferred:
                          type: boolean
                          description: True for the country or state correlated with the current user IP address
                        timezones:
                          type: array
                          description: Country time zones
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Timezone ID, for example, "US/Eastern"
                              offset:
                                type: integer
                                description: Timezone offset in minutes
                              dst:
                                type: boolean
                                description: Daylight saving time enabled
                              name:
                                type: string
                                description: Timezone name
                            required:
                              - id
                              - offset
                              - dst
                              - name
                        states:
                          type: array
                          description: Array of states or provinces
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                                description: State ID to reference this state in other API calls
                              name:
                                type: string
                                description: Name of the state
                              timezoneId:
                                type: string
                                description: Default timezone ID of state
                              preferred:
                                type: boolean
                                description: True for the country or state correlated with the current user IP address
                              abbr:
                                type: string
                                description: Abbreviation
                              code:
                                type: string
                                description: State ANSI code
                            required:
                              - id
                              - name
                      required:
                        - id
                        - name
                        - countryCode
              example:
                resultCode: 0
                countries:
                  - id: 1
                    name: United States
                    countryCode: US
                    currencyCode: USD
                    currencySymbol: $
                    zipFormat: ^\d{5}$
                    stateName: State
                    zipName: Zip Code
                    preferred: true
                    timezones:
                      - id: US/Eastern
                        offset: -300
                        dst: true
                        name: Eastern Time
                      - id: US/Central
                        offset: -360
                        dst: true
                        name: Central Time
                      - id: US/Alaska
                        offset: -540
                        dst: true
                        name: Alaska Time
                    states:
                      - id: 1
                        name: Alabama
                        timezoneId: US/Central
                        preferred: false
                        abbr: AL
                        code: '01'
                      - id: 2
                        name: Alaska
                        timezoneId: US/Alaska
                        preferred: true
                        abbr: AK
                        code: '02'
                  - id: 2
                    name: Canada
                    countryCode: CA
                    currencyCode: CAD
                    currencySymbol: $
                    zipFormat: >-
                      ^[ABCEGHJKLMNPRSTVXY]{1}\d{1}[ABCEGHJKLMNPRS-Z]{1}\d{1}[ABCEGHJKLMNPRS-Z]{1}\d{1}$
                    stateName: Province
                    zipName: Postal Code
                    preferred: false
                    timezones:
                      - id: Canada/Mountain
                        offset: -420
                        dst: true
                        name: Mountain Time
                      - id: Canada/Pacific
                        offset: -480
                        dst: true
                        name: Pacific Time
                    states:
                      - id: 60
                        name: Alberta
                        timezoneId: Canada/Mountain
                        preferred: false
                        abbr: AB
                      - id: 57
                        name: British Columbia
                        timezoneId: Canada/Pacific
                        preferred: false
                        abbr: BC


  /cloud/json/location/{locationId}/users:
    post:
      summary: Add Location Users
      operationId: Add Location Users
      tags:
        - Locations
      description: |-
        An administrator of a location can assign other existing users to access and manage the location and devices on it and receive notifications related to this location.
        
        ### Location Access Levels
  
        | Level | Name | Details |
        | :---: | :--: | ------- |
        |  0 | None | No access to location |
        | 10 | Read | Read all location and devices information |
        | 20 | Control | Update location events and control devices |
        | 30 | Admin | Administrate locations and manage devices |
  
        ### Notification Categories
  
        | Category | Details |
        | :------: | ------- |
        | 0 | None |
        | 1 | Notify First |
        | 2 | Notify Second |
        | 3 | Social Check-in Reminders |
  
        ### Roles
  
        Based on own business logic applications can assign end user roles inside each location.
        Here are some examples.
  
        | Role | Details |
        | :--: | ------- |
        | 0 | None |
        | 1 | Supported Resident (Care Recipient) |
        | 2 | Lead Supporter (Primary Caregiver) |
        | 3 | Backup Supporter (Secondary Caregiver) |
        | 4 | Professional Support Personnel |
        | 5 | Circle Member |
        | 6 | Attending Doctor (Physician) |
        
        ### Residency Status

        | Residency | Details |
        | :-------: | ------- |
        | 0 | Unknown |
        | 1 | Resident |
        | 2 | On-Site Community Staff |
        | 3 | Lives Nearby |
        | 4 | Lives Remotely |

      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: User's ID to add
                      locationAccess:
                        type: integer
                        description: Location access level
                      category:
                        type: integer
                        description: User's category on the location
                      role:
                        type: integer
                        description: User's role on the location
                      residency:
                        type: integer
                        description: User's residency status on the location
                      callOrder:
                        type: integer
                        description: Emergency contact order
                      hidden:
                        type: boolean
                        description: Hide this user from other location end users. Set by an organization administrator.
                      temporary:
                        type: boolean
                        description: Temporary location access
                      nickname:
                        type: boolean
                        description: This location specific nickname
            example:
              users:
                - id: 123
                  locationAccess: 10
                  category: 1
                  role: 1
                  residency: 1
                  callOrder: 2
                  hidden: true
                  temporary: true
                  nickname: Johnny
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0
    get:
      summary: Get Location Users
      operationId: Get Location Users
      tags:
        - Locations
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Location users
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: User's ID
                        userName:
                          type: string
                        altUsername:
                          type: string
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: object
                          properties:
                            email:
                              type: string
                            verified:
                              type: boolean
                            status:
                              type: integer
                        phone:
                          type: string
                        phoneType:
                          type: integer
                        smsStatus:
                          type: integer
                        roleId:
                          type: integer
                          description: System user's role
                        language:
                          type: string
                        medicalRecordNumber:
                          type: string
                          description: Medical Record Number
                        accessibility:
                          type: integer
                        birthDate:
                          type: string
                        gender:
                          type: integer
                        avatarFileId:
                          type: integer
                        locationAccess:
                          type: integer
                          description: Location access level
                        category:
                          type: integer
                          description: User's category on the location
                        role:
                          type: integer
                          description: User's role on the location
                        residency:
                          type: integer
                          description: User's residency status on the location
                        callOrder:
                          type: integer
                          description: Emergency contact order
                        hidden:
                          type: boolean
                          description: Hide this user from other location end users
                        nickname:
                          type: string
                          description: Location specific nickname
                        temporary:
                          type: boolean
                          description: Temporary access to the location
                        accessEndDate:
                          type: string
                          description: End of the temporary access
