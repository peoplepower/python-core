  /cloud/json/receipt/apple:
    post:
      summary: Apple Purchase
      operationId: Apple Purchase
      description: |-
        The Care Daily AI Platform supports Apple's Auto-renewable subscriptions
        as well as Non-Renewing subscriptions with custom limits on durations.
        Please see https://developer.apple.com/in-app-purchase/ for more details.

        When making a purchase through the Apple App Store, the app will hand over control to Apple to handle the transaction.
        When the transaction is complete, it is the app's responsibility to capture the authenticated receipt from Apple and reliably pass the receipt to the Care Daily AI Platform.
        The Care Daily AI Platform will validate the receipt by calling the payment provider's server, and then securely apply the purchase to the user's account.

        This API will return a result code:
        * *0 = Success*
        * *6 = Object Not Found*, the receipt is not found on the Apple Store
        * *7 = Access Denied*, the receipt is already submitted by a different user
        * *8 = Wrong Parameter Value*, The receipt is invalid or expired
        * *26 = Duplicate Entry*, The receipt is already submitted by the same user
      tags:
        - Subscriptions
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID
          required: true
          schema:
            type: integer
        - name: appName
          in: query
          description: Unique app name that is making the purchase
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/callCenter:
    get:
      summary: Get Call Center
      operationId: Get Call Center
      description: |-
        Retrieve call center service statuses,
        if the service is available and if the registration in the third party application has been completed.

        If the service is available, but the registration has not been completed yet,
        then the Care Daily AI Platform does not have enough information to do it.

        Call center registration can have following statuses:

        | Value | Status | Description |
        | :---: | ------ | ----------- |
        | 0 | Unavailable | The service never purchased |
        | 1 | Available | The service purchased, but the user does not have enough information for registration |
        | 2 | Registration pending | The registration process has not been completed yet |
        | 3 | Registered | Registration completed |
        | 4 | Cancellation pending | The cancellation has not been completed yet |
        | 5 | Canceled | Cancellation completed |

        To complete the call center registration the user has to submit
        own name, phone number and address using the update user info API and a list of emergency contacts.
        The complete list of missing fields is returned.

        Also, this API returns an array of emergency contacts including the first and the last name, the phone number of the person in the order, how they have to be contacted.

        The alert status with the alert date is returned in a case of an emergency situation. It can have following values:

        | Value | Status | Description |
        | :---: | ------ | ----------- |
        | 0 |  | An alert never raised |
        | 1 | Raised | An alert raised, but the call center not contacted yet |
        | 3 | Reported | The alert reported to the call center |

        A call center account can be temporaty set to a test mode or scheduled to be on test in the future.

        | Test Status | Description |
        | :---------: | ----------- |
        | 1 | Test pending |
        | 2 | Active now or scheduled |
        | 3 | Cancel test pending |
        | 4 | Off |

        Third-party OAuth client supported.
      tags:
        - Professional Monitoring
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Call Center Service
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  callCenter:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Service status
                      code:
                        type: string
                        description: External account code
                      userId:
                        type: integer
                        description: Service user's ID
                      missingFields:
                        type: array
                        description: Data fields required for account registration
                        items:
                          type: string
                      contacts:
                        type: array
                        description: User contacts to call in case of emergency
                        items:
                          type: object
                          properties:
                            userId:
                              type: integer
                              description: Existing user's ID, if provided all details will be selected from the user's account
                            firstName:
                              type: string
                              description: First name of a contact not registered in the system
                            lastName:
                              type: string
                              description: Last name of a contact not registered in the system
                            phone:
                              type: string
                              description: Phone number of a contact not registered in the system
                            phoneType:
                              type: integer
                              description: Phone type of a contact not registered in the system
                            ecv:
                              type: boolean
                              description: |-
                                Contact before bispatch, a value indicating whether the contact will be contacted before attempting to contact dispatch. Enhanced Call Verification.
                                True by default.
                      codeword:
                        type: string
                        description: Codewords
                      notDispatch:
                        type: boolean
                        description: Set the account dispatch type to "do not dispatch"
                      permit:
                        type: string
                        description: Permit number
                      alertStatus:
                        type: integer
                        description: Alert status
                      alertDate:
                        type: string
                        description: The last alert date
                      alertDateMs:
                        type: integer
                      alertStatusDate:
                        type: string
                      alertStatusDateMs:
                        type: integer
                      tests:
                        type: array
                        description: Test periods
                        items:
                          type: object
                          properties:
                            testId:
                              type: integer
                            status:
                              type: integer
                            startDate:
                              type: string
                            startDateMs:
                              type: integer
                            endDate:
                              type: string
                            endDateMs:
                              type: integer
                            comment:
                              type: string
                            userId:
                              type: integer
                            externalTestId:
                              type: integer
              example:
                resultCode: 0
                callCenter:
                  status: 1
                  code: A12345
                  userId: 123
                  missingFields:
                    - user.firstName
                    - user.phone
                    - location.addrStreet1
                  contacts:
                    - userId: 123
                      firstName: Laura
                      lastName: Secord
                      phone: '1232686353'
                      phoneType: 1
                      ecv: true
                  codeword: pass phrase
                  notDispatch: false
                  permit: '1234567890'
                  alertStatus: 3
                  alertDate: '2015-09-01T18:00:00Z'
                  alertDateMs: 1441130400000
                  alertStatusDate: '2015-09-01T18:00:30Z'
                  alertStatusDateMs: 1441130430000
                  tests:
                    - testId: 123
                      status: 2
                      startDate: '2015-09-01T18:00:30Z'
                      startDateMs: 1441130430000
                      endDate: '2015-09-01T19:00:30Z'
                      endDateMs: 1441134400000
