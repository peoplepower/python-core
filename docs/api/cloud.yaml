  /cloud/json/messages:
    post:
      summary: Create Messages
      operationId: Create Messages
      description: |-
        Message APIs allow to create, schedule, and retrieve messages from AI bots to location users.

        ### Message Statuses
  
        | Status | Description            |
        |:------:|------------------------|
        |   0    | Initial, storage only  |
        |   1    | Ready for scheduling   |
        |   2    | Scheduled for delivery |
        |   3    | Delivered              |
        |   4    | Deleted                |

        ### Scheduling Types
  
        | Type | Description |
        |:----:|-------------|
        |  0   | One-time    |
        |  1   | Recurring   |
        
        One-time messages will be delivered to users only once, when the status is set to `2` or `3`.
        
        Notifications from recurring messages can be delivered multiple times according to the notification schedule until the maximum delivery date, when the message has the status `2`.
        
        Delivered messages will have status `3`.
  
        ### Delivery Types
        
        A message content can be delivered to users over different notification channels.
        
        | Type | Description |
        |:----:|-------------|
        |  0   | In-App |
        |  1   | Push |
        |  2   | Email |
        |  3   | SMS |
  
        A message content with the delivery type `0` "In-App" will be returned from the get message API.
        It is always required, when a message is created.
      
        ### Text Content Types
        
        | Type | Description    | Delivery Types |
        |:----:|----------------| -------------- |
        |  0   | Text (default) | All |
        |  1   | HTML           | Email only |
        |  2   | Markdown       | In-App only |
        
        AI bots and users can create new messages using this API.

        User messages always have status delivered.
      tags:
        - User Communications
      security:
        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID, when created by a user
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              messages:
                - status: 1
                  originalMessageId: 111
                  topicId: general
                  scheduleType: 0
                  contentKey: Short content description
                  contents:
                    - deliveryType: 0
                      contentType: 2
                      text:
                        en: In-App message text
                        es: ...
                    - deliveryType: 1
                      contentType: 0
                      text:
                        en: Push notification
                        es: ...
                      title: Title
                      subtitle: Subtitle
                      category: 21.0.1
                      sound: sound.wav
                    - deliveryType: 2
                      contentType: 1
                      text:
                        en: Email message text
                        es: ...
                      subject:
                        en: Email subject
                        es: ...
                      attachments:
                        - name: imageName.jpg
                          content: /9j/4AAQSkZJRgABAgEAAAAAAAD/4
                          contentType: image/jpeg
                          contentId: inlineImageId
                    - deliveryType: 3
                      contentType: 0
                      text:
                        en: SMS text
                        es: ...
                  questionId: 987
                  mediaUrl: https://s3.amazon.com/images/picture.png
                  mediaContentType: image/png
                  maxDeliveryDate: '2024-01-01T00:00:00Z'
                  deliveryDayTime: 36000
                  timeToLive: 3600
                  schedule: 0 0 10 ? * SUN
                  recipients:
                    - categories:
                        - 1
                        - 2
                      roles:
                        - 1
                        - 2
                      locationAccess: 10
                    - userId: 678
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: Message status
                      originalMessageId:
                        type: integer
                        description: Top message ID in the messages thread
                      topicId:
                        type: string
                        description: Messages topic ID
                      scheduleType:
                        type: integer
                        description: Scheduling type
                      contentKey:
                        type: string
                        description: Descriptive text used to classify priority of the message, e.g. Fall Event or Dog Walking
                      contents:
                        type: array
                        description: An array of objects with localized message texts by delivery types
                        items:
                          type: object
                          properties:
                            deliveryType:
                              type: integer
                              description: Delivery type
                            contentType:
                              type: integer
                              description: Message text content type
                            text:
                              type: object
                              additionalProperties:
                                type: string
                              description: Multilingual message text string map, where the keys are language names
                            title:
                              type: string
                            subtitle:
                              type: string
                            category:
                              type: string
                            sound:
                              type: string
                            subject:
                              type: object
                              additionalProperties:
                                type: string
                              description: Multilingual subject string map, where the keys are language names
                            attachments:
                              type: array
                              description: Email attachments
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                  content:
                                    type: string
                                  contentType:
                                    type: string
                                  contentId:
                                    type: string
                          required:
                            - deliveryType
                            - contentType
                            - text
                      questionId:
                        type: integer
                        description: ID of a question associated with this message
                      mediaUrl:
                        type: string
                        description: URL of media object
                      mediaContentType:
                        type: string
                        description: Media object content type, e.g. image/png
                      maxDeliveryDate:
                        type: string
                        description: Maximum absolute time by which the message has to be delivered
                      deliveryDayTime:
                        type: integer
                        description: Time of the day in seconds at which the message should be delivered
                      timeToLive:
                        type: integer
                        description: Time in seconds from the delivery date to count the message as active for replies by SMS
                      schedule:
                        type: string
                        description: Cron expression for recurring delivery of notifications
                      recipients:
                        type: array
                        description: An array of citeria to select notification recipients
                        items:
                          type: object
                          properties:
                            categories:
                              type: array
                              items:
                                type: integer
                            roles:
                              type: array
                              items:
                                type: integer
                            locationAccess:
                              type: integer
                            userId:
                              type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        messageId:
                          type: integer
              example:
                resultCode: 0
                messages:
                  - messageId: 123

    put:
      summary: Update Messages
      operationId: Update Messages
      description: AI bots can update message statuses and schedule delivery time.
      tags:
