  /cloud/json/locations/{locationId}/devices/{deviceId}/simCard:
    put:
      summary: Activate Sim Card
      operationId: Activate Sim Card
      tags:
        - Devices
      description: |-
        Using this API an administrator can manually activate or deactivate device SIM cards.

        SIM cards linked to the device are returned by the get device by ID API.

        A status of a SIM card can have following values:

        | Status | Name | Details |
        | :----: | ---- | ------- |
        | 0 | New | Can be Activated |
        | 1 | Active | Can be Deactivated |
        | 2 | Reserved | |
        | 3 | Expired | |
        | 4 | Suspended | Can be Deactivated |
        | 5 | Deactivated | Can be Activated |
        | 6 | Cancelled | |
        | 7 | Not Exist | |
      security:
        - adminApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: deviceId
          in: path
          description: Device ID
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: New SIM card status:<br>1 = active<br>5 = deactivated
          required: true
          schema:
            type: integer
        - name: simId
          in: query
          description: SIM ID
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


