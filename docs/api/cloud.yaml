          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/communityPosts/{postId}/files:
    post:
      summary: Upload File
      operationId: Upload File
      description: |-
        A client requests only a creation of the file record without immediate uploading of the file or thumbnail content.
        
        The content type must be like `video/*`, `image/*`, `audio/*` or `application/octet-stream`
        (see https://en.wikipedia.org/wiki/Internet_media_type for possible exact values).
        For example: `video/mp4`, `image/jpeg`, `audio/mp3`.
        The content type of thumbnail image is always `image/jpeg`.
        
        The API will return temporary content and thumbnail upload URLs,
        where data can be uploaded, and upload request headers, which must be used in each upload.

        After finishing data upload the client must update the file as completed.
      tags:
        - Community
      security:
        - userApiKey: []
      parameters:
        - name: postId
          in: path
          description: Post ID
          required: true
          schema:
            type: integer
        - name: type
          in: query
          description: |-
            File type<br>
            0 - any<br>
            1 - video<br>
            2 - image<br>
            3 - audio
          required: true
          schema:
            type: integer
        - name: contentType
          in: query
          description: File content type
          required: true
          schema:
            type: string
        - name: ext
          in: query
          description: File extension (For example, `mp4` or `png`)
          required: true
          schema:
            type: string
        - name: duration
          in: query
          description: Duration of the video in seconds
          schema:
            type: integer
        - name: rotate
          in: query
          description: >-
            Rotation in degrees. <br>The UI is expected to manually rotate the
            video back to being upright, if this is set.
          schema:
            type: integer
        - name: size
          in: query
          description: Total size in bytes of the file content, if available
          schema:
            type: integer
        - name: thumbnail
          in: query
          description: Request thumbnail URL
          schema:
            type: boolean
        - name: m3u8
          in: query
          description: Request m3u8 URL
          schema:
            type: boolean
        - name: expiration
          in: query
          description: Upload expiration in milliseconds since the current time
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  fileId:
                    type: integer
                  contentUrl:
                    type: string
                  thumbnailUrl:
                    type: string
                  uploadHeaders:
                    type: object
                    description: HTTP headers (name and value) to be included to the upload requests
                    properties:
                      x-amz-server-side-encryption:
                        type: string
              example:
                resultCode: 0
                fileId: 12345
                contentUrl: >-
                  https://s3.amazonaws.com/c_bucket/fileId?X-Amz-Algorithm=AWS4-HMAC-SHA256...
                thumbnailUrl: >-
                  https://s3.amazonaws.com/t_bucket/fileId?X-Amz-Algorithm=AWS4-HMAC-SHA256...
                uploadHeaders:
                  x-amz-server-side-encryption: AES256

    put:
      summary: Update File
      operationId: Update File
      description: Update file as completed.
      tags:
        - Community
      security:
        - userApiKey: []
      parameters:
        - name: postId
          in: path
          description: Post ID
          required: true
          schema:
            type: integer
        - name: fileId
          in: query
          description: File ID
          required: true
          schema:
            type: integer
        - name: complete
          in: query
          description: <b>true</b> - This file is complete
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Community File URLs
      operationId: Get Community File URLs
      description: Request files info and content and thumbnail download URL's by a post ID.
      tags:
        - Community
      security:
        - userApiKey: []
      parameters:
        - name: postId
          in: path
          description: Post ID
          required: true
          schema:
            type: integer
        - name: fileId
          in: query
          description: File ID
          schema:
            type: integer
        - name: content
          in: query
          description: Request content URL
          schema:
            type: boolean
        - name: thumbnail
          in: query
          description: Request thumbnail URL
          schema:
            type: boolean
        - name: m3u8
          in: query
          description: Request m3u8 URL
          schema:
            type: boolean
        - name: expiration
          in: query
          description: URL's expiration in milliseconds since the current time
          schema:
            type: integer
      responses:
        '200':
          description: Community Files
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        fileId:
                          type: integer
                        type:
                          type: integer
                        contentType:
                          type: string
                        ext:
                          type: string
                        duration:
                          type: integer
                        rotate:
                          type: integer
                        size:
                          type: integer
                        thumbnail:
                          type: boolean
                        m3u8:
                          type: boolean
                        contentUrl:
                          type: string
                        thumbnailUrl:
                          type: string
                        m3u8Url:
                          type: string
              example:
                resultCode: 0
                files:
                  - fileId: 12345
                    type: 1
                    contentType: video/mp4
                    ext: mp4
                    duration: 600
                    rotate: 90
                    size: 4567890
                    thumbnail: true
                    m3u8: true
                    contentUrl: >-
                      https://s3.amazonaws.com/c_bucket/object1?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20180704T220443Z&X-Amz-SignedHeaders=host&X-Amz-Expires=10&X-Amz-Credential=AKIAJPAZD&X-Amz-Signature=af7329c26
                    thumbnailUrl: >-
                      https://s3.amazonaws.com/t_bucket/object1?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20180704T220443Z&X-Amz-SignedHeaders=host&X-Amz-Expires=10&X-Amz-Credential=AKIAJPAZD&X-Amz-Signature=af7329c26
                    m3u8Url: >-
                      https://s3.amazonaws.com/m_bucket/object1?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20180704T220443Z&X-Amz-SignedHeaders=host&X-Amz-Expires=10&X-Amz-Credential=AKIAJPAZD&X-Amz-Signature=af7329c26

    delete:
      summary: Delete Community File
      operationId: Delete Community File
      description: ''
      tags:
        - Community
      security:
        - userApiKey: []
      parameters:
        - name: postId
          in: path
          description: Post ID
          required: true
          schema:
            type: integer
        - name: fileId
          in: query
          description: File ID
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


