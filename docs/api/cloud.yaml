          schema:
            type: string
        - name: name
          in: query
          description: State name
          required: true
          schema:
            type: string
        - name: overwrite
          in: query
          description: Overwrite the entire state with completely new content
          schema:
            type: boolean
        - name: upd
          in: query
          description: >-
            Array of updated or added top level properties of the state.
            <br>Used with overwrite=true to inform a partner's cloud.
