components:
  securitySchemes:
    userApiKey:
      type: apiKey
      in: header
      name: API_KEY
      description: End-user or Admin API key
    adminApiKey:
      type: apiKey
      in: header
      name: API_KEY
      description: Admin API key
    botApiKey:
      type: apiKey
      in: header
      name: ANALYTIC_API_KEY
      description: Bot instance's API key
    tempApiKey:
      type: apiKey
      in: query
      name: API_KEY
      description: Temporary API key
    surveyApiKey:
      type: apiKey
      in: query
      name: API_KEY
      description: Temporary Survey API key
    basicDeviceAuth:
      type: http
      scheme: basic
      description: Basic device authorization `Basic deviceId:authToken`
    basicOAuth:
      type: http
      scheme: basic
      description: Basic OAuth 2.0 authorization `Basic clientId:secret`

  schemas: {}
tags:
  - name: Cloud Connectivity
  - name: Authentication
    description: |-
      API client's authentication is performed with the API key (token) that is included in the request header.
      This API key is retrieved when the user logs in with the `login` or `loginByKey` API methods.
      The user's key is applied in future API calls with the `API_KEY: {key}` HTTP header to access details about this user's account.
      It is the responsibility of the application developer to securely store, manage, and communicate users' API keys.

      The API key is generated in the JWT format. It must be signed by Care Daily cloud or by a trusted user authentication provider recognized by Care Daily.

      API key header fields:

      | Name | Description | Supported values | Required |
      | :--: | ----------- | ---------------- | :------: |
      | alg | Signature algorithm | EdDSA, RS512, RS256 | * |
      | kid | Signature key ID | String | * |

      API key payload fields (claims):

      | Name | Description | Supported values | Required |
      | :--: | ----------- | ---------------- | :------: |
      | iss | Issuer | Care Daily cloud | * |
      | exp | Expiration time | Seconds since Epoch | * |
      | uid | Care Daily user ID | Integer | * |
      | aid | API key type | 0 = end user<br>11 = administrator<br>13 = OAuth 2.0 access token<br>14 = OAuth 2.0 refresh token<br>15 = service | |
      | ukv | Key version | Current user key version | |
      | lid | Location ID | OAuth 2.0 token's location | |
      | cid | Client ID | OAuth 2.0 client | |
      | state | Additional data | | |

  - name: User Accounts
    description: |-
      A user account represents a person who can use the services provided by the Care Daily AI Platform.

      The Care Daily AI Platform enables developers to capture a wide range of information on a user, as needed to add value to the application.
      All the user fields below are optional, except when otherwise specified by the API.

      The user's `password` is always transmitted inside the HTTP body or header, allowing it to be encrypted.
      
      ## User Permissions
      
      | Value | Description |
      | :---: | ----------- |
      | 0 | Access any data |
      | 1 | Grant roles to other users |
      | 2 | Access to all reports | 
      | 3 | Access to users, locations, devices data in specific organizations |
      | 4 | Create/update/delete organizations, groups, administrators |
      | 5 | Subscription services administrator |
      | 6 | AI bot store administrator |
      | 7 | System management |
      | 8 | Customer service |
      | 9 | Access to data export in specific organizations |
      | 10 | Integration service account |

      ## User Account Information

      <table>
      <tr><th>Field</th><th>Type</th><th>Description</th></tr>
      <tr><td>id</td><td>integer</td><td>User ID</td></tr>
      <tr><td>username</td><td>string</td><td>Username</td></tr>
      <tr><td>altUsername</td><td>string</td><td>Alternative (second) username</td></tr>
      <tr><td>passwordSet</td><td>boolean</td><td>User has a password</td></tr>
      <tr><td>passwordStrong</td><td>boolean</td><td>The password corresponds to the "strong" password criteria</td></tr>
      <tr><td>firstName</td><td>string</td><td>User's first name</td></tr>
      <tr><td>lastName</td><td>string</td><td>User's last name(s)</td></tr>
      <tr><td>communityName</td><td>string</td><td>User's community pseudo name.</td></tr>
      <tr><td>organizationId</td><td>integer</td><td>Organization ID used the user's creation.</td></tr>
      <tr><td>appName</td><td>string</td>
        <td>Each app on the Care Daily AI Platform identifies itself with a unique name.
          Presence on iOS, for example, grabbed the appName "Presence", while Presence on Android uses "Presence-Android".
          The appName field can trigger unique Welcome emails to be sent to users, and also enable insightful user analytics and crowd feedback.</td>
      </tr>
      <tr><td>email</td><td>string</td><td>An email address</td></tr>
      <tr><td>email 'status'</td><td>numeric</td>
          <td>Email address status.<br>
          0 - OK<br>
          1 - Hard Bounce<br>
          2 - Spam complaint<br>
          3 - Bad address<br>
          4 - Spam notification
          </td>
      </tr>
      <tr><td>email 'verified'</td><td>boolean</td><td>the email address was verified</td></tr>
      <tr><td>emailResetStatus</td><td>boolean</td>
          <td>Update the user with emailResetStatus = true to reset the email address status to OK.
          This will allow the Care Daily AI Platform to continue attempting to deliver emails to the user's address.
          If the email delivery has a problem again, the cloud will update the email status back to an error state.</td>
      </tr>
      <tr><td>language</td><td>string</td><td>User's preferred language. For example:<br>
          en - English<br>
          cn - Chinese<br>
          fr - French<br>
          ru - Russian<br>
          etc</td>
      </tr>
      <tr><td>medicalRecordNumber</td><td>string</td><td>Medical Record Number</td></tr>
      <tr><td>pronounId</td><td>integer</td><td>User's pronoun ID. See the get pronouns API.</td></tr>
      <tr><td>avatarFileId</td><td>integer</td><td>Avatar app file ID</td></tr>
      <tr><td>phone</td><td>string</td><td>Phone number</td></tr>
      <tr><td>phoneType</td><td>integer</td>
          <td>0 - Unknown<br>
          1 - Cell<br>
          2 - Home<br>
          3 - Work<br>
          4 - Office</td>
      </tr>
      <tr><td>smsStatus</td><td>integer</td>
          <td>If a user can receive on SMS:<br>
          0 - Unknown<br>
          1 - Yes, verified<br>
          2 - Probably, but not verified<br>
          3 - No, invalid phone number</td>
      </tr>
      <tr><td>smsResetStatus</td><td>boolean</td><td>Reset user's phone number SMS status to unknown</td></tr>
      <tr><td>anonymous</td><td>boolean</td>
          <td>When the user sends messages in a community social network, enabling this flag will cause their name to be hidden when they send messages
          and on lists of individuals who are part of a group inside an organization, etc. Default is false.</td>
      </tr>
      <tr><td>accessibility</td><td>integer</td>
          <td>Bitmask representation of accessibility preferences:<br>
          0 - None<br>
          1 - Visual impairment<br>
          2 - Hearing impairment<br>
          4 - Mobility impairment<br>
          8 - Сommunication impairment<br>
          16 - Physical impairment<br>
          32 - Cognitive impairment<br>
          </td>
      </tr>
      <tr><td>birthDate</td><td>string</td><td>User's birth date in the `yyyy-MM-dd` format</td></tr>
      <tr><td>gender</td><td>integer</td>
          <td>User's gender:<br>
          0 - Unknown or prefer not to set<br>
          1 - Male<br>
          2 - Female<br>
          3 - Other</td>
      </tr>
      <tr><td>permission</td><td>numeric array</td><td>Additional <a href="#tag/User-Accounts/User-Permissions">user permissions</a></td></tr>
      </table>

      ## Location Information

      A location represents a physical place occupied by this person and where his or her devices can be installed.
      When creating or updating location information in a user's account, all fields are optional:

      <table>
      <tr><th>Request</th><th>Description</th><th>Details</th></tr>
      <tr><td>name</td><td>string</td><td>Name of the location (i.e. "My House" or "Upstairs Bedroom")</td></tr>
      <tr><td>type</td><td>numeric</td><td>
          10 - Residence<br>
          11 - Rental unit<br>
          20 - General business / Other<br>
          21 - Municipal / Government<br>
          22 - Hotel / Lodging<br>
          23 - Restaurant<br>
          24 - Retail<br>
          25 - Office<br>
          30 - Common Area<br>
          31 - Elevator<br>
          32 - Hall<br>
          33 - Stairway<br>
          34 - Entrance<br>
          35 - Laundry<br>
          36 - Parking/Garage<br>
          40 - Amenity Area<br>
          41 - Gym<br>
          42 - Pool/Spa<br>
          50 - Utility Area<br>
          51 - Staff Room<br>
          52 - Entertainment<br>
          </td>
      </tr>
      <tr><td>subType</td><td>integer</td><td>Location sub-type<br>0 - All<br>1 - Devices Only</td></tr>
      <tr><td>parentIds</td><td>integer</td><td>Parent location IDs</td></tr>
      <tr><td>event</td><td>string</td><td>The last user in location status like HOME, AWAY, SLEEP, VACATION, etc. It is used in analytic rules.</td></tr>
      <tr><td>timezone</td><td>Timezone ID</td><td>User's timezone ID. For example, "US/Pacific" or "GMT+0800".
          See the <a href="#section/Date-and-Time-Formats">Date and Time Formats</a> for more details.</td></tr>
      <tr><td>appName</td><td>string</td><td>App name used to create this location</td></tr>
      <tr><td>language</td><td>string</td><td>Preferred language for location states and narratives</td></tr>
      <tr><td>externalId</td><td>string</td><td>Location's ID in partner's cloud</td></tr>
      <tr><td>locationUser</td><td>object</td><td>User properties on the location</td></tr>
      <tr><td>fileUploadPolicy</td><td>integer</td>
          <td>0 - Keep old files<br>
          1 - Automatically delete old files<br>
          N &gt; 1 - Automatically delete files created earlier than N days ago<br><br>
          By default, the Care Daily AI Platform will automatically delete old files (i.e. videos and images) once a user's account is full, such as videos and images.</td>
      </tr>
      <tr><td>priorityCategory</td><td>integer</td><td>Priority category</td></tr>
      <tr><td>priorityRank</td><td>integer</td><td>Priority rank</td></tr>
      <tr><td>priorityComment</td><td>string</td><td>Priority comment</td></tr>
      <tr><td>priorityDate</td><td>string</td><td>Last priority change date</td></tr>
      <tr><td>addrStreet1</td><td>string</td><td>Address - Street 1</td></tr>
      <tr><td>addrStreet2</td><td>string</td><td>Address - Street 2</td></tr>
      <tr><td>addrCity</td><td>string</td><td>Address - City</td></tr>
      <tr><td>state</td><td>integer</td><td>State identifier.
          Use the <a href="#/reference/locations/countries-states-time-zones">Countries, states, and time zones API</a> to obtain numeric identifiers for each state supported on the Care Daily AI Platform.
          If you need to add more states to support a specific region, please contact support@caredaily.ai.</td></tr>
      <tr><td>country</td><td>integer</td><td>Country identifier.
          Use the <a href="#tag/Locations/operation/Get%20Countries,%20States,%20Time%20Zones">Countries, states, and time zones API</a>
          to obtain numeric identifiers for each state supported on the Care Daily AI Platform.
          If you need to add more countries to support a specific region, please contact support@caredaily.ai.</td></tr>
      <tr><td>zip</td><td>string</td><td>Zip / Postal Code</td></tr>
      <tr><td>latitude</td><td>string</td><td>The latitude in degrees</td></tr>
      <tr><td>longitude</td><td>string</td><td>The longitude in degrees</td></tr>
      <tr><td>salesTaxRate</td><td>string</td><td>Sales tax rate. The value must be positive and less than 1.</td></tr>
      <tr><td>test</td><td>boolean</td><td>This is a test location.</td></tr>
      <tr><td>codeType</td><td>integer</td><td>Location code type</td></tr>
      <tr><td>size</td><td>An object containing 'unit' and 'value'</td>
      <td>This represents the approximate size of the location.
          Please see the request example for more details. Size units:<br>ft2 - Square Foot<br>m2 - Square Meter</td></tr>
      <tr><td>storiesNumber</td><td>numeric</td><td>Number of stories in the home / building.</td></tr>
      <tr><td>roomsNumber</td><td>numeric</td><td>Number of rooms.</td></tr>
      <tr><td>bathroomsNumber</td><td>numeric</td><td>Number of bathrooms.</td></tr>
      <tr><td>utilityAccountNo</td><td>string</td>
        <td>Utility account number, when this user account is linked to acquire data from a utility.</td></tr>
      <tr><td>occupantsNumber</td><td>numeric</td><td>Total number of people living / working at this location.</td></tr>
      <tr><td>usagePeriod</td><td>numeric</td>
        <td>Keeps a note about when the location is used by people.<br>1 - Day<br>2 - Night<br>3 - Both</td></tr>
      <tr><td>heatingType</td><td>numeric</td>
          <td>This is a bitmap that describes the type of heating that is used at this location.<br>
          1 - Electric<br>
          2 - Natural Gas<br>
          4 - Propane<br>
          8 - Oil<br>
          16 - Biomass<br>
          64 - Other</td>
      </tr>
      <tr><td>coolingType</td><td>numeric</td>
          <td>This is a bitmap that describes the type of cooling that is used at this location.<br>
          1 - Central A/C<br>
          2 - Window A/C<br>
          4 - Open windows / fans<br>
          64 - Other</td>
      </tr>
      <tr><td>waterHeaterType</td><td>numeric</td>
          <td>This is a bitmap that describes the type of water heating that is used at this location.<br>
          1 - Electric<br>
          2 - Natural Gas<br>
          4 - Propane<br>
          8 - Oil<br>
          16 - Biomass<br>
          32 - Solar<br>
          64 - Other</td>
      </tr>
      <tr><td>thermostatType</td><td>numeric</td>
          <td>This is a bitmap that describes the type of thermostat that is used at this location.<br>
          1 - Non-programmable<br>
          2 - Programmable<br>
          3 - Internet Connected</td>
      </tr>
      </table>

  - name: Locations

  - name: Synthetic APIs
    description: |-
      Synthetic APIs are provided exclusively by bots which run at the application layer.

      Advantages to Synthetic APIs include:
      * Faster time-to-market
      * Rapid development of application capabilities without involving server engineering or QA platform regression testing
      * End-user facing capabilities can expand and contract based on the availability of subscriptions and bots

      Specific Synthetic APIs are documented separately since they are not part of the platform itself.
      This style of API design is asynchronous or "split-phase",
      where a Data Stream Message forms the input to the API offered by a bot, and a State variable forms the output.
      Both data stream messages and state variables have addresses as keys, and arbitrary JSON content as values.

      Data Stream Messages get data in from app-to-bot or bot-to-bot.

      State variables are non-volatile memory that usually get data out from bot-to-app or bot-to-bot.
      Time-series state variables can also track changes over time.
      Note that while this API documentation captures HTTP-based APIs for accessing state variables,
      WebSocket APIs do exist which can listen for changes to specific state variables and get updated instantaneously when something changes.

      See [Synthetic APIs documentation](https://github.com/CareDailyAI/docs/tree/main/synthetic_apis) for details.

  - name: Devices
    description: |-
      Devices must be added to a user's account to communicate data with the Care Daily AI Platform.

      A device may be registered through this Application API using a smartphone phone or web portal.
      This is usually the easiest way for users to register a device.

      If the user added a device that is a proxy, then the proxy device may automatically add more devices to the users account as those devices are discovered.

  - name: Device Measurements
    description: >-
      The Care Daily AI Platform interacts with devices and UI's through `parameters`.
      The command channel parameters to the device are completely separate from the measurement channel parameters back from the device;
      that is, if you send a command to a device `outletStatus = 0`,
      then the device must respond back with a measurement showing `outletStatus = 0` before the UI is able to identify the state changed at the device.

  - name: User Communications
    description: |-
      It is extremely important to communicate with your user base, and the Care Daily AI Platform enables communications more comprehensively than any other IoT platform in existence today.
      Whether it's sending messages to your users, allowing your users to talk to each other, or gather quantified feedback from the crowd to drive your roadmap,
      the Care Daily AI Platform takes user communications very seriously and provides a well-rounded set of APIs to manage communications.

      The Care Daily AI Platform supports the following types of user communications:

      * Email notifications with customizable, Velocity-scriptable templates (welcome emails, email address confirmations, password reset, alerts, etc.),
      * Push notifications (alerts, badges, etc.),
      * SMS notifications,
      * In-app messaging (from admin to users and groups, users to other users and groups, replies, etc.),
      * Support requests,
      * Crowd feedback - very powerful CTO-level tool to quantify feature requests and issues across the user base.

  - name: Questions
    description: This set of APIs allows end-users to answer bot and survey questions.

  - name: System and User Properties
    description: |-
      System Properties are one of the most useful tools to manage and synchronize the behavior of production apps, without releasing a new build of the app.
      System Properties are key/value pairs that are distributed across every user in the system.
      The values are plain text. System Properties have been used to specify default "Getting Started" videos to render,
      the Terms of Service signature ID's required to be signed, the quality of the video to render, and the level of debug information to receive from the user base back to the server.

      User Properties are key/value pairs that are specific to a user, and can override System Properties.
      User properties can store arbitrary details about the user, beyond what the User Account and Location can store.
      For example, a developer may want to store the user's preferences for a particular application behavior.

      In the Care Daily AI Platform, a system administrator may specify and update a System Properties at the server.
      Please contact support@caredaily.ai if you would like to create or update a System Property for your app.

      System and User property names (keys) do not have spaces. Property names can be a maximum of 250 characters.
      The maximum limit on the user property value is dependent upon the API used to upload the value, either 250 characters if uploaded as a URL parameter,
      and 10,000 characters if uploaded in the body of a JSON payload.

  - name: Application Files
    description: |-
      The Care Daily AI Platform allows to store application specific binary files associated with users, locations or devices.
      For example, apps can store user images (avatars), location plans, device installation pictures.

      Files may be named. Also, they are distinguished by types.

      User's image named as `AVATAR` will be marked as the user's avatar file.
      
      Type of file:
      
      | Type | Name |
      | :--: | ---- |
      | 1 | User's image |
      | 2 | Location's image |
      | 3 | Device's image |
      | 4 | Bitmap mask |
      | 5 | Any |

  - name: Subscriptions
    description: |-
      The Care Daily AI Platform facilitates sales of software services, and physical products.

      ## Subscription Types

      Subscription update periods.

      | Value | Description |
      | :---: | ----------- |
      | 1 | One-time purchase |
      | 2 | Weekly |
      | 3 | Monthly |
      | 4 | Annual |
      | 5 | Daily |

      ## Payment Types

      Payment types as based on payment gateways and service providers.

      | Value | Description |
      | :---: | ----------- |
      | 0 | Manual |
      | 1 | Apple in-app-purchase |
