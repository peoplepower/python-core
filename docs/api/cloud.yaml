      ## Unit Multipliers

      Unit multipliers are used to normalize data before storing the data to the database.

      For example: if a parameter `ppc.power` was created with a unit multiplier of "1" and units of "W",
      then incoming measurement of 1.0 kW for the parameter `ppc.power` will
      automatically be converted to 1000 W before storing the value to the IoT Software Suite.

      | Multiplier | Value | Description |
      | :--------: | :---: | ----------- |
      | n | 0.000000001 | Nano |
      | u | 0.000001 | Micro |
      | m | 0.001 | Milli |
      | c | 0.01 | Centi |
      | % | 0.01 | Percent |
      | d | 0.1 | Deci |
      | 1 | 1 | Unit Multiplier |
      | NULL (empty) | 1 | Unit Multiplier (implied) |
      | Da | 10 | Deca |
      | h | 100 | Hecto |
      | k | 1000 | Kilo |
      | M | 1000000 | Mega |
      | G | 1000000000 | Giga |

  - name: Clouds Integration
    description: |-
      ## OAuth 2.0 Client

      OAuth 2.0 allows the Care Daily AI Platform to act as a client or a host for a third-party clouds.

      As a client, the Care Daily AI Platform may obtain authorizations from third-party clouds and applications to access user data.

  - name: Energy Management
    description: |-
      Electricity customers are billed on how much energy their homes, businesses, and appliances consume.
      The Care Daily AI Platform enables post-processing and analytics on energy measurements, to slice and dice the data as needed to create a valuable user experience.

      The Care Daily AI Platform contains a Utility Rates Database in the backend to map utility names to their current rates and pricing information.
      This data can help smooth out the deployment of energy-related programs,
      and greatly improve the user experience by converting the nebulous units of kilowatt-hours into something more user-friendly, like monetary value.

  - name: Community

  - name: Weather
    description: These APIs are available for certain organizations only.