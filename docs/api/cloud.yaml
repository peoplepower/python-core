  /cloud/json/fwupdate:
    get:
      summary: Get Firmware Jobs
      operationId: Get Firmware Jobs
      description: |-
        A user can approve or decline an update of his devices with new firmware.
        
        Frimware update job statuses:

        | Status | Description |
        | :----: | ----------- |
        | 1 | Available |
        | 2 | Approved |
        | 3 | Decline |
        | 4 | Started |
        
        This API allows to retrieve a list of available firmware updates for user devices.
      tags:
        - Devices
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: query
          description: Optional filter by device ID
          schema:
            type: string
        - name: index
          in: query
          description: Check update for specific device part
          schema:
            type: string
        - name: firmware
          in: query
          description: Current device firmware version
          schema:
            type: string
        - name: userId
          in: query
          description: Device owner ID for access by an administrator
          schema:
            type: integer
      responses:
        '200':
          description: Firmware update jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  jobs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Job ID
                        index:
                          type: string
                          description: Optional device part to update
                        firmware:
                          type: string
                          description: New firmware version
                        currentFirmware:
                          type: string
                          description: Current firmware version
                        status:
                          type: integer
                          description: Update status
                        forced:
                          type: boolean
                          description: No user's approval required
                        url:
                          type: string
                          description: Firmware downloca URL
                        checkSum:
                          type: string
                          description: Firmware checksum
                        notificationDate:
                          type: string
                          description: Last user's notification date about the available update
                        notificationDateMs:
                          type: integer
                        startDate:
                          type: string
                          description: Update start date
                        startDateMs:
                          type: integer
                        device:
                          type: object
                          description: Updated device properties
                          properties:
                            id:
                              type: string
                            type:
                              type: integer
                            typeCategory:
                              type: integer
                            desc:
                              type: string
                            lastDataReceivedDate:
                              type: string
                            lastDataReceivedDateMs:
                              type: integer
              example:
                resultCode: 0
                jobs:
                  - id: 123
                    index: BLE
                    firmware: 1.4.5
                    currentFirmware: 1.2.3
                    status: 2
                    forced: false
                    url: https://fw.peoplepowerco.com/update_1_0_10.apk
                    checkSum: 391bd1de48e2539ea2a9795365a313046238e2b8c88fd6b8d4fbb113dbf93085
                    notificationDate: '2014-06-20T12:47:11-07:00'
                    notificationDateMs: 1403293631000
                    startDate: '2014-06-20T12:47:11-07:00'
                    startDateMs: 1403293631000
                    device:
                      id: GATEWAY_ID
                      type: 31
                      typeCategory: 18000
                      desc: Gateway
                      lastDataReceivedDate: '2014-12-26T02:31:09-05:00'
                      lastDataReceivedDateMs: 1419579069000
    put:
      summary: Set Firmware Update Status
      operationId: Set Firmware Update Status
      description: |-
        Approve or decline a not forced firmware update job.

        The user can schedule the update after specific date and time.
      tags:
        - Devices
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: query
          description: Device ID
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: New job status:<br>2 - approved<br>3 - declined
          required: true
          schema:
            type: integer
        - name: index
          in: query
          description: Update firmware of specific device part
          schema:
            type: string
        - name: startDate
          in: query
          description: Firmware update start date
          schema:
            type: string
        - name: userId
          in: query
          description: Device owner ID for access by an administrator
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


