                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              parameter:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                    value:
                                      type: string
                                  required:
                                    - name
                                    - value
                            required:
                              - id
                              - parameter
                        and:
                          type: array
                          items:
                            type: object
                            properties:
                              state:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    id:
