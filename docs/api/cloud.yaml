                              type: integer
                              description: Parent Section ID (optional)
                            orderNum:
                              type: integer
                              description: Ordering number within the survey or the parent section
                            title:
                              type: string
                              description: Optinal section title
                      questions:
                        type: array
                        items:
                          type: object
                          properties:
                            questionKey:
                              type: string
                              description: Question key uniqie within the survey
                            sectionId:
                              type: integer
                              description: Section ID
                            orderNum:
                              type: integer
                              description: Ordering number within the the section
                            question:
                              type: string
                              description: Question text
                            responseType:
                              type: integer
                              description: Answer type
                            displayType:
                              type: integer
                              description: UI display type for each type of answer (for example, yes/no vs. on/off switch, or a slider that shows integers vs. a slider that shows minutes:seconds)
                            answerFormat:
                              type: string
                              description: Regular expression to validate answer format in UI.
                            slider:
                              type: object
                              description: Slider
                              properties:
                                min:
                                  type: integer
                                  description: Answer minimum value
                                max:
                                  type: integer
                                  description: Answer maximum value
                                inc:
                                  type: integer
                                  description: Slider increment
                                minDesc:
                                  type: string
                                  description: Description of slider minimum value
                                maxDesc:
                                  type: string
                                  description: Description of slider maximum value
                                unitsDesc:
                                  type: string
                                  description: Unit description
                            responseOptions:
                              type: array
                              description:
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    description: ID number for types of questions that feature a list of options
                                  text:
                                    type: string
                                    description: Description of the option
