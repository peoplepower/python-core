      | 5 | Shopify |

  - name: Professional Monitoring
    description: |-
      The Care Daily AI Platform is wired for professional monitoring.
      We connect with a 5-diamond certified central station in North America.
      This can be replaced with your own professional monitoring call center to enable international services and professional monitoring.

  - name: Device Files
    description: |-
      The Care Daily AI Platform securely manages sensitive binary files associated with a user's account.
      For example, these files may be videos, images, audio, or other types of data.

      Files may also be replaced. For example, you may upload a preview video and later replace it with a full sized video when recording is complete.

      The file upload mechanism is compatible with devices; that is, you do not need a valid API key to upload a file.

      After uploading a file, a separate `<alert>` measurement from the device will trigger emails and push notifications to go out with the appropriate message to the user.
      
      Type of file:
      
      | Type | Name |
      | :--: | ---- |
      | 0 | Any |
      | 1 | Video |
      | 2 | Image |
      | 3 | Audio |
      | 4 | Bitmap mask |
      | 5 | Text log |

  - name: Rules Engine
    description: |-
      Care Daily designed, from the ground up, a natural language rules engine for the Care Daily AI Platform to intuitively orchestrate devices across multiple manufacturers and vendors.
      Rules take on the form "If This Then That", and can expand to many AND's or OR's: "If This and this and this and this, then that and that and that and that".

      Complete sentences are formed to define a valid rule. Each sentence consists of phrases of the following types:

      * **Triggers** - A trigger is a type of condition that will trigger the evaluation of the rest of the rule.
        Triggers represent a single moment in time. Each valid rule must have exactly one trigger. For example: "the light turned on" / "the light turned off"
      * **States** - A state is a type of condition that must be met for the rule to execute. A rule may define zero or more states.
        We typically AND states together for user simplicity, but the Care Daily AI Platform also supports OR statements. For example, "the light is on" / "the light is off".
      * **Actions** - An action is what takes place if the trigger executes while all the state conditions are met.
        A valid rule must have at least one action. For example, "make the light turn on" / "make the light turn off".

      Rules may notify the user of an event over email or text message.
      When the notification is sent to the user, the Care Daily AI Platform rules engine helps transform the natural language phrase into past-tense.
      For example, if a user has defined a rule: "If my 'Living Room Camera' detects motion and I am away, then notify me on my phone",
      then the user will receive the past-tense notification, "Your 'Living Room Camera' detected motion while you were away!".
      These notifications may be customized by the client app.

      The Care Daily AI Platform developers may define default rules for device types under their control.
      Rules may also be hidden, to give the device some automated default capabilities
      when the device is added to the user's account without allowing the user to delete this automated functionality.
      For example, a manufacturer may create a hidden rule to automatically alert the user when the device's battery is running low,
      "If my 'Door Sensor' is running low on battery, then notify me on my phone and notify me by email.".

      ## Phrases

      The API will return `type` and `display` attributes for each phrase.
      The app or client is only concerned about the contents of `display`, which describes how to render this phrase for the user.
      The `type` attribute is used by the Care Daily AI Platform itself, and rarely used by the client.

      ### Triggers

      | 'display' Value | Description | Details |
      | :-------------: | ----------- | ------- |
      | 11 | Schedule | This type of trigger is based on a schedule. For example, "If the time is 8:00 PM on school nights". |
      | 12 | Event | Location event, such as 'HOME', 'AWAY', etc. |
      | 13 | Device Alert | Device alert like "motion detected" |
      | 14 | New Device Data | Measurements |
      | 15 | Countdown | Check, if something did not happen in specified period of time |

      ### States

      | 'display' Value | Description | Details |
      | :-------------: | ----------- | ------- |
      | 21 | General state condition | Type 21 simply means this phrase is a state condition. This is the only 'type' field available for a state. |
      | 22 | Location state | This phrase is to say "I am home" or "I am away" |
      | 23 | Device parameter state | This phrase is to specify a state for a device parameter, such as "temperature is greater than 73 degrees Fahrenheit" for example. |

      ### Actions

      | 'display' Value | Description | Details |
      | :-------------: | ----------- | ------- |
      | 31 | Push notification action | Send a push notification to the user |
      | 32 | Email action | Send an email notification to the user |
      | 33 | Send a command | Send a command to a device |
      | 34 | Set event | Set a new location event, such as 'HOME', 'AWAY', etc. |

      ## Parameters

      Phrases are sometimes constructed with additional parameters to specify the phrase.
      When numeric user input is required, a parameter `type` field describes how to present the data.

      The following table describes the basic types of parameters used in rule phrases.

      ### Parameter Categories

      | Parameter 'category' | Description | Details |
      | :------------------: | ----------- | ------- |
      | 1 | User input required | This parameter in a rule phrase requires some user input to define |
      | 2 | Cron expression | This parameter will fire periodically, based on a cron job |
      | 4 | Location ID | This parameter requires the user to specify a location |
      | 5 | Device ID | This parameter requires a device |
      | 6 | Index | This parameter requires the user to specify a part of a device (i.e. Socket 0, Socket 1, Socket 2, etc.) |
      | 9 | Location Event | Location event, such as 'HOME', 'AWAY', etc. Multiple values are supported as a comma separated list like 'AWAY,VACATION'. |
      | 10 | Notification Text | This parameter requires the notification text to send to the user, which is generated by the UI with optional help from the individual rule phrases. |
      | 11 | Parameter name | Specify a parameter name from the device |
      | 12 | Property name | Specify a property name from the device |
      | 13 | Enumeration | A list of id/name pairs |
      | 14 | App name | Application name |
      | 15 | Selecting enumeration | A list of id/name pairs selecting by other parameter value |

      ## Parameter Input Types

      | Parameter 'type' | Description | Details |
      | :--------------: | ----------- | ------- |
      | 1 | int | Present the user input as an integer |
      | 2 | float | Present the user input as a float |

      ### Request and Response Attributes

      | Attribute | Description | Details |
      | --------- | ----------- | ------- |
      | triggers | object | Array of possible trigger objects |
      | states | object | Array of state objects |
      | actions | object | Array of action objects |
      | parameters | object | A parameter to complete the rule phrase |
      | calendar | object | Calendar objects specify when the Care Daily AI Platform should allow (include) or prevent (exclude) the rule from executing. The burden is currently put on the UI to transform this into a state. |
      | status | integer | Rule status<br><b>0</b> - incomplete<br><b>1</b> - Active<br><b>2</b> - Inactive |
      | name | string | A descriptive name of the rule phrase, from the developer of the phrase. Usually not displayed to the user. |
      | type | integer | Ignore this |
      | display | integer | The type of phrase, see the triggers / states / actions 'display' value tables above |
      | functionGroup | string | Well known functionality name allowing to use this phrase in specific conditions |
      | timezone | boolean | When 'true', this phrase will require the UI or user to reconfirm the timezone in which it should execute. We usually confirm the timezone when the user hits Save. |
      | desc | string | Present-tense description to display to the user. Any word identified with a $ character refers to a parameter that is part of the rule. Those special references should be replaced by the corresponding parameter's actual value. |
      | past | string | Past-tense phrase for use in notifications. Any word identified with a $ character refers to a parameter that is part of the rule. Those special references should be replaced by the corresponding parameter's actual value. |
      | serviceName | string | Paid service name, if this rule phrase is available only for users with this service. |

      ### Rule Phrase Parameters

      | name | type | A descriptive name of the parameter, from the developer. Usually not displayed to the user. |
      | ---- | :--: | ------- |
      | category | integer | See the parameter categories table above, for the type of input that is required. |
      | optional | boolean | When 'true', this parameter is optional to fill out. |
      | desc | string | A short user friendly question or brief instructions to display to the user that gets the user to correctly fill out the parameter. |
      | values | object | An object containing the possible values for the parameter, for example a list of devices and their nicknames that this rule phrase would apply to. |
      | selectorName | string | A name of other parameter used as a selector in id/name enumeration list. |
      | value | string | A default value for this parameter. |
      | minValue | numeric | The minimum acceptable numeric value for this parameter, for UI sliders. |
      | maxValue | numeric | The maximum acceptable numeric value for this parameter, for UI sliders. |
      | valueType | integer | If specified, this value is integer (1) or float (2). |
      | unit | string | Optional measure parameter unit (e.g. 'minute', 'hour', 'degrees C'). |

      ### Rule Calendar

      <table>
      <tr><td>daysOfWeek</td>
          <td>integer</td><td>The daysOfWeek can be specified for a calendar tag to allow (include) or not allow (exclude) the rule to run on specific days.
          As this is a bitmapped value, days can be logically-OR'd together to specify repeating days of the week.<br>
      <b>1</b> - Sunday (1 << 0)<br>
      <b>2</b> - Monday (1 << 1)<br>
      <b>4</b> - Tuesday (1 << 2)<br>
      <b>8</b> - Wednesday (1 << 3)<br>
      <b>16</b> - Thursday (1 << 4)<br>
      <b>32</b> - Friday (1 << 5)<br>
      <b>64</b> - Saturday (1 << 6)</td></tr>
      <tr><td>startTime</td><td>seconds</td>
        <td>Start time, in seconds, of a period of time to allow (include) or prevent (exclude) this rule from executing.
        The value may range from 0 to ((24 * 60 * 60) - 1) seconds.</td></tr>
      <tr><td>endTime</td><td>seconds</td>
        <td>End time, in seconds, of a period of time to allow (include) or prevent (exclude) this rule from executing.
        The value may range from 0 to ((24 * 60 * 60) - 1) seconds, and may cross over midnight.</td></tr>
      </table>

      ## Cron Expressions

      This tutorial is copied from the Quartz Scheduler Documentation

      ### Introduction

      `cron` is a UNIX tool that has been around for a long time, so its  scheduling capabilities are powerful and proven.
      The `CronTrigger` class is based on the scheduling capabilities of cron.

      CronTrigger uses "cron expressions", which are able to create firing schedules such as: "At 8:00am every Monday through Friday" or "At 1:30am every last Friday of the month".

      Cron expressions are powerful, but can be pretty confusing.
      This tutorial aims to take some of the mystery out of creating a cron expression, giving users a resource which they can visit before having to ask in a forum or mailing list.

      ### Format

      A cron expression is a string comprised of 6 or 7 fields separated by white space.
      Fields can contain any of the allowed values, along with various combinations of the allowed special characters for that field.
      The fields are as follows:

      | Field | Mandatory | Values | Special Characters |
      | ----- | :-------: | ------ | ------------------ |
      | Seconds | * | 0-59 | , - * / |
      | Minutes | * | 0-59 | , - * / |
      | Hours | * | 0-23 | , - * / |
      | Day of month | * | 1-31 | , - * ? / L W |
      | Month | * | 1-12 or JAN-DEC | , - * / |
      | Day of week | * | 1-7 or SUN-SAT | , - * ? / L # |
      | Year | | empty, 1970-2099 | , - * / |

      So cron expressions can be as simple as this: `* * * * ? *` or more complex, like this: `0/5 14,18,3-39,52 * ? JAN,MAR,SEP MON-FRI 2002-2010`

      ### Special Characters

      <ul><li>
      <p><strong>*</strong> (<em>"all values"</em>) - used to select all values within a field.<br/>
      For example, "<em>" in the minute field means *"every minute"</em>.</p>
      </li>
      <li>
      <p><strong>?</strong> (<em>"no specific value"</em>) - useful when you need to specify something in one of the two fields in which the character is allowed, but not the other.<br/>
      For example, if I want my trigger to fire on a particular day of the month (say, the 10th),
      but don't care what day of the week that happens to be, I would put "10" in the day-of-month field, and "?" in the day-of-week field.
      See the examples below for clarification.</p>
      </li>
      <li>
      <p><strong>-</strong> - used to specify ranges.<br/>
      For example, "10-12" in the hour field means <em>"the hours 10, 11 and 12"</em>.</p>
      </li>
      <li>
      <p><strong>,</strong> - used to specify additional values.<br/>
      For example, "MON,WED,FRI" in the day-of-week field means <em>"the days Monday, Wednesday, and Friday"</em>.</p>
      </li>
      <li>
      <p><strong>/</strong> - used to specify increments.<br/>
      For example, "0/15" in the seconds field means <em>"the seconds 0, 15, 30, and 45"</em>.
      And "5/15" in the seconds field means <em>"the seconds 5, 20, 35, and 50"</em>.<br/>
      You can also specify '/' after the '<strong>' character - in this case '</strong>' is equivalent to having '0' before the '/'.
      '1/3' in the day-of-month field means <em>"fire every 3 days starting on the first day of the month"</em>.</p>
      </li>
      <li>
      <p><strong>L</strong> (<em>"last"</em>) - has different meaning in each of the two fields in which it is allowed.<br/>
      For example, the value "L" in the day-of-month field means <em>"the last day of the month"</em> - day 31 for January, day 28 for February on non-leap years.
      If used in the day-of-week field by itself, it simply means "7" or "SAT".
      <br/>
      But if used in the day-of-week field after another value, it means <em>"the last xxx day of the month"</em> - for example "6L" means <em>"the last Friday of the month"</em>.
      <br/>
      You can also specify an offset from the last day of the month, such as "L-3" which would mean the third-to-last day of the calendar month.
      <br/>
      <em>When using the 'L' option, it is important not to specify lists, or ranges of values, as you'll get confusing/unexpected results.</em></p>
      </li>
      <li>
      <p><strong>W</strong> (<em>"weekday"</em>) - used to specify the weekday (Monday-Friday) nearest the given day.
      <br/>
      As an example, if you were to specify "15W" as the value for the day-of-month field, the meaning is: <em>"the nearest weekday to the 15th of the month"</em>.
      <br/>
      So if the 15th is a Saturday, the trigger will fire on Friday the 14th.
      <br/>
      If the 15th is a Sunday, the trigger will fire on Monday the 16th. If the 15th is a Tuesday, then it will fire on Tuesday the 15th.
      <br/>
      However if you specify "1W" as the value for day-of-month, and the 1st is a Saturday, the trigger will fire on Monday the 3rd, as it will not 'jump' over the boundary of a month's days.
      <br/>
      The 'W' character can only be specified when the day-of-month is a single day, not a range or list of days.</p>
      </li>
      </ul>

      <blockquote>
        The 'L' and 'W' characters can also be combined in the day-of-month field to yield 'LW', which translates to *"last weekday of the month"*.
      </blockquote>

      <ul>
      <li><strong>#</strong> - used to specify "the nth" XXX day of the month.
      <br/>
      For example, the value of "6#3" in the day-of-week field means <em>"the third Friday of the month"</em> (day 6 = Friday and "#3" = the 3rd one in the month).
      <br/>
      Other examples: "2#1" = the first Monday of the month and "4#5" = the fifth Wednesday of the month.
      <br/>
      Note that if you specify "#5" and there is not 5 of the given day-of-week in the month, then no firing will occur that month.
      </li>
      </ul>

      <blockquote>
        The legal characters and the names of months and days of the week are not case sensitive. MON is the same as mon.
      </blockquote>

      *Examples*

      Here are some full examples:

      | Expression | Meaning |
      | ---------- | ------- |
      | 0 0 12 * * ? | Fire at 12pm (noon) every day |
      | 0 15 10 ? * * | Fire at 10:15am every day |
      | 0 15 10 * * ? | Fire at 10:15am every day |
      | 0 15 10 * * ? * | Fire at 10:15am every day |
      | 0 15 10 * * ? 2005 | Fire at 10:15am every day during the year 2005 |
      | 0 * 14 * * ? | Fire every minute starting at 2pm and ending at 2:59pm, every day |
      | 0 0/5 14 * * ? | Fire every 5 minutes starting at 2pm and ending at 2:55pm, every day |
      | 0 0/5 14,18 * * ? | Fire every 5 minutes starting at 2pm and ending at 2:55pm, AND fire every 5 minutes starting at 6pm and ending at 6:55pm, every day |
      | 0 0-5 14 * * ? | Fire every minute starting at 2pm and ending at 2:05pm, every day |
      | 0 10,44 14 ? 3 WED | Fire at 2:10pm and at 2:44pm every Wednesday in the month of March |
      | 0 15 10 ? * MON-FRI | Fire at 10:15am every Monday, Tuesday, Wednesday, Thursday and Friday |
      | 0 15 10 15 * ? | Fire at 10:15am on the 15th day of every month |
      | 0 15 10 L * ? | Fire at 10:15am on the last day of every month |
      | 0 15 10 L-2 * ? | Fire at 10:15am on the 2nd-to-last last day of every month |
      | 0 15 10 ? * 6L | Fire at 10:15am on the last Friday of every month |
      | 0 15 10 ? * 6L | Fire at 10:15am on the last Friday of every month |
      | 0 15 10 ? * 6L 2002-2005 | Fire at 10:15am on every last Friday of every month during the years 2002, 2003, 2004 and 2005 |
      | 0 15 10 ? * 6#3 | Fire at 10:15am on the third Friday of every month |
      | 0 0 12 1/5 * ? | Fire at 12pm (noon) every 5 days every month, starting on the first day of the month |
      | 0 11 11 11 11 ? | Fire every November 11th at 11:11am |

      <blockquote>
        Pay attention to the effects of '?' and '*' in the day-of-week and day-of-month fields!
      </blockquote>

      ### Notes

      * Support for specifying both a day-of-week and a day-of-month value is not complete (you must currently use the '?' character in one of these fields).
      * Be careful when setting fire times between the hours of the morning when "daylight savings" changes occur in your locale
        (for US locales, this would typically be the hour before and after 2:00 AM - because the time shift can cause a skip or a repeat depending on whether the time moves back or jumps forward).
      * You may find this wikipedia entry helpful in determining the specifics to your locale:
        https://secure.wikimedia.org/wikipedia/en/wiki/Daylight_saving_time_around_the_world

  - name: Products Management
    description: |-
      The Care Daily AI Platform allows developers to create and manage new device types and parameters.
      Each device type defines a category to help organize UI's and groups of devices.

      On the developer platform, only the creator of a device type may see its existence.
      When the device type is ready to move to a production the Care Daily AI Platform instance for commercial deployment,
      we migrate the device type and parameter definitions to the production server.

      ## Device Categories

      | Value | Description |
      | :---: | ----------- |
