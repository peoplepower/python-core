openapi: 3.1.1
info:
  title: 'Care Daily AI and IoT Platform: Application API'
  version: '57'
  description: |-
    The Care Daily AI and IoT Platform is the most comprehensive carrier-grade software suite ever developed for the creation and deployment of family-centric smart home and building services.
    The Care Daily AI Platform supports an AI Marketplace for 24/7 assistive services built with IoT devices, including coordination and communications between families and professionals.

    The Application REST API lets your apps, web consoles, and analytics interact with the Care Daily AI Platform from anywhere you can send an HTTP request.
    
    For example:
    * A mobile app can use the App API to fully connect while pushing all the intelligence of managing people, places, analytics, and data into the Care Daily AI Platform cloud.
    * A Smart TV app can use the App API to give the user control and feedback over his devices and data sources.
    * A web console can use the App API to enable role-based access control for administrators and end users.
    * Your own cloud service can use the App API to connect user's accounts.
    * You can use the Application API to export all your data and enable your own analytics.

    ## Communications

    The Care Daily AI Platform uses JSON data format for requests and responses in most APIs.

    ### JSON Responses

    * https://app.peoplepowerco.com/cloud/json/ for secure responses in JSON from the production cloud.
    * https://sboxall.peoplepowerco.com/cloud/json/ for secure responses in JSON from the sandbox cloud.
    * Use the `Content-Type: application/json` header with all JSON request bodies.

    The `Content-Type` header specifies the format of the data being sent in the request from the client to the Care Daily AI Platform.
    The `Content-Type` header is required for all `POST` and `PUT` request with bodies.

    ### HTTP Status Code

    A 2xx HTTP status code indicates the API request was received successfully.
    Whether the request's execution was successful or not is indicated by the result code inside the JSON response.

    ### HTTP Methods

    The App API supports the following HTTP methods:

    * `POST` - Create a new object with unknown URI
    * `PUT` - Create a new object, or update an existing object with known URI
    * `GET` - Retrieve data
    * `DELETE` - Delete an existing object

    ## Result Codes and Error Messages

    All API methods return a result code 0, if the API call was successful.

    Otherwise, the Care Daily AI Platform returns an error code, the code description,
    a more specific and user-friendly error message describing the problem, and some optional fields with additional details.

    For example:
        
        {
            "resultCode": 0,
            "keyExpire": "2128-06-11T08:53:20Z",
            "keyExpireMs": 5000000000000,
            "keyType": 0
        }
        {
            "resultCode": 19,
            "resultCodeDesc": "Operation is temporary locked",
            "resultCodeMessage": "Friends registration is temporary unavailable",
            "lockTime": 1403293631000,
            "lockTimeout": 60000
        }
        {
            "resultCode": 25,
            "resultCodeDesc": "Child object found",
            "resultCodeMessage": "Device model is used by stories",
            "childType": "story",
            "childObjects": ["story1", "story2"]
        }


    ### Common Result Fields

    | Field | Description |
    | ----- | ----------- |
    | resultCode | Integer result code |
    | resultCodeDesc | Common result code description |
    | resultCodeMessage | Specific and user friendly error message describing the problem |
    | keyExpire | Current user API key expiry |
    | keyExpireMs | Current user API key expiry in milliseconds |
    | keyType | Current user API key type |
    | lockTime | Time in milliseconds until the requested operation is locked |
    | lockTimeout | Relative lock time in milliseconds from the current time |
    | childType | Found child object type |
    | childObjects | Found child object ID's |
    | collectionTotalSize | Sorted collection size |

    ### Result Codes

    Below is a list of all result codes communicated from the Care Daily AI Platform to the client application.

    | Result code | Description |
    | :---------: | ----------- |
    |  0 | Success |
    |  1 | Internal error |
    |  2 | Wrong API key |
    |  4 | Wrong device ID or device has not been found |
    |  5 | Device proxy (gateway) has not been found |
    |  6 | Object not found |
    |  7 | Access denied |
    |  8 | Wrong parameter value |
    |  9 | Missed mandatory parameter value |
    | 10 | No available device resources to complete operation |
    | 11 | Not enough free files space |
    | 12 | Invalid username or wrong password |
    | 14 | Error in parsing of input data |
    | 15 | Missing required paid service for this operation |
    | 16 | User account is locked out |
    | 17 | A passcode, which has been sent to the user, is required to sign in |
    | 18 | Wrong schedule format |
    | 19 | Operation is temporary locked |
    | 20 | Duplicate user name |
    | 21 | Device is offline or disconnected |
    | 22 | Device is under different location |
    | 23 | Rule generation error |
    | 24 | The 2'nd step is required to complete the operation |
    | 25 | Child object found |
    | 26 | Duplicate entity or property |
    | 27 | Server is busy or overloaded and cannot complete the request in reasonable time |
    | 29 | Requested API method not found |
    | 30 | Service is temporary unavailable |
    | 31 | Unknown OAuth client |
    | 32 | External application error response |
    | 33 | Wrong operation token |
    | 34 | Cannot modify external resources |
    | 35 | Wrong phone number |
    | 36 | Operation canceled |
    | 37 | Cannot authorize user on external resource or cloud |
    | 38 | Requested resource is not available |
    | 39 | Device not found on external cloud |
    | 40 | Request not allowed in the current state of the resource |
    | 41 | Request has not been completed. It is not an error, just nothing to do. |
    | 42 | Cannot connect to an external resource |
    | 44 | Too often API calls |
    | 45 | The communication channel is not authenticated |
    | 46 | The password is not strong enough |

    ## Date and Time Formats

    Timestamps are used heavily for measurements, and with active users around the world, it is important to understand how to communicate time and timezones.
    The Care Daily AI Platform accepts relative date and time parameters in *milliseconds* since UNIX epoch, or an absolute `ISO 8601` format.
    It always returns date and time values in `ISO 8601` format and some methods in *milliseconds* since UNIX epoch in a separate field.

    The `ISO 8601` format includes information about the date, time, and timezone in the format: `YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]`.
    This timestamp can be produced in a Linux terminal with `date +%Y-%m-%dT%H:%M:%S%:z`.
    Unfortunately, the date command on Mac computers does not understand the `%:z` timezone flag.

    For example: `2013-04-23T02:25:50-04:00`

    The response timezone is selected by the following rule:

    1. If a query parameter `timeZone` is provided, this timezone will be used.
    This parameter can contain a standard or custom time zone ID like "`US/Pacific`" or "`GMT+0800`". If the timezone is not recognized by the Care Daily AI Platform, UTC will be used.

    2. Otherwise, the requested location timezone is used.

    3. If the location's timezone is not set then UTC is used.

    ## Response Sorting and Limiting

    There are several optional URI query parameters which allow developers to order and limit the returned responses for all GET API methods.
    These are explicitly documented in APIs where they may be especially helpful to manage massive amounts of content on the Care Daily AI Platform.

    * `sortCollection` - Sort by a collection name which needs to be ordered or limited.
    * `sortBy` - The collection element property used for elements comparison in ordering.
    * `sortOrder` - `asc` - Ascending, default; `desc` - Descending.
    * `rowCount` - The number of the collection elements to be returned. Minimum value is 100.
    * `firstRow` - The index of the first collection element to be returned starting from zero.
    If it is not specified, the last rowCount elements will be returned.

servers:
  - url: https://app.peoplepowerco.com/
    description: US production
  - url: https://eu.caredaily.ai/
    description: EU production
  - url: https://sboxall.peoplepowerco.com/
    description: Sandbox

paths:
  /espapi/watch:
    get:
      tags:
        - Cloud Connectivity
      summary: Check Availability
      operationId: Check Availability
      description: >-
        Ping is disabled on all deployed instances of the Care Daily AI Platform for security reasons.
        We use an HTTP GET request to check for cloud availability, which returns `OK` if the Care Daily AI Platform instance is available.
        Combine this with the `time` Linux command to measure the response time of the Care Daily AI Platform.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              example: |
                OK


  /espapi/version:
    get:
      tags:
        - Cloud Connectivity
      summary: Get Version
      operationId: Get Version
      description: Return API version information
      parameters:
        - name: version
          in: query
          description: Return only version number in plain text
          schema:
            type: boolean
        - name: json
          in: query
          description: Return response in JSON format
          schema:
            type: boolean
      responses:
        '200':
          description: Cloud version information
          content:
            application/json:
              schema:
                type: object
                properties:
                  timestamp:
                    type: string
                  module:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Application name
                      version:
                        type: string
                        description: Version number
                      time:
                        type: string
                        description: The last update commit time
                      revision:
                        type: string
                        description: Revision ID
                      path:
                        type: string
                        description: Source branch
                  system:
                    type: object
                    properties:
                      timezone:
                        type: string
                        description: Default time zone
                      charset:
                        type: string
                        description: Default characters set
                      javaVersion:
                        type: string
                        description: Java version
                      javaVendor:
                        type: string
                        description: Java vendor
                      ttlSystem:
                        type: string
                        description: DNS TTL from the sun.net.inetaddr.ttl system property
                  database:
                    type: object
                    properties:
                      version:
                        type: string
                        description: Database schema version
                      variables:
                        type: object
                        description: Database variables map
              example:
                timestamp: '1692819380854'
                module:
                  name: espapi
                  version: '39'
                  time: 2023-08-23T19:16:18+0000
                  revision: 75e9fa6
                  path: main
                system:
                  timezone: UTC
                  charset: UTF-8
                  javaVersion: '17'
                  javaVendor: Oracle Corporation
                  ttlSystem: '0'
                database:
                  version: '645'


  /cloud/json/settings:
    get:
      tags:
        - Cloud Connectivity
      summary: Get Connection Settings
      operationId: Get Connection Settings
      description: |-
        When connecting to the cloud, the first step is to understand available server hosts, ports, and SSL settings to connect.
        This API provides a list of available clouds and servers to connect with.
        The current cloud is always returned first and has more details.

        Authentication is not required.

        The API provides the following information about cloud servers:
        * Application restful API servers for all clouds. 
        * Web application hosts for the current cloud.
        * Device IO API server for this cloud, only if the device ID parameter is provided
        * Streaming /streaming API server for this cloud, only if the device ID parameter is provided

        To obtain same information about other clouds call the same API on the corresponding `appapi` server.
      parameters:
        - name: deviceId
          in: query
          description: When specified, the API will return connection settings for this device.
          schema:
            type: string
        - name: connected
          in: query
          description: |-
            Check, if the device is connected to the streaming server:<br>
            false - return the best available server,<br>
            true - return the server, where the device is connected now or nothing.
          schema:
            type: boolean
        - name: version
          in: query
          description: When specified, the API will return only server of this version and non-version servers.
          schema:
            type: integer
      responses:
        '200':
          description: Cloud Connection Settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  clouds:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Cloud instance name ('Production', 'sbox', etc.)
                        type:
                          type: integer
                          enum: [0,1]
                          description: Cloud type, 0 = production, 1 = test
                        version:
                          type: string
                          description: The current cloud software version
                        currentTime:
                          type: string
                        currentTimeMs:
                          type: integer
                        defaultTimezone:
                          type: object
                          description: Default server timezone
                          properties:
                            id:
                              type: string
                            offset:
                              type: integer
                            dst:
                              type: boolean
                            name:
                              type: string
                        servers:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                enum: [appapi, wsapi, deviceio, mqtt, streaming, webapp]
                                description: |-
                                  Server Type<br>
                                  appapi - restful API<br>
                                  wsapi - websockets API<br>
                                  deviceio - device IO API<br>
                                  mqtt - MQTT<br>
                                  streaming - streaming API<br>
                                  webapp - web UI app
                              host:
                                type: string
                              port:
                                type: integer
                              ssl:
                                type: boolean
                                description: Secured communication
                              brand:
                                type: string
                              version:
                                type: integer
                              path:
                                type: string
                                description: Server specific URI path
                            required:
                              - type
                              - host
                              - port
                              - ssl
                      required:
                        - name
                        - type
                        - servers
              example:
                resultCode: 0
                clouds:
                  - name: Production
                    type: 0
                    version: '51'
                    currentTime: '2015-09-16T18:59:15-04:00'
                    currentTimeMs: 1442444355000
                    defaultTimezone:
                      id: UTC
                      offset: 0
                      dst: false
                      name: Coordinated Universal Time
                    servers:
                      - type: appapi
                        host: app.peoplepowerco.com
                        port: 443
                        ssl: true
                      - type: deviceio
                        host: esp.peoplepowerco.com
                        port: 8443
                        ssl: true
                        path: /deviceio
                      - type: streaming
                        host: esp.peoplepowerco.com
                        port: 8443
                        ssl: true
                      - type: webapp
                        host: app.peoplepowerco.com
                        port: 443
                        ssl: true
                        brand: care
                        version: 4
                  - name: sbox
                    type: 1
                    servers:
                      - type: appapi
                        host: sboxall.peoplepowerco.com
                        port: 443
                        ssl: true


  /cloud/json/settingsServer/{type}:
    get:
      tags:
        - Cloud Connectivity
      summary: Get Server
      operationId: Get Server
      description: |-
        This API returns just one server connection endpoint by type.

        MQTT connection settings should be requested only once at the device start up.
        For other connection types for maximum scalability, we recommend a device checks in with this API every hour to discover, if it needs to switch servers.
        
        In MQTT requests the device ID and the auth token must be provided in the basic `Authorization` header.
        The API returns a certificate PEM and a private key generated for the requested device. They must be stored in a secure place and not shared with other devices.
        In addition the MQTT connectivity section of the API response contains the server endpoint's CA certificate, the MQTT client ID, QOS, and MQTT topics prefix,
        where the device is allowed to publish and subscribe.
      security:
        - basicDeviceAuth: []
      parameters:
        - name: type
          in: path
          description: |-
            Server type
            <br>appapi - restful API
            <br>wsapi - websockets API
            <br>deviceio - device IO API
            <br>mqtt - MQTT
            <br>streaming - streaming API
            <br>webapp - web UI app
          required: true
          schema:
            type: string
            enum: [appapi, wsapi, deviceio, mqtt, streaming, webapp]
        - name: crtTag
          in: query
          description: |-
            Wrap MQTT certificates and a key with the beginning and end tags.<br>
            true = return tags and line breaks,<br>
            false = remove tags and line breaks.<br>
            Default behavior depends on the device type configuration.
          schema:
            type: boolean
        - name: deviceId
          in: query
          description: Device ID to get streaming server
          schema:
            type: string
        - name: connected
          in: query
          description: |-
            Check, if the device is connected to the streaming server:<br>
            false - return the best available server - default,<br>
            true - return the server, where the device is connected now or nothing
          schema:
            type: boolean
        - name: brand
          in: query
          description: Return brand specific server, if available
          schema:
            type: integer
        - name: appName
          in: query
          description: Return app specific server, if available
          schema:
            type: integer
      responses:
        '200':
          description: Cloud Server
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  server:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Server's type as requested
                      host:
                        type: string
                      port:
                        type: integer
                      ssl:
                        type: boolean
                      tlsversion:
                        type: string
                        description: MQTT server TLS version
                  mqtt:
                    type: object
                    description: MQTT server specific properties
                    properties:
                      cacrt:
                        type: string
                        description: Server root CA certificate
                      crt:
                        type: string
                        description: Device certificate
                      key:
                        type: string
                        description: Device key
                      clientId:
                        type: string
                        description: MQTT client ID
                      qos:
                        type: string
                        description: QOS1 usually
                      topicPrefix:
                        type: string
                        description: MQTT topics prefix for publishing and subscription
              example:
                resultCode: 0
                server:
                  type: mqtt
                  host: abc.iot.us-east-1.amazonaws.com
                  port: 443
                  ssl: true
                  tlsversion: TLSv1.2
                mqtt:
                  cacrt: |-
                    -----BEGIN CERTIFICATE-----
                    ...
                  crt: |-
                    -----BEGIN CERTIFICATE-----
                    ...
                  key: |-
                    -----BEGIN RSA PRIVATE KEY-----
                    ...
                  clientId: ABC123
                  qos: QOS1
                  topicPrefix: develco/ABC123


  /cloud/json/settingsServer:
    get:
      tags:
        - Cloud Connectivity
      summary: Get Server URL
      operationId: Get Server URL
      description: This is a simplified version of the previous API to retrieve the server connection URL in the plain text format.
      parameters:
        - name: type
          in: query
          description: Server type
          required: true
          schema:
            type: string
        - name: deviceId
          in: query
          description: |-
            Device ID to receive the device server.
            <br>For maximum scalability, we recommend a device check in with this API about every hour to discover, if it needs to switch servers.
          schema:
            type: string
        - name: connected
          in: query
          description: |-
            Check, if the device is connected to the streaming server:
            <br><b>false</b> - return the best available server,
            <br><b>true</b> - return the server, where the device is connected now or nothing.
          schema:
            type: boolean
        - name: brand
          in: query
          description: Return brand specific server, if available.
          schema:
            type: integer
        - name: appName
          in: query
          description: Return app specific server, if available.
          schema:
            type: integer
      responses:
        '200':
          description: Cloud Server URL
          content:
            plain/text:
              example: https://esp.peoplepowerco.com:8443


  /cloud/json/settingsCloud:
    get:
      tags:
        - Cloud Connectivity
      summary: Get Cloud Instance
      operationId: Get Cloud Instance
      description: |-
        Return the Cloud instance where this specific device should be pointed.
        
        This API must be called only after the first initial device start and/or after a factory reset.
      parameters:
        - name: deviceId
          in: query
          description: Device ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cloud Instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  cloud:
                    type: string
              example:
                resultCode: 0
                cloud: app.peoplepowerco.com


  /cloud/json/login:
    get:
      tags:
        - Authentication
      summary: Login by Username
      operationId: Login by Username
      description: |-
        Allows a user to login using their private credentials (username and password or a temporary pass code).
        This request returns an API key which is linked to the user, and will be used in all future API calls.
        It is the responsibility of the application developer to securely store, manage, and communicate users' API keys.

        There are several user authentication options available:

        ### Login using Password

        A client provides a user's password in the `PASSWORD` header.
        The cloud returns the success result code and an API key.
        
        Care Daily follows the NIST guideline for end-user password requirements
        with extra conditions for admininstrator accounts.
        
        We check that a regular password has at least 8 characters and
        does not contain any personal user's information (first and last names, email address, phone number, username).
        
        A "strong" admininstrator's password must not include repeating character groups following each other:
        * A single character is not repeated 3 times one by one like "aaa" or "BBB".
        * A group of characters longer than 2 is not repeated 2 times like "abcabc".
  
        Also, we check a "strong" password on a dictionary of common English words.
        
        ### Login using Pass Code
        
        A temporary pass code is generated by the cloud and sent to the user using an independent communication channel like SMS or email.
        A client provides a pass code in the `passcode` header.
        
        ### 2-Step Authentication using Passcode
        
        Some users having administrative privileges may be required to use 2-step authentication.
        
        1. A client calls the API using username/password and requesting admin API key type.
        
        2. The cloud sends a pass code to the user and returns the result code 17 (pass code is sent).
        
        3. The client calls the API with the username, the pass code, and the admin API key type withing limited period of time.
        Do not submit the password on this step.
  
        ### 2-Step Authentication using Time-based One-Time Password
        
        If a user has configured a Time-based One-Time Password (TOTP) authentication, a client can request using it on the 2'nd step instead of sending a passcode.
        Google Authenticator and Microsoft Authenticator apps are supported as TOTP code generators.
        
        There are two options to complete thie authencation.
        The first one is useful when the client does not know exactly if the user has configured TOTP authentication.
        It includes 3 steps.
        
        1. The client calls the login API using username/password and requesting admin API key type and TOTP as the `totp=true` parameter.
        
        2. If TOTP is available, the cloud returns the result code 24 (the 2'nd step is required) and a temporary API key.
        
        3. The client calls the [login by key API](#/reference/authentication/login-by-existing-api-key/login-by-key) with the temporary API key,
        the TOTP code in the `passcode` header, and the admin API key type withing limited period of time.
        
        If the client knows that TOTP is available for the user, it can provide all username, password, and the code (in the `passcode` header) in one login API call with the `totp=true` parameter.
        
        ### 2-Step Authentication using Signature
        
        A client can request from the cloud a private RSA key or upload own public RSA key to the user's account.
        The authentication is following:
      
        1. The client calls the API with the username, the password, the admin or service API key type, the `sign=true` parameter, and the `appName` used to generate the signature keys.
        
        2. The cloud returns a very short living key.
        
        3. The client has to sign this key (converted to bytes using UTF-8 encoding).
        
        4. The client calls the API with the username,
        the key's signature in the `passcode` header, `sign=true`, `appName`,
        the signature algorithm name passed in the `signAlgorithm` parameter, and the admin or service API key type.
        Do not submit the password on this step.
        
        Supported signature algorithms, see [PKCS #1](https://www.rfc-editor.org/rfc/rfc2437.txt).
        **SHA512withRSA** is recommended.
        
        | Signature Algorithm | Description |
        | ------------------- | ----------- |
        | NONEwithRSA | The RSA signature algorithm, which does not use a digesting algorithm before performing the RSA operation. |
        | MD2withRSA<br>MD5withRSA | The MD2/MD5 with RSA Encryption signature algorithm, which uses the MD2/MD5 digest algorithm and RSA to create and verify RSA digital signatures |
        | SHA1withRSA<br>SHA224withRSA<br>SHA256withRSA<br>SHA384withRSA<br>SHA512withRSA | The signature algorithm with SHA-* and the RSA encryption algorithm |

      parameters:
        - name: username
          in: query
          description: The username, typically an email address.
          required: true
          schema:
            type: string
        - name: expiry
          in: query
          description: API key expiration period in days, nonzero. By default, this is set to -1, which means the key will never expire.
          schema:
            type: integer
        - name: keyType
          in: query
          description: >-
            API key type:
            <br>0 - end user,
            <br>11 - administrator,
            <br>15 - service
          schema:
            type: integer
        - name: appName
          in: query
          description: Short application name.
          schema:
            type: string
        - name: brand
          in: query
          description: Notification brand
          schema:
            type: string
        - name: clientId
          in: query
          description: Short application client ID to generate a specific user API key.
          schema:
            type: string
        - name: prefDeliveryType
          in: query
          description: Preferred 2'nd step passcode delivery type:<br>2 = email<br>3 = SMS
          schema:
            type: integer
        - name: smsPrefix
          in: query
          description: >-
            Passcode SMS prefix type to automatically parse it by the app:
            <br>1 = Google &lt;#&gt;
          schema:
            type: integer
        - name: appHash
          in: query
          description: 11-character app hash
          schema:
            type: string
        - name: totp
          in: query
          description: Set it to true, if TOTP authentication is supported on the 2'nd step.
          schema:
            type: boolean
        - name: sign
          in: query
          description: Set it to true, if an encrypted signature authentication is used.
          schema:
            type: boolean
        - name: signAlgorithm
          in: query
          description: Signature algorithm
          schema:
            type: string
        - name: PASSWORD
          in: header
          description: User's password
          schema:
            type: string
        - name: passcode
          in: header
          description: Temporary pass code or TOTP code
          schema:
            type: string
      responses:
        '200':
          description: API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  key:
                    type: string
                    description: API Key.<br>Use the API key in the API_KEY header in future API calls for this user.
                  keyExpire:
                    type: string
                    description: Expiration timestamp in ISO 8601 format YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
                  keyExpireMs:
                    type: integer
                    description: Expiration timestamp in milliseconds since UNIX epoch
                  passcodeDeliveryType:
                    type: integer
                    enum: [2,3]
                    description: 2'nd step passcode delivery type:<br>2 = email<br>3 = SMS
              example:
                resultCode: 0
                key: UugJtGEXxMfnVyql4N4crIAfqOUlJ
                keyExpire: '2019-07-01T14:54:54-04:00'
                keyExpireMs: 1562007294000
                passcodeDeliveryType: 3


  /cloud/json/passcode:
    get:
      tags:
        - Authentication
      summary: Send Passcode
      operationId: Send Passcode
      description: |-
        Send a temporary pass code to a user by SMS, if the user has a valid mobile phone number, or by email, if the user has a valid email address.

        See [Google guide](https://developers.google.com/identity/sms-retriever/verify) for Android specific SMS format.
      parameters:
        - name: username
          in: query
          description: The username
          required: true
          schema:
            type: string
        - name: prefDeliveryType
          in: query
          description: Preferred passcode delivery type:<br>2 = email<br>3 = SMS
          schema:
            type: integer
        - name: brand
          in: query
          description: A parameter identifying a customer's specific notification template
          schema:
            type: string
        - name: prefix
          in: query
          description: |-
            Passcode SMS prefix type to automatically parse it by the app:
            <br>1 = Google &lt;#&gt;
          schema:
            type: integer
        - name: appHash
          in: query
          description: 11-character app hash
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  passcodeDeliveryType:
                    type: integer
                    enum: [2,3]
                    description: 2'nd step passcode delivery type:<br>2 = email<br>3 = SMS
              example:
                resultCode: 0
                passcodeDeliveryType: 3


  /cloud/json/loginByKey:
    get:
      tags:
        - Authentication
      summary: Login by Key
      operationId: Login by Key
      description: |-
        This login API allows the user to log in with an existing end-user, admin or temporary API key instead of username and password.
        It is typically used to check if the API key is valid, and to renew the key if it is going to expire soon.
        This API request can also be used generate a temporary key that is valid for only a brief amount of time.
        
        | Key Type | Description | Details |
        | :------: | ----------- | --------|
        |  0 | End user | Default |
        |  1 | Temporary |  |
        | 11 | Administrator | Can be requested only by the administrator key or by the end user key with the 2'nd step or by a TOTP code |
        | 15 | Service | Can be requested only by the service key |
      security:
        - userApiKey: []
      parameters:
        - name: keyType
          in: query
          description: Requested API key type
          schema:
            type: integer
        - name: expiry
          in: query
          description: >-
            API key expiry period in days, nonzero.
            <br>By default the key will never expire.
          schema:
            type: integer
        - name: prefDeliveryType
          in: query
          description: Preferred 2'nd step passcode delivery type:<br>2 = email<br>3 = SMS
          schema:
            type: integer
        - name: brand
          in: query
          description: Notification brand
          schema:
            type: string
        - name: clientId
          in: query
          description: Client ID to retrieve a specific key for this app
          schema:
            type: string
        - name: passcode
          in: header
          description: TOTP code
          schema:
            type: string
      responses:
        '200':
          description: New API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  key:
                    type: string
                    description: API Key
                  keyExpire:
                    type: string
                    description: Expiration timestamp in ISO 8601 format YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]
                  keyExpireMs:
                    type: integer
                    description: Expiration timestamp in milliseconds
                  passcodeDeliveryType:
                    type: integer
                    enum: [2,3]
                    description: 2'nd step passcode delivery type if needed:<br>2 = email<br>3 = SMS
              example:
                resultCode: 0
                key: UugJtGEXxMfnVyql4N4crIAfqOUlJ
                keyExpire: '2019-07-01T14:54:54-04:00'
                keyExpireMs: 1562007294000
                passcodeDeliveryType: 3


  /cloud/json/logout:
    get:
      tags:
        - Authentication
      summary: Logout
      operationId: Logout
      description: Logout the user and securely remove the API key from the server database. All application instances for this user are simultaneously logged out.
      security:
        - userApiKey: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/totp:
    post:
      tags:
        - Authentication
      summary: Create TOTP Secret
      operationId: Create TOTP Secret
      description: |-
        Configure Time-based One-Time Password (TOTP) authentication as the second factor.
  
        All TOTP factor management APIs require 2-step authentication (administrator API key).
        
        The API generates a TOTP Secret and a QR code URL.

        Google Authenticator and Microsoft Authenticator apps are supported.
        The client has to confirm that the secret has been set in the Authenticator app by submitting a code.
      security:
        - adminApiKey: []
      parameters:
        - name: name
          in: query
          description: Device name used to store the authentication factor
          required: true
          schema:
            type: string
        - name: issuer
          in: query
          description: Optional issuer returned in the QR code URL and be displayed in the app
          schema:
            type: string
      responses:
        '200':
          description: TOTP secret and URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  secret:
                    type: string
                    description: Generated 20-byte encoded secret value
                  url:
                    type: string
                    description: QR code URL containing the secret and other information, which can be scalled by the app
                  maxConfirmationTime:
                    type: string
                    description: Time until the secret factor must be confirmed
                  maxConfirmationTimeMs:
                    type: integer
              example:
                resultCode: 0
                secret: QDWSM3OYBPGTEVSPB5FKVDM3CSNCWHVK
                url: >-
                  otpauth://totp/Care%20Daily:username?secret=QDWSM3OYBPGTEVSPB5FKVDM3CSNCWHVK&issuer=Care%20Daily
                maxConfirmationTime: '2022-11-17T02:34:30Z'
                maxConfirmationTimeMs: 1668652438000

    put:
      tags:
        - Authentication
      summary: Confirm TOTP Secret
      operationId: Confirm TOTP Secret
      description: The client has to confirm that the secret has been set in the Authenticator app by submitting a code from the app.
      security:
        - adminApiKey: []
      parameters:
        - name: name
          in: query
          description: Device name used to store the authentication factor
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              code: 123456
            schema:
              type: object
              properties:
                code:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get TOTP Factors
      operationId: Get TOTP Factors
      description: Return active and not expired user's TOTP factors.
      tags:
        - Authentication
      security:
        - adminApiKey: []
      responses:
        '200':
          description: TOTP factors
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  factors:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Device name used to store the authentication factor
                        status:
                          type: integer
                          enum: [0,1]
                          description: Factor status<br>0 - initial<br>1 - confirmed
                        creationDate:
                          type: string
                          description: Creation date
                        creationDateMs:
                          type: integer
                        issuer:
                          type: string
                          description: Factor's issuer
                        maxConfirmationTime:
                          type: string
                          description: Time until the secret factor must be confirmed
                        maxConfirmationTimeMs:
                          type: integer
              example:
                resultCode: 0
                factors:
                  - name: My Phone
                    status: -1
                    creationDate: '2022-11-17T02:30:30Z'
                    creationDateMs: 1668652428000
                    issuer: Care Daily
                    maxConfirmationTime: '2022-11-17T02:34:30Z'
                    maxConfirmationTimeMs: 1668652438000

    delete:
      summary: Delete TOTP Factor
      operationId: Delete TOTP Factor
      tags:
        - Authentication
      security:
        - adminApiKey: []
      parameters:
        - name: name
          in: query
          description: Authentication factor to delete
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/signatureKey:
    get:
      summary: Get Private Key
      operationId: Get Private Key
      description: Generate a new RSA signature private/public keys pair for the user.
      tags:
        - Authentication
      security:
        - adminApiKey: []
      parameters:
        - name: appName
          in: query
          description: App name used to store the public key
          required: true
