  /cloud/json/rules:
    post:
      summary: Create a Rule
      operationId: Create a Rule
      description: |-
        When creating a rule, specify a single trigger, one or more states, and one or more actions,
        by referencing the ID's of the triggers / states / actions that are available to the user through the GET API.

        States are OR'd together by default, unless wrapped in an AND block.
        This is to provide flexibility to the developer to implement, but we recommend only defining states inside AND blocks to keep the UI simple to understand.

        If a trigger / state / action requires a parameter, the parameter must be filled out completely.

        It is possible to save a rule that is not complete.  The Care Daily AI Platform will not execute partial rules.
      tags:
        - Rules Engine
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              rule:
                status: 1
                timeZone: US/Pacific
                hidden: false
                trigger:
                  id: 121
                  parameter:
                    - name: schedule
                      value: 0 30 16 * * ?
                    - name: locationId
                      value: '123'
                calendar:
                  - include: false
                    startTime: 3600
                    endTime: 4200
                  - include: false
