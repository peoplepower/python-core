      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID
          required: true
          schema:
            type: integer
        - name: deviceId
          in: query
          description: Device ID's search field to extract parameters from. Multiple values supported.
          schema:
            type: string
        - name: paramName
          in: query
          description: Parameter names to extract. Multiple values supported.
          schema:
            type: string
      responses:
        '200':
          description: Current Device Parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  devices:
