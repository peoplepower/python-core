  /cloud/json/deviceParameters:
    get:
      summary: Get Parameters
      operationId: Get Parameters
      description: |-
        A **parameter** is an individual stream of data between a device and the Care Daily AI Platform.
        The Care Daily AI Platform enables parameters to be optimized for performance and storage, which facilitates massive scalability of the platform.
  
        The Care Daily AI Platform has a single namespace for parameters.
        Each parameter name must contain no spaces, and include a prefix that is separated from the rest of the name by a period ('.').
        We recommend prefixes that contain the initials of the company or organization.
        For example, Care Daily defines a custom parameter `ppc.motionStatus` to turn motion detection on and off on cameras.

        See [parameter unit multipliers](#tag/Creating-Products/Unit-Multipliers).

        Third-party OAuth client supported.
      tags:
        - Products Management
      security:
        - userApiKey: []
      parameters:
        - name: paramName
          in: query
          description: Get a specific parameter
          schema:
            type: string
      responses:
        '200':
          description: Device Parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  deviceParams:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Parameter's name
                        editable:
                          type: boolean
                          description: The user may update this parameter
                        configured:
                          type: boolean
                          description: This parameter may be used as a command to the device
                        systemUnit:
                          type: string
                          description: Default system unit if this is a numeric parameter to store measurements, how its values will be stored
                        scale:
                          type: integer
                          description: For numeric values, how many digits after the decimal point should we store
                        adjustment:
                          type: boolean
                          description: |-
                            A product may define an attribute that describes a supported algorithm that will filter, adjust, and correct data.
                            By turning this flag on, this parameter will apply the type of data correction algorithm defined by the product's attributes it is being used with.
                        description:
                          type: string
                        profiled:
                          type: boolean
                          description: Accept this parameter as a measurement from the device
                        valueType:
                          type: integer
                          description: |-
                            0 = string<br>
                            1 = decimal<br>
                            2 = integer<br>
                            3 = boolean
                        displayInfo:
                          type: object
                          description: Flexible data structure with additional information
                        systemMultiplier:
                          type: string
                          description: Default multiplier if this is a numeric parameter to store measurements. Other specified measurement multipliers will be converted to this multiplier before storing.
                      required:
                        - name
                        - editable
                        - configured
                        - profiled
                        - systemUnit
              example:
                resultCode: 0
                deviceParams:
                  - name: humidity
                    editable: true
                    configured: true
                    systemUnit: g/kg
                    scale: 3
                    adjustment: false
                    description: Absolute humidity is an amount of water vapor
                    profiled: true
                    valueType: 2
                    displayInfo:
                      name: value
                  - name: apiVersion
                    editable: true
                    configured: false
                    systemUnit: version
                    adjustment: false
                    profiled: true
                    valueType: 0
                  - name: power
                    editable: true
                    configured: false
                    systemMultiplier: '1'
                    systemUnit: VA
                    scale: 3
                    adjustment: false
                    profiled: true
                    valueType: 1
                  - name: batteryLevel
                    editable: true
                    configured: false
                    systemMultiplier: '%'
                    systemUnit: int
                    scale: 0
                    adjustment: false
                    profiled: true
                    valueType: 2

    post:
      summary: Create and Update a Parameter
      operationId: Create and Update a Parameter
      description: |-
        A normal developer can update only their own parameters.
        A system administrator can edit any parameter.
      tags:
        - Products Management
      security:
        - userApiKey: []
      requestBody:
        content:
          application/json:
            example:
              deviceParam:
                name: ppc.energy
                description: Real energy
                systemUnit: Wh
                systemMultiplier: k
                valueType: 1
                profiled: true
                configured: false
                historical: 1
                scale: 3
                adjustment: true
            schema:
              type: object
              properties:
                deviceParam:
                  type: object
                  properties:
                    name:
                      type: string
                      description: Parameter's name
                    description:
                      type: string
                      description: Parameter's description
                    systemUnit:
                      type: string
                      description: Default system unit if this is a numeric parameter to store measurements, how its values will be stored
                    systemMultiplier:
                      type: string
                      description: Default multiplier if this is a numeric parameter to store measurements. Other specified measurement multipliers will be converted to this multiplier before storing.
                    valueType:
                      type: integer
                      description: |-
                        0 = string<br>
                        1 = decimal<br>
                        2 = integer<br>
                        3 = boolean
                    profiled:
                      type: boolean
                      description: Accept this parameter as a measurement from the device
                    configured:
                      type: boolean
                      description: This parameter may be used as a command to the device
                    historical:
                      type: integer
                      description: |-
                        0 - Do not save a history of measurements, keep the current state only (least expensive).<br>
                        1 - Update the history either every 15 minutes, or when the value changes significantly (more than 25% for numeric parameters).<br>
                        2 - Update the measurement history with every value change (most expensive).
                    scale:
                      type: integer
                      description: For numeric values, how many digits after the decimal point should we store
                    adjustment:
                      type: boolean
                      description: |-
                        A product may define an attribute that describes a supported algorithm that will filter, adjust, and correct data.
                        By turning this flag on, this parameter will apply the type of data correction algorithm defined by the product's attributes it is being used with.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


  /cloud/json/deviceParameters/{parameterName}:
    delete:
      summary: Delete a Parameter
      operationId: Delete a Parameter
      description: |-
        A normal developer can delete only their own parameters.
        A system administrator can delete any parameter.
      tags:
        - Products Management
      security:
        - userApiKey: []
      parameters:
        - name: parameterName
          in: path
          description: Name of your parameter to delete
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

  /cloud/json/deviceType/{deviceTypeId}/rules:
    get:
      summary: Get Device Type Default Rules
      operationId: Get Default Rules
      description: |-
        This API will allow you to get default rules by device type ID.
        You must be the owner of the device type in order to retrieve them.
      tags:
        - Products Management
