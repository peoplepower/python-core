          description: Survey Questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  survey:
                    type: object
                    properties:
                      surveyKey:
                        type: string
                        description: Survey Key
                      organizationId:
                        type: integer
                        description: ID of organization, which is the owner of the survey
                      status:
                        type: integer
                        description: |-
                          Survey status:<br>
                          0 - inactive (cannot be answered)<br>
                          1 - active
                      answerStatus:
                        type: integer
                        description: |-
                          Survey answer status:<br>
                          0 - open to submit answers<br>
                          1 - closed
                      title:
                        type: string
                        description: Title
                      description:
                        type: string
                        description: Description
                      instructions:
                        type: string
                        description: Answer Instructions
                      pagination:
                        type: boolean
                        description: Pagination flag to display survey in UI by pages
                      startDate:
                        type: string
                        description: Answering process start date
                      startDateMs:
                        type: integer
                        description: Answering process start time
                      notificationDate:
                        type: string
                        description: The last notification send date
                      notificationDateMs:
                        type: integer
