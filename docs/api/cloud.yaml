  /cloud/json/questions:
    get:
      summary: Get Questions
      operationId: Get Questions
      description: |-
        Questions enable bidirectional conversations to take place between the users' location and data analytics services.
        Questions enable the user to add context to the data.

        ### Collection
        
        | Name | Type | Description |
        | ---- | :--: | ----------- |
        | name | string | A unique name for referencing this collection. |
        | mlName | string map | Multiligual name of the collection. |
        | description | string | The titles of the group in various languages. |
        | mlDescription | string map | Multilingual title of the collection. |
        | icon | string | Icon to show next to the collection, if any.|
        | iconFont | string | Icon font. |
        | weight | integer | The weight of the collection |
        | media | string | Media object to display for the collection. |
        | mediaContentType | string | The content type of the media object. |

        ### Question
        
        <table>
          <tr><th>Name</th><th>Type</th><th>Description</th></tr>
          <tr><td>id</td><td>integer</td><td>Question ID assigned by the system</td></tr>
          <tr><td>key</td><td>string</td>
          <td>Unique key to identify this context of this question later, regardless of the description or language of the question itself.</td></tr>
          <tr><td>appInstanceId</td><td>integer</td><td>The bot instance ID, that asks the question.</td></tr>
          <tr><td>creationDateMs</td><td>milliseconds</td><td>Creation timestamp</td></tr>
          <tr><td>question</td><td>string</td><td>The actual text of the question to ask.</td></tr>
          <tr><td>placeholder</td><td>string</td><td>A placeholder for this question.</td></tr>
          <tr><td>editable</td><td>boolean</td>
          <td>If the message is editable, then that means it will show up in a place in the bot where the user can reconfigure the question later.
          This is typically used by bots to enable a UI for settings to configure the bot through questions.</td></tr>
          <tr><td>responseType</td><td>integer</td><td>The type of question (see below)</td></tr>
          <tr><td>displayType</td><td>integer</td>
          <td>Application-layer display type for each type of question (for example, yes/no vs. on/off switch, or a slider that shows integers vs. a slider that shows minutes:seconds)</td></tr>
          <tr><td>deviceId</td><td>string</td><td>Name of the device ID referenced by this question, if any.</td></tr>
          <tr><td>icon</td><td>string</td><td>Icon to show next to the question, if any.</td></tr>
          <tr><td>media</td><td>string</td><td>Reference to some kind of S3 media to play/associate with the question.</td></tr>
          <tr><td>defaultAnswer</td><td>string</td><td>Pre-populated default values for question responses, or force-change the user's response.</td></tr>
          <tr><td>answerFormat</td><td>string</td><td>Regular expression to validate answer format in UI.</td></tr>
          <tr><td>slider</td><td>structure</td>
          <td>
            <table>
              <tr><td>min</td><td>Slider question minimum value</td></tr>
              <tr><td>max</td><td>Slider question maximum value</td></tr>
              <tr><td>inc</td><td>Slider question incremental slider value</td></tr>
              <tr><td>minDesc</td><td>Description of slider question minimum value</td></tr>
              <tr><td>maxDesc</td><td>Description of slider question maximum value</td></tr>
              <tr><td>unitsDesc</td><td>Description of slider question UOM</td></tr>
            </table>
          </td></tr>
          <tr><td>sectionTitle</td><td>string</td><td>The title of a group of questions</td></tr>
          <tr><td>sectionId</td><td>integer</td><td>The ID of a group of questions, and the order in which to display this group</td></tr>
          <tr><td>questionWeight</td><td>integer</td><td>The position of a single question within a group. The higher the weight, the lower down on the list the question appears relative to other questions</td></tr>
          <tr><td>status</td><td>integer</td>
          <td>Question status:
          <br>0 - replaced by a new question (of the same key)
          <br>2 - available, waiting for an answer
          <br>3 - skipped, the user is going to answer it later
          <br>4 - answered
          <br>5 - no answer, the user is not going to answer on it
          </td></tr>
          <tr><td>answerStatus</td><td>integer</td><td>The same as status (used for backward compatibility)</td></tr>
          <tr><td>answer</td><td>string</td><td>User's answer:
          * Boolean: 0 = No, 1 = Yes
          * Multi-choice Single-select: ID of the radio button
          * Multi-choice Multi-select: Bitmask representing response options
          * Slider value
          * Text entered by the user

          Days of the week are represented by a bitmask:
        
          <b>1</b> - Sunday (1 << 0)<br>
          <b>2</b> - Monday (1 << 1)<br>
          <b>4</b> - Tuesday (1 << 2)<br>
          <b>8</b> - Wednesday (1 << 3)<br>
          <b>16</b> - Thursday (1 << 4)<br>
          <b>32</b> - Friday (1 << 5)<br>
          <b>64</b> - Saturday (1 << 6)<br>
          </td></tr>
          <tr><td>answerDate</td><td>string</td><td>When the user has answered this question.</td></tr>
          <tr><td>answerModified</td><td>boolean</td><td>Indicate if the original answer has been modified by other user.</td></tr>
          <tr><td>collectionName</td><td>string</td><td>The name of collection the question belongs to (can be null).</td></tr>
        </table>
        
        ### Response Types
        
        <table>
        <tr><th>Response Type ID</th><th>Name</th><th>Display Type Definitions</th></tr>
        <tr><td>1</td><td>Boolean<br/>0 = False<br/>1 = True</td>
        <td><b>0</b> = On/Off Switch - default.<br/>
        <b>1</b> = Yes/No.<br/>
        <b>2</b> = Single 'Yes' button only, the question's default value is applied to the button's text. Used to trigger bot actions from the UI.<br/>
        <b>3</b> = Thumbs-up / Thumbs-down<br/><br/>
        The answer is a 0 or 1.</td></tr>
        <tr><td>2</td><td>Multiple choice - Single select</td>
        <td><b>0</b> = Radio buttons - default.<br/>
        A list of radio buttons. Requires the "responses" array to list the possible responses.
        Users can only select one response. Available for anonymous aggregated public reporting.<br/><br/>
        <b>1</b> = Drop-down list / Picker.<br/>
        A drop down list. Same as radio buttons, but can contain more items.<br/><br/>
        <b>2</b> = Slider.<br/>
        Slider UI view with predefined stops as an options.<br/><br/>
        <b>3</b> = Modal Bottom Action Sheet.<br/>
        Multiple-choice buttons that slide up from the bottom of the screen.<br/><br/>
        The answer is the ID of the response option.</td></tr>
        <tr><td>4</td><td>Multiple choice - Multiple select</td>
        <td>A list of checkbox options. Requires the "responses" array to list the possible responses.
        Users can select multiple responses. Available for anonymous aggregated public reporting.<br/><br/>
        The answer is a bitmask of selected choices.</td></tr>
        <tr><td>6</td><td>Day of the week</td><td>Day of the week input.
        The UI can optimize itself for selecting days of the week [Sun][XXX][Tue][Wed][Thu][XXX][Sat].<br/><br/>
        <b>0</b> = Select multiple days simultaneously.<br/>
        <b>1</b> = Pick a single day only.<br/><br/>
        The answer is a bitmasked value, days can be logically-OR'd together to specify multiple days of the week, ranging from SUN=0x1 to SAT=0x40.</td></tr>
        <tr><td>7</td><td>Slider</td>
        <td><b>0</b> = Integer select - default.<br/>
        Slider, with a defined minimum and maximum.<br>
        By default, minimum = 0 and maximum = 100.<br/>
        <b>1</b> = Floating point select.<br/>
        <b>2</b> = Minutes:Seconds.<br/><br/>
        Answer is the number selected. For time, the answer is in integer seconds.</td></tr>
        <tr><td>8</td><td>Time in seconds since midnight</td>
        <td><b>0</b> = hours:minutes:seconds (am|pm) - default.<br/>
        This accesses the native UI method of declaring a time.<br/>
        <b>1</b> = hours:minutes (am|pm).<br/><br/>
        The answer is in integer seconds since midnight.</td></tr>
        <tr><td>9</td><td>Date and Time in ISO 8601</td>
        <td><b>0</b> = Date and time.<br/>
        <b>1</b> = Date only.<br/><br/>
        The answer is in ISO 8601 format, `YYYY-MM-DDThh:mm:ss[Z|(+|-)hh:mm]`</td></tr>
        <tr><td>10</td><td>Text box</td>
        <td>Open-ended question.<br/>
        For example, if you were to ask, "Who just walked by the camera?"<br/><br/>
        The answer is a string of text.</td></tr>
        </table>

        ### Response Options

        | Name | Type | Description |
        | ---- | :--: | ----------- |
        | id | integer | ID number for types of questions that feature a list of options |
        | text | string | String for an option on a type of question that features a list of options |
        
        Retrieve requested questions.

        For an individual user, there should be at most one unanswered question available per day, unless the question is urgent.
      tags:
        - Questions
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID to get questions
          required: true
          schema:
            type: integer
        - name: answerStatus
          in: query
          description: >-
            Return questions with requested answer statuses.
            By default questions with statuses 2 and 3 are returned.
            Multiple values are supported.
          schema:
            type: integer
        - name: editable
          in: query
          description: |-
            Filter answered questions:
            <br><b>true</b> - return only editable answered questions,
            <br><b>false</b> - return only not editable answered questions,
            <br>otherwise return all answered questions.
          schema:
            type: boolean
        - name: collectionName
          in: query
          description: Questions collection name filter
          schema:
            type: string
        - name: questionId
          in: query
          description: Extract a specific question ID.
          schema:
            type: integer
        - name: appInstanceId
          in: query
          description: Only retrieve questions for a specific bot.
          schema:
            type: integer
        - name: lang
          in: query
          description: Questions text language. If not set, user's or default language will be used.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of questions to return. The default is unlimited.
          schema:
            type: integer
      responses:
        '200':
          description: Questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        appInstanceId:
                          type: integer
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                        key:
                          type: string
                        editable:
                          type: boolean
                        question:
                          type: string
                        placeholder:
                          type: string
                        collection:
                          type: object
                          properties:
                            name:
                              type: string
                            mlName:
                              type: object
                              additionalProperties:
                                type: string
                              description: Multilingual string map
                            description:
                              type: string
                            mlDescription:
                              type: object
                              additionalProperties:
                                type: string
                              description: Multilingual string map
                            icon:
                              type: string
                            iconFont:
                              type: string
                            media:
                              type: string
                            mediaContentType:
                              type: string
                            weight:
                              type: integer
                        deviceId:
                          type: string
                        icon:
                          type: string
                        displayType:
                          type: integer
                        defaultAnswer:
                          type: string
                        answerFormat:
                          type: string
                        slider:
                          type: object
                          properties:
                            min:
                              type: integer
                            max:
                              type: integer
                            inc:
                              type: integer
                            minDesc:
                              type: string
                            maxDesc:
                              type: string
                            unitsDesc:
                              type: string
                        sectionTitle:
                          type: string
                        sectionId:
                          type: integer
                        questionWeight:
                          type: integer
                        responseType:
                          type: integer
                        responseOptions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              text:
                                type: string
                            required:
                              - id
                              - text
                        answerStatus:
                          type: integer
                        answer:
                          type: string
                        answerDate:
                          type: string
                        answerDateMs:
                          type: integer
                        answerModified:
                          type: boolean
              example:
                resultCode: 0
                questions:
                  - id: 50234
                    appInstanceId: 67
                    creationDate: '2016-03-04T12:12:12-07:00'
                    creationDateMs: 1446537712000
                    key: Question key
                    editable: true
                    question: What do you think of this question?
                    placeholder: Some hint
                    collection:
                      name: Urgent questions
                      mlName:
                        en: Urgent questions
                      description: Some description
                      mlDescription:
                        en: Collection description
                      icon: Icon name
                      iconFont: Icon font
                      media: Reference to media
                      mediaContentType: image/jpeg
                      weight: 10
                    deviceId: optional_device_id
                    icon: optional_icon_name
                    displayType: 0
                    defaultAnswer: '1000'
                    answerFormat: ^\d{4}$
                    slider:
                      min: 0
                      max: 100
                      inc: 5
                      minDesc: min value description
                      maxDesc: max value description
                      unitsDesc: UOM description
                    sectionTitle: Main questions
                    sectionId: 2
                    questionWeight: 3
                    responseType: 4
                    responseOptions:
                      - id: 0
                        text: Red
                      - id: 1
                        text: Yellow
                    answerStatus: 4
                    answer: This is some text input
                    answerDate: '2016-03-04T12:12:12-07:00'
                    answerDateMs: 1446539712000
                    answerModified: false

    put:
      summary: Answer Questions
      operationId: Answer Questions
      description: |-
        After answering a question, if the question is aggregated publicly then the user should also see how other people voted.

        A user can skip the question or prefer to not answer it by setting the corresponding answer status.

        Providing just the question ID the UI app can mark the question as notified.

        Only editable questions can be updated later.
        Typically editable questions are used to configure Composer Apps and add further context to the user's data later.

        The user's tagged attributes should migrate with the question, such that when a new answer is selected,
        any previous tags are removed and new tags are applied.

        The body and response is designed to handle answers to multiple questions simultaneously.
      tags:
        - Questions
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: query
          description: Location ID to answer questions
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              questions:
                - id: 50234
                  answer: true
                - id: 56236
                  answerStatus: 3
                - id: 56237
            schema:
              type: object
              properties:
                questions:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                      answer:
                        type: string
                      answerStatus:
                        type: integer
                    required:
                      - id
      responses:
        '200':
          description: Answered questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        answerStatus:
                          type: integer
                        answer:
                          type: string
                        answerDate:
                          type: string
                        answerDateMs:
                          type: integer
                        answerModified:
                          type: boolean
                      required:
                        - id
                        - answerStatus
                        - answerDate
                        - answerDateMs
                        - answerModified
                        - answer
              example:
                resultCode: 0
                questions:
                  - id: 50234
                    answerStatus: 4
                    answer: 'true'
                    answerDate: '2016-03-04T12:12:12-07:00'
                    answerDateMs: 1446539712000
                    answerModified: false
                  - id: 56234
                    answerStatus: 3
                    answerDate: '2016-03-04T12:12:12-07:00'
                    answerDateMs: 1446539712000
                    answerModified: true
                  - id: 56237
                    answerStatus: 4
                    answer: default answer
                    answerDate: '2016-03-04T12:12:12-07:00'
                    answerDateMs: 1446539712000
                    answerModified: false


  /cloud/json/surveyNotification:
