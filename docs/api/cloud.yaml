  /cloud/json/location/{locationId}/events:
    get:
      summary: Location Scenes History
      operationId: Location Scenes History
      description: |-
        Return location change schemes history in backward order (latest first).

        Source types:

        | Type | Description |
        | :--: | ----------- |
        | 0 | User app |
        | 1 | Rule |
        | 2 | Bot |
        | 9 | Third-party OAuth client |
      tags:
        - Locations
      security:
        - userApiKey: []
      parameters:
        - name: locationId
          in: path
          description: The Location ID
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          description: Start date to begin receiving data
          schema:
            type: string
        - name: endDate
          in: query
          description: End date to stop receiving data. Default is the current date.
          schema:
            type: string
      responses:
        '200':
          description: Location Scenes
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event:
                          type: string
                          description: Scene value
                        eventDate:
                          type: string
                          description: Scene date
                        eventDateMs:
                          type: integer
                        sourceType:
                          type: integer
                          description: Client's type which set the scene
                        sourceAgent:
                          type: string
                          description: HTTP User-Agent header value
                        comment:
                          type: string
                      required:
                        - event
                        - eventDate
                        - eventDateMs
              example:
                resultCode: 0
                events:
                  - event: HOME
                    eventDate: '2015-10-01T18:00:00Z'
                    eventDateMs: 1443722400000
                    sourceType: 0
                    sourceAgent: Care/4.0.19 (iPhone; iOS 10.3.3; Scale/2.00)
                  - event: AWAY
                    eventDate: '2015-09-15T18:00:00Z'
                    eventDateMs: 1442340000000
                    sourceType: 1
                    comment: Did not detect motions for one hour
                  - event: HOME
                    eventDate: '2015-09-01T18:00:00Z'
                    eventDateMs: 1441130400000
                    sourceType: 2
                    comment: Recognized a tenant


