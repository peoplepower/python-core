  /cloud/json/notifications:
    post:
      summary: Send a Notification
      operationId: Send a Notification
      description: |-
        Sends an arbitrary push notification or email to the user.
        If you're sending an email, you may include a subject and specify whether the email is in HTML format or plain text.
        Push notification messages are limited by the standard push notification payload size.

        This API allows to include inline graphics as an attachment.

        Attached content can be set directly. In this case all attachment fields are mandatory. The content field contains the Base64 encoded binary image content.

        Or a device file thumbnail can be used as the content. In this case all other fields are optional.

        The generated by the app email content or the template should include correct references to inline graphics content ID's with "cid:" prefixes.
        For example `<img src="cid:inlineImageId">`.

        Location users to notify can be selected by userCategories or user ID's provided in the request body.
        
        Notification types:
        
        | Type | Descrption |
        | :--: | ---------- |
        | 1 | Marketing |
        | 3 | Rules |
        | 4 | Bots default |
        | 6 | New account creation follow-up |
        | 7 | Device alert |
        | 8 | App default |
        | 11 | Account issues |
        | 13 | OAuth client |
        | 16 | Device firmware update |
        | 17 | SMS chat |
        | 18 | Location |
        | 19 | Bot error |
        | 20 | Badge |
        | 21 | Community |
        | 22 | Bot report |
        | 23 | Message |
      tags:
        - User Communications
      security:
        - userApiKey: []
      parameters:
        - name: userId
          in: query
          description: Send a notification to this user by an administrator
          schema:
            type: integer
        - name: locationId
          in: query
          description: Send a notification to users on this location
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Use templates of specific organization
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              brand: care
              userCategories:
                - 1
                - 2
              users:
                - 123
                - 234
                - 345
              language: en
              pushMessage:
                type: 8
                badgeType: 1
                template: directoryName/PushTemplateName.vm
                sound: sound.wav
                content: Push notification text
                smsFallback: true
                smsContent: SMS fallback text
                title: Title
                subtitle: Subtitle
                category: Category Name
                model:
                  key0: value0
                  key1: value1
                  key2: value2
                info:
                  field0: info0
                  field1: info1
              emailMessage:
                subject: Subject
                html: true
                template: directoryName/EmailTemplateName.vm
                content: Email message text
                model:
                  key0: value0
                  key1: value1
                  key2: value2
                attachments:
                  - name: imageName.jpg
                    content: /9j/4AAQSkZJRgABAgEAAAAAAAD/4
                    contentType: image/jpeg
                    contentId: inlineImageId
                  - name: fileName.jpg
                    deviceFileId: 123456
                    contentId: inlineFileId
              smsMessage:
                categories:
                  - 0
                  - 1
                template: directoryName/SmsTemplateName.vm
                content: Sms message text
                individual: true
                model:
                  key0: value0
                  key1: value1
                  key2: value2
              deviceMessage:
                deviceId: optional device ID
                title: string
                text: string
                from: string
                duration: 0
                icon: string
                muted: true
                imageUrl: string
                image: base64 encoded image
            schema:
              type: object
              properties:
                brand:
                  type: string
                  description: Notification template brand
                userCategories:
                  type: array
                  description: Notify location uses of these categories
                  items:
                    type: integer
                users:
                  type: array
                  description: Notify these uses
                  items:
                    type: integer
                language:
                  type: string
                  description: Message language
                pushMessage:
                  type: object
                  description: Push notification
                  properties:
                    type:
                      type: integer
                      description: Notification type
                    badgeType:
                      type: integer
                      description: Badge type
                    template:
                      type: string
                      description: Template to generate notification text
                    sound:
                      type: string
                    content:
                      type: string
                      description: Notification text
                    smsFallback:
                      type: boolean
                      description: Send SMS, if the user does not have valid notification tokens
                    smsContent:
                      type: string
                      description: Fallback SMS text
                    title:
                      type: string
                    subtitle:
                      type: string
                    category:
                      type: string
                    model:
                      type: object
                      additionalProperties:
                        type: string
                      description: Notification template parameters key/value string map
                    info:
                      type: object
                      additionalProperties:
                        type: string
                      description: Additional push notification parameters key/value string map
                emailMessage:
                  type: object
                  description: Email
                  properties:
                    subject:
                      type: string
                      description: Email subject
                    html:
                      type: boolean
                      description: Send email in HTTP format
                    template:
                      type: string
                      description: Template to generate email text
                    content:
                      type: string
                      description: Email text
                    model:
                      type: object
                      additionalProperties:
                        type: string
                      description: Notification template parameters key/value string map
                    attachments:
                      type: array
                      description: Email attachments
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Attachment name
                          content:
                            type: string
                            description: Attachment Base64 encoded content
                          contentType:
                            type: string
                            description: Attachment content type
                          contentId:
                            type: string
                            description: Inline content ID
                          deviceFileId:
                            type: integer
                            description: Use this device file thumbnail as the content
                        required:
                          - name
                          - contentId
                smsMessage:
                  type: object
                  properties:
                    template:
                      type: string
                      description: Template to generate message text
                    content:
                      type: string
                      description: Message text
                    individual:
                      type: boolean
                      description: If this message to be sent to individual users or to a chat group
                    model:
                      type: object
                      additionalProperties:
                        type: string
                      description: Notification template parameters key/value string map
                deviceMessage:
                  type: object
                  description: Message to be delivered to an IoT device
                  properties:
                    deviceId:
                      type: string
                    title:
                      type: string
                    text:
                      type: string
                    from:
                      type: string
                    duration:
                      type: integer
                    icon:
                      type: string
                    muted:
                      type: boolean
                    imageUrl:
                      type: string
                    image:
                      type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

    get:
      summary: Get Notifications
      operationId: Get Notifications
      description: |-
        Delivery types:

        | Delivery | Description |
        | :------: | ----------- |
        | 1 | Push notification |
        | 2 | Email |
        | 3 | Outgoing SMS |
        | 4 | Incoming SMS |

        Source types:

        | Source | Description |
        | :----: | ----------- |
        | 0 | External API call |
        | 1 | Rule |
        | 2 | Bot |
        | 4 | Device firmware update |
        | 5 | Internal system logic like account issue |
        | 6 | Cloud business logic |
        | 7 | External incoming message |
      tags:
        - User Communications
      security:
        - userApiKey: []
      parameters:
        - name: userId
          in: query
          description: Get notifications for this user by an administrator
          schema:
            type: integer
        - name: startDate
          in: query
          description: Start date to select notifications
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: End date to select notifications. Default is the current date.
          schema:
            type: string
        - name: locationId
          in: query
          description: Get notifications related to this location
          schema:
            type: integer
        - name: sourceType
          in: query
          description: Filter by source type
          schema:
            type: integer
        - name: deliveryType
          in: query
          description: Filter by delivery type
          schema:
            type: integer
        - name: notificationType
          in: query
          description: Filter by notification type
          schema:
            type: integer
      responses:
        '200':
          description: Notifications history
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  notifications:
                    type: array
                    items:
                      type: object
                      properties:
                        sendDate:
                          type: string
                        sendDateMs:
                          type: integer
                        deliveryType:
                          type: integer
                        notificationType:
                          type: integer
                        locationId:
                          type: integer
                        brand:
                          type: string
                        templateName:
                          type: string
                        language:
                          type: string
                        sound:
                          type: string
                        badge:
                          type: integer
                        sentCount:
                          type: integer
                        sourceType:
                          type: integer
                        sourceId:
                          type: integer
                        messageText:
                          type: string
              example:
                resultCode: 0
                notifications:
                  - sendDate: '2018-06-12T12:24:48Z'
                    sendDateMs: 1419137929000
                    deliveryType: 1
                    notificationType: 7
                    locationId: 123
                    brand: care
                    templateName: alert/motion_detected.vm
                    language: en
                    sound: default
                    badge: 1
                    sentCount: 3
                    sourceType: 6
                    sourceId: 1234
                    messageText: Motion detected on your camera


