        - userApiKey: []
        - botApiKey: []
      parameters:
        - name: locationId
          in: path
          description: Location ID
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          description: Return states with dates greater or equal to this value
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: >-
            Return states with dates less than this value.
            If not set, only states with dates exactly equal to startDate will be returned.
          schema:
            type: string
        - name: name
          in: query
          description: State name(s), multiple values supported
          schema:
            type: string
        - name: field
          in: query
          description: State field to get or filter by. Multiple values are required for deeper object level.
          schema:
            type: string
        - name: keepParent
          in: query
          description: Use the field parameter only for filtering.
          schema:
            type: boolean
        - name: aggregation
          in: query
          description: Aggregate field values by 1 = hour, 2 = day, 3 = month, 4 = week
          schema:
            type: integer
      responses:
        '200':
          description: Time-series States
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  states:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: State's name
                        stateDate:
                          type: string
                          description: State's date
                        stateDateMs:
                          type: integer
                        value:
                          type: object
                          description: State's value
                        avg:
                          type: object
                          description: Field values aggregation
                          properties:
                            value:
                              type: integer
                            count:
                              type: integer
                      required:
                        - stateDate
                        - stateDateMs
              example:
                resultCode: 0
                states:
                  - name: stateName
                    stateDate: '2018-10-01T03:05:07'
                    stateDateMs: 1537692964000
                    value:
                      field0: 123
                      field1: AAA
                  - stateDate: '2018-10-01'
                    stateDateMs: 1537692964000
                    avg:
                      value: 1.23
                      count: 10


  /cloud/json/devices:
    post:
      summary: Register a Device
      operationId: Register a Device
      description: |-
        Registration response will describe how the device should connect to the cloud server instance.

        <table>
        <tr><th>Name</th><th>Description</th><th>Details</th></tr>
        <tr>
          <td>deviceId</td><td>string</td>
          <td>Device IDs are globally unique, must be 50 or less characters long, and must not contain '/', '%', '#', or '+' characters.</td>
        </tr>
        <tr>
          <td>authToken</td>
          <td>boolean</td><td>Standard SSL only supports one-way authentication.
          The Care Daily AI Platform takes security a leap forward by allowing the use of an optional cryptographic authentication token to be used for bi-directional authentication of a device.
          If requested, your device will be responsible for securely storing the generated authentication token and including it in all future HTTP requests to the Care Daily AI Platform.<br>
          <b>true</b> - Request an authentication token<br>
          <b>false</b> - Do not use an authentication token</td>
        </tr>
        <tr>
          <td>startDate</td><td>In milliseconds or ISO 8601</td>
          <td>The absolute date timestamp when the device is registered to the user's account.
          The Care Daily AI Platform will not store any data from a device before its registration time.
          For example, if you have historical data from this device that you want associated with the user's account,
          then the registration time should be set in the past to be able to store all that historical data.
          The default start time is the current time on the server.</td>
        </tr>
        </table>
      tags:
        - Devices
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: query
          description: Globally unique device identifier for this device. Must not include '/', '%', '#', or '+' characters.
          schema:
            type: string
        - name: locationId
          in: query
          description: The Location to add this device to. Mandatory when called by a user.
          schema:
            type: integer
        - name: proxyId
          in: query
          description: Send the add device command to this proxy
          schema:
            type: string
        - name: deviceType
          in: query
          description: Type of the device being registered. Optional, but highly recommended you specify this.
          schema:
            type: integer
        - name: authToken
          in: query
          description: |-
            <b>true</b> - Request an authentication token
            <br><b>false</b> - No authentication token necessary
          schema:
            type: boolean
        - name: startDate
          in: query
          description: |-
            Timestamp at which to register this device.
            <br>The Care Daily AI Platform will ignore inbound measurements with a timestamp before the registration time.
            <br>Default is the current time.
          schema:
            type: string
        - name: desc
          in: query
          description: Device nickname / description
          schema:
            type: string
        - name: goalId
          in: query
          description: Device usage goal ID
          schema:
            type: integer
        - name: modelId
          in: query
          description: Device model ID
          schema:
            type: integer
        - name: userId
          in: query
          description: User ID associated with a personal device
          schema:
            type: integer
        - name: ACTIVATION_KEY
          in: header
          description: Device activation key, if the API key is not provided
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              properties:
                - name: username
                  value: admin
                - name: port
                  index: '01'
                  value: '1234'
            schema:
              type: object
              properties:
                properties:
                  type: array
                  description: Name/value properties
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                      index:
                        type: string
                    required:
                      - name
                      - value
      responses:
        '200':
          description: Device regisration result
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  deviceId:
                    type: string
                  authToken:
                    type: string
                  deviceType:
                    type: integer
                  locationId:
                    type: integer
                  exist:
                    type: boolean
                  config:
                    type: object
                    description: Flexible structure object depending on the device type for device provisioning and initial configuration
                  host:
                    type: string
                  port:
                    type: integer
                  useSSL:
                    type: boolean
              example:
                resultCode: 0
                deviceId: globally-unique-device-id
                authToken: generated device authentication token
                deviceType: 123
                locationId: 456
                exist: false
                host: esp.peoplepowerco.com
                port: 8443
                useSSL: true

