        - adminApiKey: []
      parameters:
        - name: appName
          in: query
          description: App name used to store the public key
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              publicKey: UugJtGEXxMfnVyql4N4crIAfqOUlJ=
            schema:
              type: object
