          description: Redirect to the external application web page
          headers:
            Location:
              schema:
                type: string
                description: Redirect URL


  /espapi/oauth/token:
    post:
      summary: Get Access Token
      operationId: Get Access Token
      description: |-
        This API uses an authorization code or a previously generated refresh token to grant new access to the Care Daily AI Platform.
        It returns a new access token, a token type, expiration time, and a refresh token.

        Then the received Access Token may be used instead of the user's API key to access data from the user's account.

        The API requires the third party client ID and secret are separated by a single colon (":") character,
        within a Base64 encoded string and the "Basic " prefix as described in https://tools.ietf.org/html/rfc2617#section-2 to be sent in the `Authorization` header.
        For example:

        `Authorization: Basic QWxhZGRpbjpvcGVuIHNlc2FtZQ==`

        All parameters should be sent in the `application/x-www-form-urlencoded` format. However, query parameters are supported as well.

        The `grant_type` parameter is not used, when the authorization code or refresh token are provided, otherwise only "client_credentials" is supported.

        If an error occurs, an `error_code` and `error_description` will be returned.

        Error codes include:
        * `unauthorized_client` - Invalid authorization header
        * `invalid_request` - Missing input parameters
        * `invalid_client` - The Client ID or Secret is invalid
        * `invalid_token` - The authorization code or refresh token is incorrect
        * `server_error` - Internal server error
      tags:
        - Clouds Integration
      security:
        - basicOAuth: []
      parameters:
        - name: code
          in: query
          description: The authorization code
          schema:
            type: string
        - name: refresh_token
          in: query
          description: A refresh token previously received from getting an access token with an authorization code
          schema:
            type: string
        - name: client_id
          in: query
          description: The client ID, if not encoded in the Authorization header or body
          schema:
            type: string
        - name: client_secret
          in: query
          description: The client secret, if not encoded in the Authorization header or body
          schema:
            type: string
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
              example:
                access_token: GHKLMN7890
                token_type: Bearer
                expires_in: 15000000
                refresh_token: 7890GHKLMN


