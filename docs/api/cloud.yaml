  /cloud/json/deviceTypes:
    get:
      summary: Get Supported Device Types
      operationId: Get Device Types
      description: Return device types supported on this instance of the Care Daily AI Platform. Third-party OAuth client supported.
      tags:
        - Products Management
      security:
        - userApiKey: []
      parameters:
        - name: deviceType
          in: query
          description: Specific device type to look up details on
          schema:
            type: integer
        - name: attrName
          in: query
          description: Return device types, which have an attribute with this name
          schema:
            type: string
        - name: attrValue
          in: query
          description: Also filter the response by the attribute value
          schema:
            type: string
        - name: own
          in: query
          description: Return only device types created by this user
          schema:
            type: boolean
        - name: simple
          in: query
          description: Return only device type fields without user and attributes information
          schema:
            type: boolean
        - name: organizationId
          in: query
          description: Return only device types related to the specific organization
          schema:
            type: integer
      responses:
        '200':
          description: Device Types
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  deviceTypes:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          description: Device type ID
                        name:
                          type: string
                          description: Name of the device type
                        editable:
                          type: boolean
                          description: Can be updated by the user
                        createdBy:
                          type: object
                          description: User who created it
                          properties:
                            id:
                              type: integer
                            userName:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            email:
                              type: object
                              properties:
                                email:
                                  type: string
                                verified:
                                  type: boolean
                                status:
                                  type: integer
                        creationDate:
                          type: string
                        creationDateMs:
                          type: integer
                        attributes:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              value:
                                type: string
                            required:
                              - name
                              - value
                      required:
                        - id
                        - name
                        - attributes
              example:
                resultCode: 0
                deviceTypes:
                  - id: 10012
                    name: Unit Test Device Type
                    editable: true
                    createdBy:
                      id: 123
                      userName: john
                      firstName: John
                      lastName: Smith
                      email:
                        email: john@smith.com
                        verified: true
                        status: 0
                    creationDate: '2015-02-27T15:30:21Z'
                    creationDateMs: 1425051021000
                    attributes:
                      - name: acceptsCommands
                        value: '0'
                      - name: category
                        value: '1'
                      - name: desc
                        value: description
                  - id: 10013
                    name: Unit Test Device Type 2
                    editable: true
                    createdBy:
                      id: 123
                      userName: john
                      firstName: John
                      lastName: Smith
                      email:
                        email: john@smith.com
