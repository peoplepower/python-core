                filesAction: 1
                thumbnail: true
                totalFilesSpace: 10000000
                usedFilesSpace: 1000000
                fragments: 3

    get:
      summary: Download Device File
      operationId: Download Device File
      description: |-
        The `Range` HTTP Header is optional, and will only return a chunk of the total content.
        If used, it is recommended to select a range that is a multiple of 10240 bytes.

        See https://www.rfc-editor.org/rfc/rfc9110.html#name-accept-ranges for a discussion on the header options.

        A temporary API key provided in the query parameter may be used to forward a link to other part of the app.
        A temporary API key can be obtained by calling the loginByKey API.
        It is expired soon after receiving.
      tags:
        - Device Files
      security:
        - userApiKey: []
        - tempApiKey: []
        - botApiKey: []
      parameters:
        - name: fileId
          in: path
          description: File ID to download
          required: true
          schema:
            type: integer
        - name: thumbnail
          in: query
          description: >-
            <b>true</b> - Download the thumbnail for this file
            <br><b>false</b> - Download the actual file, not the thumbnail, default
          schema:
            type: boolean
        - name: Range
          in: header
          description: Data range
          example: bytes=10240-20479
          schema:
            type: string
      responses:
        '200':
          description: OK. The file content is returned in full.
          headers:
            Accept-Ranges:
              schema:
                type: string
                description: Accepted content range values in bytes
            Content-Type:
              schema:
                type: string
                description: The file's content type
            Content-Length:
              schema:
                type: integer
            Last-Modified:
              schema:
                type: string
                description: The file's creation date
            Content-Range:
              schema:
                type: string
                description: >-
                  If the `Range` of the content was requested.
                  This will be in the format of `bytes {start}-{end}/{total size}`.
                  For example: `Content-Range: bytes 21010-47021/47022`.
            Content-Disposition:
              schema:
                type: string
                description: The filename when the whole file is requested.
            ETag:
              schema:
                type: string
                description: The file's ID
        '204':
          description: No Content. The file exist, but the content is not available for this request.
        '206':
          description: Partial Content. The file content is partially returned.
          headers:
            Accept-Ranges:
              schema:
                type: string
                description: Accepted content range values in bytes
            Content-Type:
              schema:
                type: string
                description: The file's content type
            Content-Length:
              schema:
                type: integer
            Last-Modified:
              schema:
                type: string
                description: The file's creation date
            Content-Range:
              schema:
                type: string
                description: >-
                  If the `Range` of the content was requested.
                  <br>This will be in the format of `bytes {start}-{end}/{total size}`.
                  <br>For example: `Content-Range: bytes 21010-47021/47022`.
            Content-Disposition:
              schema:
                type: string
                description: The filename when the whole file is requested.
            ETag:
              schema:
                type: string
                description: The file's ID
        '401':
          description: Unauthorized. The API key is wrong.
        '404':
          description: Not Found. The file does not exist.
        '500':
          description: Internal error. Something went wrong on our side.

    put:
      summary: Update Device File Attributes
      operationId: Update Device File Attributes
      description: |-
        Update the file's attributes to declare, if the file has been viewed or not,
        if it's a favourite file and shouldn't be auto-deleted, and whether the file is available for public access.

        The file publisher (camera) can update it as completed.

        Also, this API can be used to recover deleted files.
      tags:
        - Device Files
      security:
        - userApiKey: []
      parameters:
        - name: fileId
          in: path
          description: File ID to update
          required: true
          schema:
            type: integer
        - name: locationId
          in: query
          description: File location ID
          required: true
          schema:
            type: integer
        - name: proxyId
          in: query
          description: Device ID of the proxy that this file is being uploaded through
          schema:
            type: string
        - name: incomplete
          in: query
          description: Set it to false for updating the file as completed
          schema:
            type: boolean
        - name: recover
          in: query
          description: Set it to true to recover a deleted file
          schema:
            type: boolean
        - name: pure
          in: query
          description: <b>true</b> - the server will not make any modification of the file content
          schema:
            type: boolean
        - name: PPCAuthorization
          in: header
          description: Device's authorization (required for updating file as completed)
          example: esp token=ABC12345
          schema:
            type: string
      requestBody:
        content:
          application/json:
            example:
              file:
                viewed: true
                favourite: true
                publicAccess: true
            schema:
              type: object
              properties:
                file:
                  type: object
                  properties:
                    viewed:
                      type: boolean
                    favourite:
                      type: boolean
                    publicAccess:
                      type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0

