                          type: array
                          items:
                            type: object
                            properties:
                              index:
                                type: string
                              value:
                                type: string
                            required:
                              - index
                              - value
                      required:
                        - startDate
                        - startDateMs
                        - endDate
                        - endDateMs
                        - energy
                        - cost
              example:
                resultCode: 0
                usages:
                  - startDate: '2014-10-20T10:00:00-07:00'
                    startDateMs: 1413824400000
