  /cloud/json/devices/{deviceId}/currentEnergyUsage:
    get:
      summary: Get Device Energy Usage
      operationId: Get Device Energy Usage
      description: |-
        Return a device's values of power, billing rate, its associated cost, total energy usage, and its cost for the current day, month and year.

        By default, this API returns total device values.
        To get the values for the specific part of a device, use an index number (assuming the device supports parameters with index numbers).

        This method uses the time zone ID from the device location to calculate values.
        If the time zone is not set, it uses the default server time zone.
      tags:
        - Energy Management
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: path
          description: Device ID for which to obtain energy-related data
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Request information on a specific location
          required: true
          schema:
            type: integer
        - name: index
          in: query
          description: Optional index number to obtain energy-related data from a part of a device (assuming the device supports index numbers)
          schema:
            type: string
      responses:
        '200':
          description: Current Device Energy Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  power:
                    type: object
                    properties:
                      amountPerHour:
                        type: string
                      watts:
                        type: string
                      currentRate:
                        type: string
                      lastUpdateDate:
                        type: string
                      lastUpdateDateMs:
                        type: integer
                  energy:
                    type: object
                    properties:
                      amount:
                        type: string
                      kwh:
                        type: string
                      amountYTD:
                        type: string
                      kwhYTD:
                        type: string
                      amountDTD:
                        type: string
                      kwhDTD:
                        type: string
              example:
                resultCode: 0
                power:
                  amountPerHour: '0.8260'
                  watts: '8260'
                  currentRate: '0.1000'
                  lastUpdateDate: '2014-06-21T22:48:35-07:00'
                  lastUpdateDateMs: 1403416115000
                energy:
                  amount: '211.60'
                  kwh: '2116.000'
                  amountYTD: '1643.20'
                  kwhYTD: '16644.000'
                  amountDTD: '0.00'
                  kwhDTD: '0.000'


  /cloud/json/devices/{deviceId}/energyUsage/{aggregation}/{startDate}:
    get:
      summary: Get Aggregated Energy Usage for a Device
      operationId: Get Aggregated Energy Usage for a Device
      description: |-
        Return energy usage at a device level for a specified period of time, and aggregated by different periods.

        This method uses the time zone ID from the device location to calculate values.
        If the time zone is not set, it uses the default server time zone.
      tags:
        - Energy Management
      security:
        - userApiKey: []
      parameters:
        - name: deviceId
          in: path
          description: Device ID for which to obtain aggregated energy usage
          required: true
          schema:
            type: string
        - name: aggregation
          in: path
          description: |-
            How to aggregate / split the energy data<br>
            <b>0</b> - Don't split the data<br>
            <b>1</b> - Split by Hour<br>
            <b>2</b> - Split by Day<br>
            <b>3</b> - Split by Month<br>
            <b>4</b> - Split on a 7-day week from Sunday to Saturday<br>
            <b>5</b> - Split on a 5-day week from Monday to Friday, and then a 2-day weekend
          required: true
          schema:
            type: integer
        - name: startDate
          in: path
          description: Start date to begin aggregating energy measurements
          required: true
          schema:
            type: string
        - name: endDate
          in: query
          description: End date to stop aggregating energy measurements. Default is the current date.
          schema:
            type: string
        - name: reduceNoise
          in: query
          description: Return tiny energy values less than defined threshold as zero
          schema:
            type: boolean
        - name: locationId
          in: query
          description: Request information on a specific location
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Aggregated Energy Usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
                  usages:
                    type: array
                    items:
                      type: object
                      properties:
                        startDate:
                          type: string
                        startDateMs:
                          type: integer
                        endDate:
                          type: string
                        endDateMs:
                          type: integer
                        energy:
                          type: array
                          items:
                            type: object
                            properties:
                              index:
                                type: string
                              value:
                                type: string
                            required:
