  /cloud/json/appfiles/{fileId}:
    get:
      summary: Download Application File
      operationId: Download App File
      description: |-
        The `Range` HTTP Header is optional, and will only return a chunk of the total content.

        A temporary API key provided in the query parameter may be used to forward a link to other part of the app.
        A temporary API key can be obtained by calling the loginByKey API.
        It is expired soon after receiving.
      tags:
        - Application Files
      security:
        - userApiKey: []
        - tempApiKey: []
      parameters:
        - name: fileId
          in: path
          description: File ID to download
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          description: User ID to download the file as an administrator
          schema:
            type: integer
        - name: locationId
          in: query
          description: Location ID to download the file as an administrator
          schema:
            type: integer
        - name: attach
          in: query
          description: Download the file content as an attachments with the Content-Disposition header
          schema:
            type: boolean
        - name: Range
          in: header
          description: Optional request of a part of the file content
          example: bytes=10240-20479
          schema:
            type: string
      responses:
        '200':
          description: OK. The file content is returned in full.
          headers:
            Accept-Ranges:
              schema:
                type: string
                description: Accepted content range values in bytes
            Content-Type:
              schema:
                type: string
                description: The file's content type
            Content-Length:
              schema:
                type: integer
            Content-Transfer-Encoding:
              schema:
                type: string
                description: binary when the whole file is requested as attachment
            Content-Disposition:
              schema:
                type: string
                description: The filename when the whole file is requested as attachment.
        '206':
          description: Partial Content. The file content is partially returned.
          headers:
            Accept-Ranges:
              schema:
                type: string
                description: Accepted content range values in bytes
            Content-Type:
              schema:
                type: string
                description: The file's content type
            Content-Length:
              schema:
                type: integer
            Content-Range:
              schema:
                type: string
                description: >-
                  If the `Range` of the content was requested.
                  <br>This will be in the format of `bytes {start}-{end}/{total size}`.
                  <br>For example: `Content-Range: bytes 21010-47021/47022`.
        '401':
          description: Unauthorized. The API key is wrong.
        '404':
          description: Not Found. The file does not exist.
        '500':
          description: Internal error. Something went wrong on our side.

    delete:
      summary: Delete Application File
      operationId: Delete App File
      tags:
        - Application Files
      security:
        - userApiKey: []
      parameters:
        - name: fileId
          in: path
          description: File ID to delete
          required: true
          schema:
            type: integer
        - name: userId
          in: query
          description: User ID to delete the file as an administrator
          schema:
            type: integer
        - name: locationId
          in: query
          description: Location ID to delete the file as an administrator
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


