  /cloud/appstore/stream:
    post:
      summary: Stream message
      operationId: Stream message
      description: |-
        Applications can send data messages to bots. These messages are transient.
        They're not stored or logged, but bots can choose to record them in the history by using Narratives.
        
        The message can be sent to bots that are subscribed on the specific data stream address, or bots of specific instance ID's.
        
        End users can send messages to bots that only purchased by them, or organizational bots that operate above their location.
        
        Organization administrators can send messages to organizational bots in the same organization, and to non-organization and individual bots of users within this organization.
        
        The end user IDs and the bot IDs (appInstanceId) are specified in the request body.
      tags:
        - Synthetic APIs
      security:
        - userApiKey: []
      parameters:
        - name: scope
          in: query
          description: |-
            Bitmask to feed organizational and location bots:
            <br>1 - individual
            <br>2 - organizational
          required: true
          schema:
            type: integer
        - name: address
          in: query
          description: Data stream address
          required: true
          schema:
            type: string
        - name: locationId
          in: query
          description: Send data to bots of this location. Mandatory for end users.
          schema:
            type: integer
        - name: organizationId
          in: query
          description: Send data to bots of users of the specific organization, used by an administrator
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            example:
              locations:
                - 34122
                - 15689
              bots:
                - 567
                - 893
              feed:
                key0: value0
                key1: value1
            schema:
              type: object
              properties:
                locations:
                  type: array
                  items:
                    type: integer
                bots:
                  type: array
                  items:
                    type: integer
                feed:
                  type: object
                  description: Flexible structure object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultCode:
                    type: integer
              example:
                resultCode: 0


